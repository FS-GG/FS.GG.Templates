name: svg-foundation-candidate

on:
  pull_request:
    paths:
      - 'templates/fs-gg-fable-game/**'
      - 'tests/composition/fable-game/verify-svg-foundation.sh'
      - 'tests/composition/fable-game/verify-svg-preview-packet.sh'
      - 'tests/composition/fable-game/svg-preview-observe.mjs'
      - 'tests/composition/fable-game/svg-authoring-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-authoring-source.sh'
      - 'tests/composition/fable-game/verify-svg-authoring-candidate.sh'
      - 'tests/composition/fable-game/observe-svg-authoring-orca.sh'
      - 'tests/composition/fable-game/svg-authoring-orca.py'
      - 'tests/composition/fable-game/svg-input-observe.mjs'
      - 'tests/composition/fable-game/svg-player-input-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-input-candidate.sh'
      - 'tests/composition/fable-game/svg-runtime-player-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-runtime-candidate.sh'
      - 'tests/composition/fable-game/svg-present-player-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-present-candidate.sh'
      - 'tests/composition/fable-game/observe-svg-input-orca.sh'
      - 'tests/composition/fable-game/svg-input-orca.py'
      - 'scripts/stage-svg-authoring-candidate.sh'
      - 'scripts/stage-rendering-authoring-packet.sh'
      - 'scripts/stage-svg-input-candidate.sh'
      - 'scripts/stage-rendering-input-packet.sh'
      - 'scripts/stage-game-runtime-packet.sh'
      - 'scripts/stage-rendering-runtime-packet.sh'
      - 'scripts/stage-svg-runtime-candidate.sh'
      - 'scripts/stage-rendering-present-packet.sh'
      - 'scripts/stage-game-present-packet.sh'
      - 'scripts/stage-audio-present-packet.sh'
      - 'scripts/stage-svg-present-candidate.sh'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'docs/reports/2026-09-12-svg-scene-02-preview-a-handoff.md'
      - 'docs/reports/2026-09-13-svg-input-candidate.md'
      - 'docs/reports/2026-09-13-svg-runtime-candidate.md'
      - 'docs/reports/2026-09-13-svg-present-candidate.md'
      - '.github/workflows/svg-foundation-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'templates/fs-gg-fable-game/**'
      - 'tests/composition/fable-game/verify-svg-foundation.sh'
      - 'tests/composition/fable-game/verify-svg-preview-packet.sh'
      - 'tests/composition/fable-game/svg-preview-observe.mjs'
      - 'tests/composition/fable-game/svg-authoring-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-authoring-source.sh'
      - 'tests/composition/fable-game/verify-svg-authoring-candidate.sh'
      - 'tests/composition/fable-game/observe-svg-authoring-orca.sh'
      - 'tests/composition/fable-game/svg-authoring-orca.py'
      - 'tests/composition/fable-game/svg-input-observe.mjs'
      - 'tests/composition/fable-game/svg-player-input-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-input-candidate.sh'
      - 'tests/composition/fable-game/svg-runtime-player-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-runtime-candidate.sh'
      - 'tests/composition/fable-game/svg-present-player-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-present-candidate.sh'
      - 'tests/composition/fable-game/observe-svg-input-orca.sh'
      - 'tests/composition/fable-game/svg-input-orca.py'
      - 'scripts/stage-svg-authoring-candidate.sh'
      - 'scripts/stage-rendering-authoring-packet.sh'
      - 'scripts/stage-svg-input-candidate.sh'
      - 'scripts/stage-rendering-input-packet.sh'
      - 'scripts/stage-game-runtime-packet.sh'
      - 'scripts/stage-rendering-runtime-packet.sh'
      - 'scripts/stage-svg-runtime-candidate.sh'
      - 'scripts/stage-rendering-present-packet.sh'
      - 'scripts/stage-game-present-packet.sh'
      - 'scripts/stage-audio-present-packet.sh'
      - 'scripts/stage-svg-present-candidate.sh'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'docs/reports/2026-09-12-svg-scene-02-preview-a-handoff.md'
      - 'docs/reports/2026-09-13-svg-input-candidate.md'
      - 'docs/reports/2026-09-13-svg-runtime-candidate.md'
      - 'docs/reports/2026-09-13-svg-present-candidate.md'
      - '.github/workflows/svg-foundation-candidate.yml'

jobs:
  candidate-package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Pack template and verify selected candidate consumer
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          dotnet pack FS.GG.Templates.csproj -c Release -o "$work"
          tests/composition/fable-game/verify-svg-foundation.sh \
            "$(find "$work" -maxdepth 1 -name '*.nupkg' -print -quit)" \
            "$work/qualification"
      - name: Verify authoring composition and player isolation
        run: bash tests/composition/fable-game/verify-svg-authoring-source.sh
      - name: Rehearse exact preview packet and retained adoption
        run: tests/composition/fable-game/verify-svg-preview-packet.sh "${RUNNER_TEMP}/svg-foundation-preview-packet"
      - name: Upload exact preview packet evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-foundation-preview-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/svg-foundation-preview-packet/feed/*.nupkg
            ${{ runner.temp }}/svg-foundation-preview-packet/preview-packet.json
            ${{ runner.temp }}/svg-foundation-preview-packet/browser-observation.json
            ${{ runner.temp }}/svg-foundation-preview-packet/adoption.log
            ${{ runner.temp }}/svg-foundation-preview-packet/conflict.log
            ${{ runner.temp }}/svg-foundation-preview-packet/interrupted.log
            ${{ runner.temp }}/svg-foundation-preview-packet/rollback*.log
            ${{ runner.temp }}/svg-foundation-preview-packet/*-backup/manifest.tsv
            ${{ runner.temp }}/svg-foundation-preview-packet/server.log
          if-no-files-found: warn
          retention-days: 14

  authoring-candidate:
    name: Exact generated authoring candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Templates candidate
        uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout accepted Rendering source
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: ab0de59a5797393f1eaff6dd3146b53ae8bf1a67
          path: rendering
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser and assistive-technology hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gettext gir1.2-atspi-2.0 itstool libatspi2.0-dev libgtk-3-dev meson ninja-build openbox orca python-gi-dev python3-dasbus python3-dev python3-gi python3-speechd speech-dispatcher-espeak-ng xdotool xvfb
      - name: Stage a unique exact Rendering packet
        working-directory: templates
        run: |
          version="0.30.0-svg-author.1.ab0de59a.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          bash scripts/stage-rendering-authoring-packet.sh \
            "$GITHUB_WORKSPACE/rendering" "$RUNNER_TEMP/rendering-authoring" "$version"
      - name: Qualify installed generated authoring composition
        working-directory: templates
        run: |
          browser_path="$(node -e "process.stdout.write(require('./templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').chromium.executablePath())")"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" bash tests/composition/fable-game/verify-svg-authoring-candidate.sh \
            "$RUNNER_TEMP/rendering-authoring" "$RUNNER_TEMP/svg-authoring-qualification"
      - name: Upload exact authoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-authoring-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendering-authoring/manifest.json
            ${{ runner.temp }}/rendering-authoring/packages/*.nupkg
            ${{ runner.temp }}/svg-authoring-qualification/candidate-packet.json
            ${{ runner.temp }}/svg-authoring-qualification/qualification.json
            ${{ runner.temp }}/svg-authoring-qualification/*.json
            ${{ runner.temp }}/svg-authoring-qualification/*.log
          if-no-files-found: warn
          retention-days: 14

  input-candidate:
    name: Exact generated input candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact Templates candidate
        uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout accepted Rendering source
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: 9205407a3ae660d6f9bf208d78a6813f256aa917
          path: rendering
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser and assistive-technology hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gettext gir1.2-atspi-2.0 itstool libatspi2.0-dev libgtk-3-dev meson ninja-build openbox orca python-gi-dev python3-dasbus python3-dev python3-gi python3-speechd speech-dispatcher-espeak-ng xdotool xvfb
      - name: Stage a unique exact Rendering input packet
        working-directory: templates
        run: |
          version="0.30.0-svg-input.1.9205407a.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          bash scripts/stage-rendering-input-packet.sh \
            "$GITHUB_WORKSPACE/rendering" "$RUNNER_TEMP/rendering-input" "$version"
      - name: Qualify installed generated input composition
        working-directory: templates
        run: |
          browser_path="$(node -e "process.stdout.write(require('./templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').chromium.executablePath())")"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" bash tests/composition/fable-game/verify-svg-input-candidate.sh \
            "$RUNNER_TEMP/rendering-input" "$RUNNER_TEMP/svg-input-qualification"
      - name: Upload exact input evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-input-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/rendering-input/manifest.json
            ${{ runner.temp }}/rendering-input/packages/*.nupkg
            ${{ runner.temp }}/svg-input-qualification/candidate-packet.json
            ${{ runner.temp }}/svg-input-qualification/qualification.json
            ${{ runner.temp }}/svg-input-qualification/*.json
            ${{ runner.temp }}/svg-input-qualification/*.log
          if-no-files-found: warn
          retention-days: 14

  runtime-candidate:
    name: Exact generated runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Templates candidate
        uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout accepted Rendering source
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: 50bb064c8acb0251a469ca406d193551f8e209d1
          path: rendering
      - name: Checkout accepted Game source
        uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Game
          ref: c6de5b83eaa3d3f14909b42c3f8c3c94558157c9
          path: game
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser and assistive-technology hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gettext gir1.2-atspi-2.0 itstool libatspi2.0-dev libgtk-3-dev meson ninja-build openbox orca python-gi-dev python3-dasbus python3-dev python3-gi python3-speechd speech-dispatcher-espeak-ng xdotool xvfb
      - name: Stage exact producer packets
        working-directory: templates
        run: |
          rendering_version="0.30.0-svg-runtime.1.50bb064c.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          game_version="0.15.0-svg-runtime.1.c6de5b83.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          bash scripts/stage-rendering-runtime-packet.sh "$GITHUB_WORKSPACE/rendering" "$RUNNER_TEMP/rendering-runtime" "$rendering_version"
          bash scripts/stage-game-runtime-packet.sh "$GITHUB_WORKSPACE/game" "$RUNNER_TEMP/game-runtime" "$game_version"
      - name: Qualify installed generated runtime composition
        working-directory: templates
        run: |
          browser_path="$(node -e "process.stdout.write(require('./templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').chromium.executablePath())")"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" bash tests/composition/fable-game/verify-svg-runtime-candidate.sh \
