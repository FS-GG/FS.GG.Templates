            ${{ runner.temp }}/game-runtime/packages/*.nupkg
            ${{ runner.temp }}/svg-runtime-qualification/candidate-packet.json
            ${{ runner.temp }}/svg-runtime-qualification/qualification.json
            ${{ runner.temp }}/svg-runtime-qualification/*.json
            ${{ runner.temp }}/svg-runtime-qualification/*.log
          if-no-files-found: warn
          retention-days: 14

  presentation-candidate:
    name: Exact generated presentation candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Templates candidate
        uses: actions/checkout@v7
        with:
          path: templates
