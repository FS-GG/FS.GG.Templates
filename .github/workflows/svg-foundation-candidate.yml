      - name: Stage exact producer packets
        working-directory: templates
        run: |
          rendering_version="0.30.0-svg-present.1.65a64478.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          game_version="0.15.0-svg-present.1.91ef49ea.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
