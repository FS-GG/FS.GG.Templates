            "$RUNNER_TEMP/rendering-present" "$RUNNER_TEMP/game-present" "$RUNNER_TEMP/audio-present" "$RUNNER_TEMP/svg-present-qualification"
      - name: Upload exact presentation evidence
        if: always()
