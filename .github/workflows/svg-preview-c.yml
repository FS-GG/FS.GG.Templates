name: svg-preview-c

on:
  pull_request:
    paths:
      - 'FS.GG.Templates.csproj'
      - 'providers/**'
      - 'templates/fs-gg-fable-game/**'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'tests/composition/fable-game/svg-*-observe.mjs'
      - 'tests/composition/fable-game/observe-svg-input-orca.sh'
      - 'tests/composition/fable-game/orca-faulthandler.py'
      - 'tests/composition/fable-game/orca-playwright-firefox.cjs'
      - 'tests/composition/fable-game/speech-dispatcher-preflight.py'
      - 'tests/composition/fable-game/svg-input-orca.py'
      - 'tests/composition/fable-game/svg-preview-c-public-api.json'
      - 'tests/composition/fable-game/verify-svg-preview-c-source.sh'
      - '.github/workflows/svg-preview-c.yml'
  push:
    branches: [main]
    paths:
      - 'FS.GG.Templates.csproj'
      - 'providers/**'
      - 'templates/fs-gg-fable-game/**'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'tests/composition/fable-game/svg-*-observe.mjs'
      - 'tests/composition/fable-game/observe-svg-input-orca.sh'
      - 'tests/composition/fable-game/orca-faulthandler.py'
      - 'tests/composition/fable-game/orca-playwright-firefox.cjs'
      - 'tests/composition/fable-game/speech-dispatcher-preflight.py'
      - 'tests/composition/fable-game/svg-input-orca.py'
      - 'tests/composition/fable-game/svg-preview-c-public-api.json'
      - 'tests/composition/fable-game/verify-svg-preview-c-source.sh'
      - '.github/workflows/svg-preview-c.yml'

jobs:
  public-source:
    name: Release C public producer source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser hosts
        working-directory: templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 espeak-ng gettext gir1.2-atspi-2.0 libatspi2.0-dev openbox orca pulseaudio pulseaudio-utils python3-gi python3-speechd speech-dispatcher-espeak-ng x11-utils xdotool xvfb
      - name: Acquire exact Quint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/quint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/quint"
      - name: Qualify source package against public Release C producers
        id: source_qualification
        run: |
          browser_path="$(node -e "process.stdout.write(require('./templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').chromium.executablePath())")"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" \
            bash tests/composition/fable-game/verify-svg-preview-c-source.sh "$RUNNER_TEMP/svg-preview-c-source"
      - name: Qualify installed complete workspace across browser families
        shell: bash
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/svg-preview-c-source/feed" -maxdepth 1 -type f -name 'FS.GG.Workspace.Template.0.14.0.nupkg' -print -quit)"
          test -f "$package"
          export DOTNET_CLI_HOME="$RUNNER_TEMP/svg-workspace-complete-home"
          dotnet new install "$package" --force >/dev/null
          dotnet new fs-gg-fable-game -n SvgWorkspaceComplete \
            -o "$RUNNER_TEMP/svg-workspace-complete" --lifecycle none --bundle complete >/dev/null
          cd "$RUNNER_TEMP/svg-workspace-complete"
          browser_path="$(node -e "process.stdout.write(require('./Browser.Tests/node_modules/@playwright/test').chromium.executablePath())" 2>/dev/null || true)"
          if [[ ! -x "$browser_path" ]]; then
            browser_path="$(node -e "process.stdout.write(require('${{ github.workspace }}/templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').chromium.executablePath())")"
          fi
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" \
            QUINT_BIN="$RUNNER_TEMP/quint" SVG_RELEASE_VERSION="source-${GITHUB_SHA}" \
            bash ./build.sh > "$RUNNER_TEMP/svg-preview-c-source/complete-chromium.log" 2>&1
          cp Browser.Tests/test-results/browser.json "$RUNNER_TEMP/svg-preview-c-source/complete-chromium.browser.json"
          cp artifacts/test-results/browser.chromium.junit.xml "$RUNNER_TEMP/svg-preview-c-source/complete-chromium.junit.xml"
          for family in firefox webkit; do
            PLAYWRIGHT_BROWSER_FAMILY="$family" npm test --prefix Browser.Tests \
              > "$RUNNER_TEMP/svg-preview-c-source/complete-$family.log" 2>&1
            cp Browser.Tests/test-results/browser.json "$RUNNER_TEMP/svg-preview-c-source/complete-$family.browser.json"
            cp "artifacts/test-results/browser.$family.junit.xml" "$RUNNER_TEMP/svg-preview-c-source/complete-$family.junit.xml"
          done
      - name: Observe real keyboard focus and Orca speech output
        if: ${{ !cancelled() && steps.source_qualification.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          orca --version | tee "$RUNNER_TEMP/svg-preview-c-source/orca-version.log"
          studio="$RUNNER_TEMP/svg-preview-c-source/direct/SvgFoundation/Studio/dist"
          test -f "$studio/index.html"
          (cd "$studio" && exec python3 -m http.server 8143 --bind 127.0.0.1 > "$RUNNER_TEMP/svg-preview-c-source/orca-studio-server.log" 2>&1) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in {1..80}; do curl -fsS http://127.0.0.1:8143/ >/dev/null && break; sleep .25; done
          browser_path="$(node -e "process.stdout.write(require('./templates/fs-gg-fable-game/Browser.Tests/node_modules/@playwright/test').firefox.executablePath())")"
          PLAYWRIGHT_EXECUTABLE_PATH="$browser_path" \
            PLAYWRIGHT_MODULE_ROOT="${{ github.workspace }}/templates/fs-gg-fable-game/Browser.Tests/node_modules" \
            SVG_ORCA_BROWSER_FAMILY=firefox \
            timeout --signal=TERM --kill-after=15s 5m bash tests/composition/fable-game/observe-svg-input-orca.sh \
              http://127.0.0.1:8143/ "$RUNNER_TEMP/svg-preview-c-source/orca-input.json"
          jq -e '.result=="passed" and .browser.name=="firefox" and .keyboard.events=="xdotool-X11" and .keyboard.navigation=="passed" and .keyboard.activation=="passed" and .keyboard.palette=="passed" and .keyboard.escape=="passed" and .keyboard.focusRestoration=="passed" and .atspiActions.properties=="passed" and .atspiActions.validationFeedback=="passed" and .screenReader.name=="Orca" and .screenReader.speechOutputObserved==true and .screenReader.audibleHardwareOutput=="not-observed"' \
            "$RUNNER_TEMP/svg-preview-c-source/orca-input.json" >/dev/null
      - name: Upload Release C source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-preview-c-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/svg-preview-c-source/qualification.json
            ${{ runner.temp }}/svg-preview-c-source/*-present.json
            ${{ runner.temp }}/svg-preview-c-source/*-authoring.json
            ${{ runner.temp }}/svg-preview-c-source/*-input.json
            ${{ runner.temp }}/svg-preview-c-source/*.speechd-*.json
            ${{ runner.temp }}/svg-preview-c-source/*.speechd-logs/**
            ${{ runner.temp }}/svg-preview-c-source/*.browser-dom.json
            ${{ runner.temp }}/svg-preview-c-source/*-replay.json
            ${{ runner.temp }}/svg-preview-c-source/*-scale.json
            ${{ runner.temp }}/svg-preview-c-source/*-network.json
            ${{ runner.temp }}/svg-preview-c-source/*.log
            ${{ runner.temp }}/svg-preview-c-source/complete-*.browser.json
            ${{ runner.temp }}/svg-preview-c-source/complete-*.junit.xml
          if-no-files-found: warn
          retention-days: 90
