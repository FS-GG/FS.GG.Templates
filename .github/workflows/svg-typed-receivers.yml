name: svg-typed-receivers

on:
  push:
    branches: [main]
    paths:
      - 'providers/fable-game.providers.yml'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'templates/fs-gg-fable-game/**'
      - 'tests/composition/fable-game/verify-svg-typed-receivers.sh'
      - '.github/workflows/svg-typed-receivers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'providers/fable-game.providers.yml'
      - 'scripts/apply-svg-foundation-preview.sh'
      - 'scripts/svg-foundation-preview-baseline.manifest'
      - 'templates/fs-gg-fable-game/**'
      - 'tests/composition/fable-game/verify-svg-typed-receivers.sh'
      - '.github/workflows/svg-typed-receivers.yml'

concurrency:
  group: svg-typed-receivers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Installed typed SDD package receivers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set up exact Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.1'
      - name: Acquire exact profile-2 tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/svg-typed-tools"
          curl --fail --location --retry 3 https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 --output "$RUNNER_TEMP/svg-typed-tools/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/svg-typed-tools/quint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/svg-typed-tools/quint"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/driusan/lmt/62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c/main.go --output "$RUNNER_TEMP/svg-typed-tools/main.go"
          echo '88bc47acae2c26919ab96a5cafa80b12fac762092c57840a2baad1afcc7feda3  '"$RUNNER_TEMP/svg-typed-tools/main.go" | sha256sum --check --strict
          (cd "$RUNNER_TEMP/svg-typed-tools" && GO111MODULE=off CGO_ENABLED=1 go build -trimpath -ldflags '-buildid=IvXAt1kJ-3iINki1alCT/Ut12KGabgkWIkwVpw-xO/c4zkZMLAubfWHvjZOY8o/8-oR_8tNNndNgfMVoD8F -B 0x03d1703027f57ed4dd2ba90b7cdfc8cdea2815da' -o lmt main.go)
          echo '37e0b0365c2641edce40b48605471f61fa12e97c3e2376152f0e849abdc31f10  '"$RUNNER_TEMP/svg-typed-tools/lmt" | sha256sum --check --strict
      - name: Enable qualified network namespace isolation
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
      - name: Qualify installed typed receivers
        env:
          QUINT_BIN: ${{ runner.temp }}/svg-typed-tools/quint
          LMT_BIN: ${{ runner.temp }}/svg-typed-tools/lmt
        run: bash tests/composition/fable-game/verify-svg-typed-receivers.sh "$RUNNER_TEMP/svg-typed-receivers"
      - name: Upload exact local qualification packet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-typed-receivers-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/svg-typed-receivers/feed/*.nupkg
            ${{ runner.temp }}/svg-typed-receivers/*.json
            ${{ runner.temp }}/svg-typed-receivers/*.log
            ${{ runner.temp }}/svg-typed-receivers/*.txt
            ${{ runner.temp }}/svg-typed-receivers/clean/readiness/svg-qual-01-3/**
            ${{ runner.temp }}/svg-typed-receivers/retained/readiness/svg-qual-01-3/**
          if-no-files-found: warn
