name: svg-replay-candidate

on:
  push:
    branches: [main]
    paths: ['templates/fs-gg-fable-game/**', 'scripts/stage-game-replay-packet.sh', 'scripts/stage-svg-replay-candidate.sh', 'tests/composition/fable-game/svg-replay-studio-observe.mjs', 'tests/composition/fable-game/verify-svg-replay-candidate.sh', '.github/workflows/svg-replay-candidate.yml']
  pull_request:
    branches: [main]
    paths: ['templates/fs-gg-fable-game/**', 'scripts/stage-game-replay-packet.sh', 'scripts/stage-svg-replay-candidate.sh', 'tests/composition/fable-game/svg-replay-studio-observe.mjs', 'tests/composition/fable-game/verify-svg-replay-candidate.sh', '.github/workflows/svg-replay-candidate.yml']

permissions:
  contents: read

concurrency:
  group: svg-replay-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact generated Replay and Plan tools
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Game
          ref: 69c99ff34cd0b84516589796e7163f510de3d49a
          path: game
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.1'
      - name: Install browser hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Acquire exact Typed SDD profile-2 tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/svg-replay-tools"
          curl --fail --location --retry 3 https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 --output "$RUNNER_TEMP/svg-replay-tools/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/svg-replay-tools/quint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/svg-replay-tools/quint"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/driusan/lmt/62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c/main.go --output "$RUNNER_TEMP/svg-replay-tools/main.go"
          echo '88bc47acae2c26919ab96a5cafa80b12fac762092c57840a2baad1afcc7feda3  '"$RUNNER_TEMP/svg-replay-tools/main.go" | sha256sum --check --strict
          (cd "$RUNNER_TEMP/svg-replay-tools" && GO111MODULE=off CGO_ENABLED=1 go build -trimpath -ldflags '-buildid=IvXAt1kJ-3iINki1alCT/Ut12KGabgkWIkwVpw-xO/c4zkZMLAubfWHvjZOY8o/8-oR_8tNNndNgfMVoD8F -B 0x03d1703027f57ed4dd2ba90b7cdfc8cdea2815da' -o lmt main.go)
          echo '37e0b0365c2641edce40b48605471f61fa12e97c3e2376152f0e849abdc31f10  '"$RUNNER_TEMP/svg-replay-tools/lmt" | sha256sum --check --strict
      - name: Enable qualified network namespace isolation
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
      - name: Stage Game packet and qualify installed generated candidate
        working-directory: templates
        env:
          QUINT_BIN: ${{ runner.temp }}/svg-replay-tools/quint
          LMT_BIN: ${{ runner.temp }}/svg-replay-tools/lmt
        run: |
          version="0.15.0-svg-replay.1.69c99ff3.ci${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          bash scripts/stage-game-replay-packet.sh "$GITHUB_WORKSPACE/game" "$RUNNER_TEMP/game-replay" "$version"
          bash tests/composition/fable-game/verify-svg-replay-candidate.sh "$RUNNER_TEMP/game-replay" "$RUNNER_TEMP/svg-replay"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-replay-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/game-replay/manifest.json
            ${{ runner.temp }}/game-replay/packages/*.nupkg
            ${{ runner.temp }}/svg-replay/*.json
            ${{ runner.temp }}/svg-replay/*.log
            ${{ runner.temp }}/svg-replay/receiver/readiness/svg-replay-01/**
          if-no-files-found: warn
          retention-days: 30
