name: svg-release-d5-userns-ab

# Controlled A/B of the AppArmor hypothesis for the D5 user-namespace prerequisite
# (FS-GG/.github#4849 and #4816; Root decision
# https://github.com/FS-GG/.github/issues/4849#issuecomment-6385676372).
#
# Arm A keeps the runner image setting. Arm B runs exactly one reviewed host change,
#   sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
# on an ephemeral GitHub-hosted VM, before any probe. NoNewPrivileges, the namespace flags
# (unshare --user --map-root-user --net) and the backend are unchanged: the same
# literal probe runs directly and inside a transient unit with the D5 unit's properties
# (RuntimeMaxSec is 300 here instead of 1800; nothing else differs).
# No SDK, package, backend or product is acquired. Dispatch-only; never run on Home or
# self-hosted machines (the job refuses unless RUNNER_ENVIRONMENT is github-hosted).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ab:
    name: arm-${{ matrix.arm }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arm: [A, B]
    env:
      ARM: ${{ matrix.arm }}
      PROBE: tests/composition/fable-game/d5-userns-ab-probe.py
      UNIT_NAME: fsgg-userns-ab-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arm }}
    steps:
      - name: Refuse anything but an ephemeral GitHub-hosted runner
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted || { echo "refused: RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset}" >&2; exit 1; }
          echo "OUT=$RUNNER_TEMP/userns-ab-$ARM" >>"$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/userns-ab-$ARM"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record environment and the setting before the arm step
        run: |
          {
            echo "arm=$ARM"; echo "run=$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"; echo "sha=$GITHUB_SHA"
            echo "runnerEnvironment=$RUNNER_ENVIRONMENT"; echo "imageOS=${ImageOS:-unset}"; echo "imageVersion=${ImageVersion:-unset}"
            echo "kernel=$(uname -srv)"; echo "id=$(id)"
            date -u +startedUTC=%Y-%m-%dT%H:%M:%SZ; date +%s >"$OUT/probe-since-epoch"
          } >"$OUT/environment.txt"
          cat "$OUT/environment.txt"
          python3 -I -B "$PROBE" snapshot before "$OUT/snapshot-before.json"
          sysctl kernel.apparmor_restrict_unprivileged_userns | tee "$OUT/sysctl-before.txt"
      - name: Arm B only - disable the AppArmor unprivileged-userns restriction (ephemeral hosted VM)
        if: ${{ matrix.arm == 'B' }}
        run: |
          set -euo pipefail
          sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 | tee "$OUT/sysctl-set.txt"
      - name: Record the setting after the arm step
        run: |
          python3 -I -B "$PROBE" snapshot after "$OUT/snapshot-after.json"
          sysctl kernel.apparmor_restrict_unprivileged_userns | tee "$OUT/sysctl-after.txt"
      - name: Probe directly as the runner user (non-fatal, evidence only)
        run: |
          python3 -I -B "$PROBE" probe direct "$OUT/probe-direct.json"
          python3 -I -B -c 'import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:d[k] for k in ("literalUnshare","postClone")},indent=1))' "$OUT/probe-direct.json"
      - name: Probe in a transient unit with the D5 unit properties incl. NoNewPrivileges (non-fatal, evidence only)
        run: |
          set +e
          {
          sudo -n systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="$UNIT_NAME" -p Delegate=yes -p User="$(id -un)" -p Group="$(id -gn)" \
            -p NoNewPrivileges=yes -p KillMode=control-group -p TimeoutStopSec=5 \
            -p TasksAccounting=yes -p MemoryAccounting=yes -p CPUAccounting=yes \
            -p CPUQuota=200% -p TasksMax=512 -p MemoryMax=8G -p MemorySwapMax=0 -p RuntimeMaxSec=300 \
            -p WorkingDirectory="$PWD" --setenv=PATH=/usr/bin:/bin \
            -- /usr/bin/python3 -I -B "$PROBE" probe unit-nnp "$OUT/probe-unit-nnp.json"
          echo "systemd-run exit=$?" >"$OUT/systemd-run-exit.txt"
          } 2>&1 | tee "$OUT/systemd-run.log"
          cat "$OUT/systemd-run-exit.txt"
          python3 -I -B -c 'import json,sys;d=json.load(open(sys.argv[1]));print(json.dumps({k:d[k] for k in ("process","literalUnshare","postClone")},indent=1))' "$OUT/probe-unit-nnp.json" || true
          exit 0
      - name: Collect readable kernel and audit evidence
        if: ${{ always() }}
        run: |
          python3 -I -B "$PROBE" kernlog "$(cat "$OUT/probe-since-epoch" 2>/dev/null || echo 0)" "$OUT/kernlog.json"
          python3 -I -B -c 'import json,sys;d=json.load(open(sys.argv[1]));[print(k,d[k].get("exit"),d[k].get("totalLines"),*d[k].get("matchedLines",[])[-12:],sep="\n  ") for k in ("dmesg","journalKernel","journalAudit")]' "$OUT/kernlog.json" || true
      - name: Arm summary
        if: ${{ always() }}
        run: |
          python3 -I -B - >>"$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os
          out = os.environ["OUT"]
          def load(name):
              try:
                  return json.load(open(os.path.join(out, name)))
              except Exception as error:
                  return {"missing": str(error)}
          def sysctl(snapshot):
              try:
                  return snapshot["sysctl"]["/proc/sys/kernel/apparmor_restrict_unprivileged_userns"]["value"]
              except Exception:
                  return "Unknown"
          before, after = load("snapshot-before.json"), load("snapshot-after.json")
          print(f"### Arm {os.environ['ARM']}: apparmor_restrict_unprivileged_userns {sysctl(before)} -> {sysctl(after)}")
          for form in ("direct", "unit-nnp"):
              probe = load(f"probe-{form}.json")
              literal = probe.get("literalUnshare", {})
              clone = probe.get("postClone", {})
              print(f"- {form}: literal unshare exit={literal.get('exit')} stderr={literal.get('stderr', '').strip()!r}; "
                    f"post-CLONE unshare={clone.get('unshare')} uid_map={clone.get('uid_map')} "
                    f"NoNewPrivs={probe.get('process', {}).get('status', {}).get('NoNewPrivs')}")
          PY
      - name: Retain the arm evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: userns-ab-${{ matrix.arm }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/userns-ab-${{ matrix.arm }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
