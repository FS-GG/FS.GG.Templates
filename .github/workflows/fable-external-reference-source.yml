name: Fable external reference source

on:
  workflow_call:
    inputs:
      templates-source:
        description: Exact reviewed Templates commit
        required: true
        type: string
      rendering-input-source:
        description: Finite historical, current-public or unpublished palette route; current native activation remains held
        type: string
        default: candidate
      rendering-successor-input:
        description: Actual acquired palette 0.32.4 producer coordinates; empty supplies no candidate
        type: string
        default: ''
      current-public-at-admission:
        description: Exact separately selected current AT operation; empty keeps native activation held
        type: string
        default: ''
      native-input-facility:
        description: Exact reviewed Noble IME facility manifest JSON; missing pins refuse current full mode
        type: string
        default: ''
      preflight-only:
        description: Verify immutable inputs without compiling or qualifying
        type: boolean
        default: true
  pull_request:
    paths:
      - 'templates/fs-gg-fable-game/SvgFoundation/**'
      - 'templates/fs-gg-fable-game/Browser.Tests/**'
      - 'templates/fs-gg-fable-game/.template.config/template.json'
      - 'src/FS.GG.Templates.ProviderTool/ReferencePublication.fs'
      - 'tests/ProviderComposition.Tests/**'
      - 'tests/composition/fable-game/verify-external-reference-candidate.sh'
      - 'tests/composition/fable-game/verify-palette-candidate.sh'
      - 'tests/composition/fable-game/svg-input-orca.py'
      - 'tests/composition/fable-game/observe-svg-input-orca.sh'
      - 'tests/composition/fable-game/svg-source-python-fixture.sh'
      - 'tests/composition/fable-game/verify-external-reference-workflow.py'
      - 'tests/composition/fable-game/observe-external-reference-orca.sh'
      - 'tests/composition/fable-game/external-reference-orca.py'
      - 'tests/composition/fable-game/test-current-reference-at.py'
      - 'tests/composition/fable-game/current-reference-at-caller.py'
      - 'tests/composition/fable-game/current-reference-native-input.py'
      - 'tests/composition/fable-game/current-reference-noble-acquisition.py'
      - 'tests/composition/fable-game/current-reference-noble-transaction.py'
      - 'tests/composition/fable-game/current-reference-noble-factory.py'
      - 'tests/composition/fable-game/current-reference-noble-install.py'
      - 'tests/composition/fable-game/current-reference-at-admission.py'
      - 'tests/composition/fable-game/test-current-reference-at-admission.py'
      - 'tests/composition/fable-game/test-current-reference-noble-install.py'
      - 'tests/composition/fable-game/native-input-facility/**'
      - 'tests/composition/fable-game/test-current-reference-noble-factory.py'
      - 'tests/composition/fable-game/test-current-reference-noble-transaction.py'
      - 'tests/composition/fable-game/fixtures/noble-c068-status.xz'
      - 'tests/composition/fable-game/fixtures/noble-source-prefix-request.json'
      - 'tests/composition/fable-game/fixtures/apt-config-init-order.json'
      - 'tests/composition/fable-game/test-current-reference-noble-acquisition.py'
      - 'tests/composition/fable-game/current-reference-noble-metadata-fixture.json'
      - 'tests/composition/fable-game/test-current-reference-native-input.py'
      - 'tests/composition/fable-game/external-reference-public.py'
      - 'tests/composition/fable-game/test-external-reference-public.py'
      - 'tests/composition/fable-game/current-composition-observations.py'
      - 'tests/composition/fable-game/test-current-composition-observations.py'
      - 'tests/composition/fable-game/current-composition-local.py'
      - 'tests/composition/fable-game/test-current-composition-local.py'
      - 'tests/composition/fable-game/current-composition-custody.py'
      - 'tests/composition/fable-game/verify-source-built-composition.sh'
      - 'tests/composition/fable-game/test-current-composition-custody.py'
      - '.github/workflows/fable-reference-public.yml'
      - '.github/workflows/fable-external-reference-source.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: fable-external-reference-${{ github.repository }}-${{ inputs.templates-source }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: External reference workflow static controls
    if: github.repository == 'FS-GG/FS.GG.Templates' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: |
          python3 tests/composition/fable-game/verify-external-reference-workflow.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 150s prlimit --as=1073741824 --cpu=120 python3 -B tests/composition/fable-game/test-current-composition-observations.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 150s prlimit --as=1073741824 --cpu=120 python3 -B tests/composition/fable-game/test-current-composition-local.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 150s prlimit --as=1073741824 --cpu=120 python3 -B tests/composition/fable-game/test-current-composition-custody.py
          python3 tests/composition/fable-game/test-external-reference-public.py
          python3 tests/composition/fable-game/external-reference-orca.py --self-test
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --cpu=120 --fsize=16777216 python3 -I -B tests/composition/fable-game/test-current-reference-at.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-native-input.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-acquisition.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-transaction.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-factory.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-install.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-at-admission.py
      - name: Simulate snapshot provisioning against the runner's real dpkg status (no install, no privilege)
        run: |
          timeout --kill-after=10s 600s python3 -B tests/composition/fable-game/current-reference-noble-install.py --simulate --private "$RUNNER_TEMP/snapshot-simulation" --receipt "$RUNNER_TEMP/snapshot-simulation.json"
      - name: Check actual Noble solver tools and c068 fixture before work
        run: |
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -I -B tests/composition/fable-game/current-reference-noble-transaction.py --check-context
      - name: Acquire signed metadata for the offline source solver
        run: |
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            timeout --kill-after=5s 150s prlimit --as=1073741824 --cpu=120 \
            /usr/bin/python3 -I -B tests/composition/fable-game/current-reference-noble-acquisition.py \
            --metadata-only "$RUNNER_TEMP/noble-source-metadata"
      - name: Exercise actual isolated no-install APT source prefix
        run: |
          env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 \
            timeout --kill-after=5s 120s prlimit --as=1073741824 --cpu=105 \
            /usr/bin/python3 -I -B tests/composition/fable-game/current-reference-noble-transaction.py \
            --inputs "$RUNNER_TEMP/noble-source-metadata" \
            --request tests/composition/fable-game/fixtures/noble-source-prefix-request.json \
            --out "$RUNNER_TEMP/noble-source-transaction"
      - name: Retain original no-install source results and partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: noble-no-install-source-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/noble-source-metadata/metadata.json
            ${{ runner.temp }}/noble-source-transaction/**

  candidate:
    if: github.repository != 'FS-GG/FS.GG.Templates' || inputs.templates-source != ''
    name: External reference immutable preflight and optional full qualification
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.rendering-input-source == 'palette-heading' && 30 || inputs.rendering-input-source == 'font-disposal' && 60 || 35 }}
    env:
      PRODUCER_SOURCE: ${{ inputs.rendering-input-source == 'current-public-composition' && '4ede04be66cedffc8551cd14045bab714aa358a7' || inputs.rendering-input-source == 'font-disposal' && '4ec6eafbbbf02264db9b0db4780c590abe0bf9cd' || inputs.rendering-input-source == 'public' && '4ede04be66cedffc8551cd14045bab714aa358a7' || '9b73395658d4683a067d150ca9441b04e802c4af' }}
      PRODUCER_RUN: ${{ inputs.rendering-input-source == 'current-public-composition' && '40737624380' || inputs.rendering-input-source == 'font-disposal' && '39509314882' || inputs.rendering-input-source == 'public' && '40737624380' || '38200411661' }}
      PRODUCER_ARTIFACT: ${{ inputs.rendering-input-source == 'current-public-composition' && '12838338215' || inputs.rendering-input-source == 'font-disposal' && '12305198394' || inputs.rendering-input-source == 'public' && '12838338215' || '11725317255' }}
      PRODUCER_ARCHIVE_SHA256: ${{ inputs.rendering-input-source == 'current-public-composition' && 'baaa17b807bd52c9297dafbfd9161ec84fec4842317bb1f5df4e3d40d837c8bf' || inputs.rendering-input-source == 'font-disposal' && '84647332c124e511545787c8c3f8634d4f5177068521acfc86c93430ac73ef63' || inputs.rendering-input-source == 'public' && 'baaa17b807bd52c9297dafbfd9161ec84fec4842317bb1f5df4e3d40d837c8bf' || '7b0532caf431cfa41acaf35555016cf126bc495c5a6e13fe7db6b8fbe7478cca' }}
      PRODUCER_CUSTODY_SHA256: ${{ inputs.rendering-input-source == 'current-public-composition' && '89ea6424cae4d06969f0a60394679e9892bd2b873fb46ebd281aa10616809720' || inputs.rendering-input-source == 'font-disposal' && '7dbd4329546932c4c1d12767550b7b78aae85e32c81b354935b2c615b3e298c9' || inputs.rendering-input-source == 'public' && '89ea6424cae4d06969f0a60394679e9892bd2b873fb46ebd281aa10616809720' || '85bb1dcdf0378d05ca536d5878b88dedc301ff1524d39d98966e23888aae0120' }}
      PRODUCER_ARCHIVE_SIZE_BYTES: ${{ inputs.rendering-input-source == 'current-public-composition' && '15375023' || inputs.rendering-input-source == 'font-disposal' && '15073469' || inputs.rendering-input-source == 'public' && '15375023' || '15007722' }}
      PRODUCER_VERSION: ${{ inputs.rendering-input-source == 'current-public-composition' && '0.32.4' || inputs.rendering-input-source == 'font-disposal' && '0.32.3' || inputs.rendering-input-source == 'public' && '0.32.4' || '0.32.2' }}
      PRODUCER_PLAN: ${{ inputs.rendering-input-source == 'current-public-composition' && 'eng/release/palette-heading-0.32.4.json' || inputs.rendering-input-source == 'font-disposal' && 'eng/release/font-disposal-0.32.3.json' || inputs.rendering-input-source == 'public' && 'eng/release/palette-heading-0.32.4.json' || 'eng/release/external-authority-recovery-0.32.2.json' }}
      RENDERING_INPUT_SOURCE: ${{ inputs.rendering-input-source || 'candidate' }}
      RENDERING_SUCCESSOR_INPUT: ${{ inputs.rendering-successor-input }}
      FSGG_CURRENT_PUBLIC_AT_ADMISSION: ${{ inputs.current-public-at-admission }}
      FSGG_CURRENT_NATIVE_INPUT_FACILITY: ${{ inputs.native-input-facility }}
      DOTNET_PROCESSOR_COUNT: '1'
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        working-directory: templates
        shell: bash
    steps:
      - name: Reject invalid caller or Templates identity before checkout
        working-directory: .
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          TEMPLATES_SOURCE: ${{ inputs.templates-source }}
        run: |
          python3 - <<'PYINPUT'
          import os, re
          assert os.environ['CALLER_REPOSITORY']=='FS-GG/FS.GG.Rendering', 'Rendering caller required'
          assert re.fullmatch('[0-9a-f]{40}', os.environ['TEMPLATES_SOURCE']), 'Exact Templates SHA required'
          assert os.environ.get('RENDERING_INPUT_SOURCE','candidate') in ['candidate','public','font-disposal','current-public-composition','palette-heading'], 'Finite input source required'
          if os.environ.get('RENDERING_INPUT_SOURCE')=='palette-heading':
              import json
              from pathlib import Path
              def unique(pairs):
                  result={}
                  for key,value in pairs:
                      assert key not in result, 'Duplicate producer coordinate'
                      result[key]=value
                  return result
              selected=json.loads(os.environ['RENDERING_SUCCESSOR_INPUT'],object_pairs_hook=unique)
              fields={'producerSha','producerRun','producerAttempt','producerArtifact','outerSha256','outerSizeBytes','custodySha256'}
              assert set(selected)==fields, 'Exact acquired producer coordinates required'
              assert selected['producerSha']=='4ede04be66cedffc8551cd14045bab714aa358a7', 'Selected0324 source required'
              for key in ['outerSha256','custodySha256']:assert re.fullmatch('[0-9a-f]{64}',selected[key]), key
              for key in ['producerRun','producerAttempt','producerArtifact','outerSizeBytes']:assert type(selected[key]) is int and selected[key]>0, key
              assert selected['producerAttempt']==1, 'Fresh first producer attempt required'
              assert selected['outerSizeBytes']<=67108864, 'Bounded original archive required'
              names={'PRODUCER_SOURCE':'producerSha','PRODUCER_RUN':'producerRun','PRODUCER_ATTEMPT':'producerAttempt','PRODUCER_ARTIFACT':'producerArtifact','PRODUCER_ARCHIVE_SHA256':'outerSha256','PRODUCER_ARCHIVE_SIZE_BYTES':'outerSizeBytes','PRODUCER_CUSTODY_SHA256':'custodySha256'}
              with Path(os.environ['GITHUB_ENV']).open('a') as output:
                  for target,key in names.items():output.write(target+'='+str(selected[key])+'\n')
                  output.write('PRODUCER_VERSION=0.32.4\nPRODUCER_PLAN=eng/release/palette-heading-0.32.4.json\n')
          PYINPUT
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Templates
          ref: ${{ inputs.templates-source }}
          path: templates
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: ${{ env.PRODUCER_SOURCE }}
          path: templates/.tmp/rendering-source
          persist-credentials: false
      - name: Verify existing external reference static controls
        run: |
          python3 tests/composition/fable-game/verify-external-reference-workflow.py
          python3 tests/composition/fable-game/test-external-reference-public.py
          python3 tests/composition/fable-game/external-reference-orca.py --self-test
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --cpu=120 --fsize=16777216 python3 -I -B tests/composition/fable-game/test-current-reference-at.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-native-input.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-acquisition.py
          PYTHONDONTWRITEBYTECODE=1 timeout --kill-after=5s 120s prlimit --as=2147483648 --cpu=120 python3 -I -B tests/composition/fable-game/test-current-reference-noble-transaction.py
      - name: Refuse held current AT before acquisition or setup
        if: ${{ !inputs.preflight-only && inputs.rendering-input-source == 'current-public-composition' }}
        run: python3 -B tests/composition/fable-game/current-reference-at-caller.py guard
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify native producer run and authenticated archive before compilation
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATES_SOURCE: ${{ inputs.templates-source }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SOURCE: ${{ github.sha }}
          CALLER_RUN: ${{ github.run_id }}
          CALLER_ATTEMPT: ${{ github.run_attempt }}
          PREFLIGHT_ONLY: ${{ inputs.preflight-only }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEMPLATES_SOURCE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git -C .tmp/rendering-source rev-parse HEAD)" = "$PRODUCER_SOURCE"
          test -z "$(git -C .tmp/rendering-source status --porcelain --untracked-files=no)"
          bash -n tests/composition/fable-game/verify-external-reference-candidate.sh
          mkdir -p "$RUNNER_TEMP/rendering-packet"
          gh api "repos/FS-GG/FS.GG.Rendering/actions/runs/$PRODUCER_RUN" > "$RUNNER_TEMP/rendering-run.json"
          gh api "repos/FS-GG/FS.GG.Rendering/actions/artifacts/$PRODUCER_ARTIFACT" > "$RUNNER_TEMP/rendering-artifact.json"
          if [[ "$RENDERING_INPUT_SOURCE" == palette-heading ]]; then
            gh api "repos/FS-GG/FS.GG.Rendering/actions/runs/$PRODUCER_RUN/attempts/$PRODUCER_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/rendering-jobs.json"
          fi
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          run=json.loads((root/'rendering-run.json').read_text())
          artifact=json.loads((root/'rendering-artifact.json').read_text())
          assert run['id']==int(os.environ['PRODUCER_RUN']) and run['head_sha']==os.environ['PRODUCER_SOURCE']
          assert run['conclusion']=='success' and run['path']=='.github/workflows/release.yml'
          assert artifact['id']==int(os.environ['PRODUCER_ARTIFACT']) and not artifact['expired']
          assert artifact['size_in_bytes']==int(os.environ['PRODUCER_ARCHIVE_SIZE_BYTES'])
          assert artifact['digest']=='sha256:'+os.environ['PRODUCER_ARCHIVE_SHA256']
          assert artifact['workflow_run']['id']==run['id'] and artifact['workflow_run']['head_sha']==run['head_sha']
          assert artifact['name']=='rendering-source-candidate-'+run['head_sha']+'-'+os.environ['PRODUCER_VERSION']
          if os.environ['RENDERING_INPUT_SOURCE']=='palette-heading':
              assert run['run_attempt']==1 and int(os.environ['PRODUCER_ATTEMPT'])==1, 'Fresh first native producer attempt required'
              assert hashlib.sha256((Path('.tmp/rendering-source')/os.environ['PRODUCER_PLAN']).read_bytes()).hexdigest()=='4bcbb1c756a799ab634e14d1fc9191ac51a8cd5d3537aec75eeab1c1d545deaa'
              jobs=json.loads((root/'rendering-jobs.json').read_text())
              assert jobs['total_count']==len(jobs['jobs'])<=100
              for job in jobs['jobs']:
                  assert job['run_id']==run['id'] and job['head_sha']==run['head_sha'] and job['run_attempt']==int(os.environ['PRODUCER_ATTEMPT'])
              by_name={job['name']:job for job in jobs['jobs']}
              assert len(by_name)==len(jobs['jobs'])
              for name in ['Static release source and plan guard','Package consumption (release-only)','Generated product (template instantiation, release-only)','Qualify complete successor archive custody without publication']:
                  assert by_name[name]['conclusion']=='success', name
              for name in ['Protected publication preflight (no mutation) [org-publication-writer]','Publish FS.GG.UI.* to org GitHub Packages (release-only) [org-publication-writer]']:
                  assert by_name[name]['conclusion']=='skipped', 'Source-only producer must not run '+name
              custody=by_name['Qualify complete successor archive custody without publication']
              steps={step['name']:step['conclusion'] for step in custody['steps']}
              for name in ['Pack the complete source candidate and verify custody','ApiCompat against the selected published baseline','Qualify all three browser families against original candidate archives without repacking']:
                  assert steps[name]=='success', name
          if os.environ['RENDERING_INPUT_SOURCE'] in ['font-disposal','current-public-composition']:
              assert run['run_attempt']==1
              plan=Path('.tmp/rendering-source')/os.environ['PRODUCER_PLAN']
              raw=plan.read_bytes()
              expected_size,expected_sha={'font-disposal':(3490,'89369de0c0944c66a52c6ed914cef78d6bb7670866baedf85cd8a198c5c46239'),'current-public-composition':(3514,'4bcbb1c756a799ab634e14d1fc9191ac51a8cd5d3537aec75eeab1c1d545deaa')}[os.environ['RENDERING_INPUT_SOURCE']]
              assert len(raw)==expected_size and hashlib.sha256(raw).hexdigest()==expected_sha
          PY
          gh api "repos/FS-GG/FS.GG.Rendering/actions/artifacts/$PRODUCER_ARTIFACT/zip" > "$RUNNER_TEMP/rendering-packet.zip"
          printf '%s  %s\n' "$PRODUCER_ARCHIVE_SHA256" "$RUNNER_TEMP/rendering-packet.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import hashlib, os, stat
          from pathlib import Path
          from zipfile import ZipFile
          root=Path(os.environ['RUNNER_TEMP'])
          with ZipFile(root/'rendering-packet.zip') as archive:
              if os.environ['RENDERING_INPUT_SOURCE']=='palette-heading':
                  regular=[item for item in archive.infolist() if not item.is_dir()]
                  assert len(regular)==20 and len({item.filename for item in regular})==20
                  assert sum(item.file_size for item in regular)<=134217728
                  for item in regular:
                      assert not Path(item.filename).is_absolute() and '..' not in Path(item.filename).parts
                      assert stat.S_IFMT(item.external_attr>>16) in (0,stat.S_IFREG)
                      assert item.filename.endswith('.nupkg') or Path(item.filename).name=='release-custody.json'
              names=[name for name in archive.namelist() if name.endswith('.nupkg') or Path(name).name=='release-custody.json']
              assert len(names)==20 and len({Path(name).name for name in names})==20
              for name in names:
                  (root/'rendering-packet'/Path(name).name).write_bytes(archive.read(name))
          assert hashlib.sha256((root/'rendering-packet/release-custody.json').read_bytes()).hexdigest()==os.environ['PRODUCER_CUSTODY_SHA256']
          PY
          python3 .tmp/rendering-source/scripts/release-custody.py verify \
            --plan ".tmp/rendering-source/$PRODUCER_PLAN" \
            --archives "$RUNNER_TEMP/rendering-packet" --manifest "$RUNNER_TEMP/rendering-packet/release-custody.json" \
            --source-sha "$PRODUCER_SOURCE"
      - name: Record authenticated preflight identity
        env:
          TEMPLATES_SOURCE: ${{ inputs.templates-source }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SOURCE: ${{ github.sha }}
          CALLER_RUN: ${{ github.run_id }}
          CALLER_ATTEMPT: ${{ github.run_attempt }}
          PREFLIGHT_ONLY: ${{ inputs.preflight-only }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
