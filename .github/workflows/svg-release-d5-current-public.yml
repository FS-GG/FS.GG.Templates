name: svg-release-d5-current-public

on:
  pull_request:
    paths:
      - '.github/workflows/svg-release-d5-current-public.yml'
      - 'tests/composition/fable-game/d5-current-public.py'
      - 'tests/composition/fable-game/test-d5-current-public.py'
      - 'tests/composition/fable-game/verify-svg-release-d5-current-public.sh'
      - 'tests/composition/fable-game/d5-public-pins.py'
  workflow_dispatch:
    inputs:
      public_pins:
        description: Exact current-public-pins/1 JSON emitted by d5-current-public.py pins
        required: true
        type: string
      scope:
        description: Separately admitted small receiver rehearsal or complete declared matrix
        required: true
        type: choice
        default: rehearsal
        options: [rehearsal, full]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold manual runtime before any checkout, SDK or acquisition
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'ADMISSION=None; runtime and retirement unqualified'
          exit 3
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Typed current receiver policy and preserved historical controls
        run: |
          dotnet restore tests/ProviderComposition.Tests/ProviderComposition.Tests.fsproj --source https://api.nuget.org/v3/index.json
          dotnet run --project tests/ProviderComposition.Tests/ProviderComposition.Tests.fsproj --no-restore
      - name: Typed pin owner consumes the actual bounded input emitter
        run: |
          python3 tests/composition/fable-game/d5-current-public.py pins >"$RUNNER_TEMP/current-d5-source-pins.json"
          dotnet run --project src/FS.GG.Templates.ProviderTool/FS.GG.Templates.ProviderTool.fsproj --no-build --no-restore -- current-d5-pins-check --pins "$RUNNER_TEMP/current-d5-source-pins.json"
      - name: Pure actual-caller and refusal-preservation controls
        run: |
          bash -n tests/composition/fable-game/verify-svg-release-d5-current-public.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tests/composition/fable-game/test-d5-current-public.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/composition/fable-game/test-d5-public-pins.py
      - name: Refuse wrong current package composition before tool acquisition
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLIC_PINS: ${{ inputs.public_pins }}
        run: |
          printf '%s\n' "$PUBLIC_PINS" >"$RUNNER_TEMP/current-d5-pins.json"
          dotnet run --project src/FS.GG.Templates.ProviderTool/FS.GG.Templates.ProviderTool.fsproj --no-build --no-restore -- current-d5-pins-check --pins "$RUNNER_TEMP/current-d5-pins.json"

  receiver:
    needs: preflight
    # ADMISSION=None: source-only until the maintained owner/admission/retirement seam is reviewed.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.1'
          cache: false
      # Identical profile-2 tool recipe to the maintained historical D.5 receiver.
      - name: Acquire exact profile-2 tools
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/current-d5-tools"
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/current-d5-tools/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/current-d5-tools/quint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/current-d5-tools/quint"
          curl --fail --silent --show-error --location --max-time 120 \
            https://raw.githubusercontent.com/driusan/lmt/62fe18f2f6a6e11c158ff2b2209e1082a4fcd59c/main.go \
            --output "$RUNNER_TEMP/current-d5-tools/main.go"
          echo '88bc47acae2c26919ab96a5cafa80b12fac762092c57840a2baad1afcc7feda3  '"$RUNNER_TEMP/current-d5-tools/main.go" | sha256sum --check --strict
          (cd "$RUNNER_TEMP/current-d5-tools" && GO111MODULE=off CGO_ENABLED=1 go build -trimpath -ldflags '-buildid=IvXAt1kJ-3iINki1alCT/Ut12KGabgkWIkwVpw-xO/c4zkZMLAubfWHvjZOY8o/8-oR_8tNNndNgfMVoD8F -B 0x03d1703027f57ed4dd2ba90b7cdfc8cdea2815da' -o lmt main.go)
          echo '37e0b0365c2641edce40b48605471f61fa12e97c3e2376152f0e849abdc31f10  '"$RUNNER_TEMP/current-d5-tools/lmt" | sha256sum --check --strict
      - name: Qualify the existing Linux user and network namespace sandbox
        run: |
          set -euo pipefail
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
      - name: Execute only the separately selected current receiver scope
        env:
          PUBLIC_PINS: ${{ inputs.public_pins }}
          SCOPE: ${{ inputs.scope }}
          QUINT_BIN: ${{ runner.temp }}/current-d5-tools/quint
          LMT_BIN: ${{ runner.temp }}/current-d5-tools/lmt
        run: |
          set -euo pipefail
          export DOTNET_HOST_PATH="$(readlink -f "$(command -v dotnet)")"
          printf '%s\n' "$PUBLIC_PINS" >"$RUNNER_TEMP/current-d5-pins.json"
          args=("$RUNNER_TEMP/current-d5-pins.json" "$RUNNER_TEMP/current-d5-receiver")
          case "$SCOPE" in rehearsal) args+=(--rehearsal);; full) args+=(--full);; *) exit 2;; esac
          bash tests/composition/fable-game/verify-svg-release-d5-current-public.sh "${args[@]}"
      - name: Retain actual current receipts, original public archives and authored authority
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-d5-${{ inputs.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-d5-receiver/*.json
            ${{ runner.temp }}/current-d5-receiver/*.log
            ${{ runner.temp }}/current-d5-receiver/*.yml
            ${{ runner.temp }}/current-d5-receiver/*.tsv
            ${{ runner.temp }}/current-d5-receiver/*.checked
            ${{ runner.temp }}/current-d5-receiver/feed/*.nupkg
            ${{ runner.temp }}/current-d5-receiver/*/readiness/d5-default/**
            ${{ runner.temp }}/current-d5-receiver/*/.fsgg/scaffold-provenance.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
