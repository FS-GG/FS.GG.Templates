name: Fable reference public qualification

on:
  pull_request:
    paths:
      - .github/workflows/fable-reference-public.yml
      - tests/composition/fable-game/verify-fable-reference-public.sh
      - tests/composition/fable-game/test-fable-reference-public-preflight.py
      - tests/composition/fable-game/managed-group-binding-probe.py
      - tests/composition/fable-game/installed-c-restore-control.py
      - .github/workflows/installed-c-restore-control.yml
      - tests/composition/fable-game/current-public-descriptor-0.19.0.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Templates-only public proof or full Wizard proof (historical 0.18.1/Wizard 0.16.0 or current public 0.19.2/SDD 2.4.0/Wizard 0.21.0)
        required: true
        type: choice
        default: templates
        options: [templates, full]
      template_version: { description: Selected FS.GG.Workspace.Template cohort 0.18.1 or current public 0.19.2, required: true, type: string }
      archive_sha256: { description: Exact nuget.org FS.GG.Workspace.Template archive SHA-256 for the selected cohort, required: true, type: string }
      descriptor_sha256: { description: Exact protected fable-game provider descriptor SHA-256, required: true, type: string }
      source_revision: { description: Exact protected Templates commit carried by the package, required: true, type: string }
      tag_revision: { description: Peeled immutable fs-gg-templates/v<version> revision, required: true, type: string }
      sdd_version: { description: Exact published FS.GG.SDD.Cli version, required: true, type: string }
      sdd_archive_sha256: { description: Exact public FS.GG.SDD.Cli archive SHA-256, required: true, type: string }
      sdd_source_revision: { description: Exact FS.GG.SDD.Cli nuspec source revision, required: true, type: string }
      wizard_version: { description: Exact published FS.GG.NewSddWorkspace version, required: false, type: string }
      wizard_archive_sha256: { description: Exact public wizard archive SHA-256, required: false, type: string }
      wizard_source_revision: { description: Exact wizard nuspec source revision, required: false, type: string }

permissions:
  contents: read

jobs:
  public-reference:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RECEIVER_MODE: ${{ inputs.mode }}
      TEMPLATE_VERSION: ${{ inputs.template_version }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      TAG_REVISION: ${{ inputs.tag_revision }}
      SDD_VERSION: ${{ inputs.sdd_version }}
      SDD_ARCHIVE_SHA256: ${{ inputs.sdd_archive_sha256 }}
      SDD_SOURCE_REVISION: ${{ inputs.sdd_source_revision }}
      WIZARD_VERSION: ${{ inputs.wizard_version }}
      WIZARD_ARCHIVE_SHA256: ${{ inputs.wizard_archive_sha256 }}
      WIZARD_SOURCE_REVISION: ${{ inputs.wizard_source_revision }}
    steps:
      - name: Resolve runner qualification paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'EVIDENCE_DIR=%s/fable-reference-public\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'QUINT_BIN=%s/fable-reference-tools/quint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
      - name: Preflight closed public inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/composition/fable-game/verify-fable-reference-public.sh
          python3 tests/composition/fable-game/test-fable-reference-public-preflight.py
          args=(--mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" --sdd-version "$SDD_VERSION" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" --evidence-dir "$RUNNER_TEMP/fable-reference-preflight")
          tests/composition/fable-game/verify-fable-reference-public.sh "${args[@]}" --preflight-only
          marker="$RUNNER_TEMP/fable-reference-input-executed"
          malicious="1.0.0'\$(touch $marker)'"
          if tests/composition/fable-game/verify-fable-reference-public.sh \
            --mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" \
            --sdd-version "$malicious" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" \
            --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" \
            --evidence-dir "$RUNNER_TEMP/fable-reference-malicious" --preflight-only 2>/dev/null; then exit 1; fi
          test ! -e "$marker"
      - name: Initialize retained qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$EVIDENCE_DIR"
          printf '{"schema":"fable-reference-public/1","disposition":"started"}\n' >"$EVIDENCE_DIR/qualification.json"
      - name: Pin npm and Quint
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.1.0
          test "$(npm --version)" = 12.1.0
          mkdir -m 700 "$RUNNER_TEMP/fable-reference-tools"
          curl --fail --location --retry 3 https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 --output "$QUINT_BIN"
          echo "939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  $QUINT_BIN" | sha256sum --check --strict
          chmod 700 "$QUINT_BIN"
          test "$($QUINT_BIN --version)" = 0.32.0
      - name: Qualify exact public archive through direct, provider, and wizard receivers
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_HOST_PATH="$DOTNET_ROOT/dotnet"
          "$DOTNET_HOST_PATH" restore src/FS.GG.Templates.ProviderTool/FS.GG.Templates.ProviderTool.fsproj --locked-mode
          tests/composition/fable-game/verify-fable-reference-public.sh \
            --mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" \
            --sdd-version "$SDD_VERSION" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" \
            --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" \
            --evidence-dir "$EVIDENCE_DIR"
      - name: Retain bounded public qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fable-reference-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fable-reference-public/qualification.json
            ${{ runner.temp }}/fable-reference-public/readback.sha256
            ${{ runner.temp }}/fable-reference-public/*-build.log
            ${{ runner.temp }}/fable-reference-public/*-browser.log
            ${{ runner.temp }}/fable-reference-public/*-none.json
            ${{ runner.temp }}/fable-reference-public/provider.json
            ${{ runner.temp }}/fable-reference-public/wizard*-registry.json
            ${{ runner.temp }}/fable-reference-public/wizard*.log
          if-no-files-found: warn
          retention-days: 90


  # Non-required binding probe. It runs the caller's own pin, owner loading, probe and managed
  # executor against the real pinned owner on tiny host commands. It provisions nothing and runs
  # no browser, WASM journey or installed C; those stay held by the literal gates below.
  managed-group-binding:
    name: Managed-group contract binding probe (non-required)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out exact reviewed Templates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse outside a delegated unit with the real pinned owner
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/composition/fable-game/managed-group-binding-probe.py --expect unavailable --root "$RUNNER_TEMP/mg-unavailable"
          FSGG_MANAGED_GROUP_OWNER="$RUNNER_TEMP/mg-unavailable/owner/managed_group_owner.py" \
            python3 tests/composition/fable-game/test-fable-reference-public-preflight.py ManagedGroupBindingTests RealOwnerBindingTests CustodyPilotTests
      - name: Contain bound groups inside a fresh delegated unit
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="fsgg-mg-templates-probe-${RUN_ID}-${RUN_ATTEMPT}" \
            -p Delegate=yes -p User="$(id -un)" -p Group="$(id -gn)" -p NoNewPrivileges=yes \
            -p KillMode=control-group -p TimeoutStopSec=5 -p TasksAccounting=yes -p MemoryAccounting=yes \
            -p TasksMax=256 -p MemoryMax=1073741824 -p RuntimeMaxSec=300 -p WorkingDirectory="$PWD" \
            --setenv=PATH=/usr/bin:/bin \
            -- /usr/bin/python3 -I tests/composition/fable-game/managed-group-binding-probe.py \
               --expect contained --root "$RUNNER_TEMP/mg-contained" --tasks-max 256 --memory-max 1073741824

  wasm-installed-c:
    name: WASM caller source preparation (runtime held)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out exact reviewed Templates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Qualify actual inline hosted input and budget controls
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/composition/fable-game/verify-fable-reference-public.sh
          python3 tests/composition/fable-game/test-fable-reference-public-preflight.py
      # C-J1 binds fsgg.managed-group-contract/1 in source. Caller execution stays literal
      # false until C-J1 source/profile review and Programme/root admission enable it.
      - name: Prepare closed hosted WASM caller
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          # fsgg.managed-group-contract/1 hosted bootstrap: the job's Python is the only process of a
          # fresh delegated unit. The unit owns hard limits and owner-death cleanup; each tool and
          # Playwright invocation is a managed group under it. A host without systemd/sudo refuses.
          checkout_head="$(git rev-parse HEAD)"
          sudo -n systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="fsgg-mg-templates-${RUN_ID}-${RUN_ATTEMPT}" \
            -p Delegate=yes -p User="$(id -un)" -p Group="$(id -gn)" -p NoNewPrivileges=yes \
            -p KillMode=control-group -p TimeoutStopSec=5 -p TasksAccounting=yes -p MemoryAccounting=yes \
            -p TasksMax=6144 -p MemoryMax=12G -p RuntimeMaxSec=2400 -p WorkingDirectory="$PWD" \
            --setenv=PATH=/usr/bin:/bin --setenv=EVENT="$EVENT" --setenv=REPOSITORY="$REPOSITORY" \
            --setenv=HEAD_REPOSITORY="$HEAD_REPOSITORY" --setenv=PR_HEAD="$PR_HEAD" \
            --setenv=WORKFLOW_REF="$WORKFLOW_REF" --setenv=WORKFLOW_SHA="$WORKFLOW_SHA" \
            --setenv=RUN_ID="$RUN_ID" --setenv=RUN_ATTEMPT="$RUN_ATTEMPT" --setenv=CHECKOUT_HEAD="$checkout_head" \
            --setenv=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" --setenv=RUNNER_TEMP="$RUNNER_TEMP" \
            --setenv=ImageOS="${ImageOS:-}" --setenv=ImageVersion="${ImageVersion:-}" \
            --setenv=RUNNER_OS="$RUNNER_OS" --setenv=RUNNER_ARCH="$RUNNER_ARCH" \
            -- /usr/bin/python3 -I - <<'HOSTED_WASM'
          import contextlib, gzip, signal, struct, threading, base64, hashlib, importlib.util, json, os, pathlib, platform, re, shutil, stat, subprocess, sys, tarfile, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET, zipfile
          if sys.flags.optimize != 0:
              raise RuntimeError("hosted admission requires optimization=0")
          # Published Workspace.Template 0.19.2 (peeled fs-gg-templates/v0.19.2 = d15f085, signed nuget.org
          # archive; release run 39845406998). Same stock inputs, locks and WASM [0.3.0] refs as 0.19.1, with
          # Rendering 0.32.3 adopted. 0.19.0 Complete scaffolds truncate the WASM guest policy.c.
          TEMPLATE_VERSION = "0.19.2"
          PUBLISHED = "d15f085ff4d64b7736e09ff263644b3c86a576a6"
          PACKAGE_SHA = "ef5c5c2fb2de372a427c5abaf8bb4cdf91d7776b5628f07c016d4eb9ac87469a"
          DESCRIPTOR_SHA = "e8dbf8958f90d522e577378ae36b0e131954e400991d542ae9709ac32c713e3b"
          FABLE_SHA = "b586190f1592c3352d7319008a99e1747267dacbc44d6e5bd3753c84390f47a4"
          TOOLS = {"sdk":"10.0.401", "runtime":"10.0.12", "node":"24.20.0", "npm":"11.19.0", "fable":"5.18.0", "rust":"1.90.0", "wasi":"34.0", "playwright":"1.63.0"}
          BUDGET = {"job":2400, "setup":840, "custody":300, "installed":900, "cleanup":30, "collection":180, "overhead":90}
          if BUDGET["setup"] + BUDGET["custody"] + BUDGET["installed"] + 3 * BUDGET["cleanup"] + BUDGET["collection"] + BUDGET["overhead"] != BUDGET["job"]:
              raise RuntimeError("phase budgets must fit the original job")
          ENDPOINTS = {
              "template":(f"https://api.nuget.org/v3-flatcontainer/fs.gg.workspace.template/{TEMPLATE_VERSION}/fs.gg.workspace.template.{TEMPLATE_VERSION}.nupkg", PACKAGE_SHA, 8388608),
              "descriptor":(f"https://raw.githubusercontent.com/FS-GG/FS.GG.Templates/{PUBLISHED}/providers/fable-game.providers.yml", DESCRIPTOR_SHA, 1048576),
              "guest":("https://github.com/FS-GG/FS.GG.Game/releases/download/wasm/v0.3.0/fsgg-wasm-sdk-0.3.0.tar.gz", "8091df6824981c0c37131524ffbcbae9bb8b36f672a20edc2efaddd35664f8c8", 2097152),
              "wasi":("https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz", "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4", 268435456)}
          # Observed public TLS/raw archive identity only; no publisher signature or build correspondence.
          BROWSER_ARCHIVES = {'chromium-full1243': {'url': 'https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-linux64.zip',
                                 'sha256': '8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a',
                                 'bytes': 195836009,
                                 'selector': 'chromium-1243'},
           'chromium-headless1243': {'url': 'https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-headless-shell-linux64.zip',
                                     'sha256': 'a9da028861a0cf789ff25c2fed45f5f1aaf969ed9247835b6a7821a4f7af9d1d',
                                     'bytes': 119809080,
                                     'selector': 'chromium_headless_shell-1243'},
           'firefox1543': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/firefox/1543/firefox-ubuntu-24.04.zip',
                           'sha256': 'b0905e84427cc162b9a6e4392be14e5e54e0ade911c83639962c8078b273565e',
                           'bytes': 114822786,
                           'selector': 'firefox-1543'},
           'webkit2359': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/webkit/2359/webkit-ubuntu-24.04.zip',
                          'sha256': '8c129d989a1c48d826ca11b45acbba919039de811623dc3819ccbd95b69eeb62',
                          'bytes': 107218719,
                          'selector': 'webkit-2359'},
           'ffmpeg1011': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/ffmpeg/1011/ffmpeg-linux.zip',
                          'sha256': 'ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc',
                          'bytes': 2376500,
                          'selector': 'ffmpeg-1011'}}
          HTTPS_HOSTS = {"api.nuget.org", "raw.githubusercontent.com", "github.com", "release-assets.githubusercontent.com", "builds.dotnet.microsoft.com", "dotnetcli.blob.core.windows.net", "ci.dot.net", "nodejs.org", "registry.npmjs.org", "static.rust-lang.org", "storage.googleapis.com", "playwright.download.prss.microsoft.com"}
          # C-J1 supplier: fsgg.managed-group-contract/1, merged by FS.GG.Coordination#1047 for #1046.
          # The single stdlib file is the complete closure; the (commit, path, sha256) pin is its identity.
          OWNER = {"repository":"FS-GG/FS.GG.Coordination", "commit":"ac22206560f3eddfea524ce8f752ff1d0dfeec4e",
              "path":"eng/managed_group_owner.py", "sha256":"d846dbe158befb5b824bd94a5bc0bb89b1145f825d5d6fa3a3225fa0451a36c0",
              "bytes":45315, "contract":"fsgg.managed-group-contract/1"}
          OWNER_URL = "https://raw.githubusercontent.com/"+OWNER["repository"]+"/"+OWNER["commit"]+"/"+OWNER["path"]
          # Leaf limits are cooperative (members share the owner's uid); hard limits are the unit's.
          MANAGED = {"pidsMax":4096, "stdoutBytes":16777216, "stderrBytes":16777216, "settleSeconds":2, "termGraceSeconds":5}
          # How each executable identity was obtained. Only the first three carry acquisition provenance.
          IDENTITY_BASES = ("verified-download", "verified-archive-member", "installer-copy-of-verified-download",
              "caller-authored", "installer-output-observed", "host-observed")
          # C-J1 literal runtime hold. The supplier contract is bound below, but provisioning, the
          # three-family custody pilot and installed C stay refused until C-J1 source/profile
          # review and Programme/root admission lift this, the step condition and the upload gate.
          RUNTIME_ADMITTED = False
          # Installed C (the downloaded-only 27-case journey) runs only through the separate dispatch-only
          # workflow wasm-installed-c.yml and admitted_installed_sequence. None = held: that entry refuses
          # before any acquisition. A Programme/root admission sets this to its exact comment URL in a
          # reviewed source PR; RUNTIME_ADMITTED and both literal-false steps stay closed even then.
          INSTALLED_ADMISSION = None
          INSTALLED_WORKFLOW = "FS-GG/FS.GG.Templates/.github/workflows/wasm-installed-c.yml@refs/heads/main"
          INSTALLED_UNIT = {"TasksMax":"6144","MemoryMax":str(12*1073741824),"RuntimeMaxUSec":"40min","Delegate":"yes","NoNewPrivileges":"yes","KillMode":"control-group"}
          INSTALLED_EVIDENCE_BYTES = 150 * 1048576
          # The admitted path has no custody phase (the pilot is done): its reserve moves to installed.
          INSTALLED_BUDGET = {"job":2400, "setup":840, "installed":1230, "cleanup":30, "collection":180, "overhead":90}
          if INSTALLED_BUDGET["setup"] + INSTALLED_BUDGET["installed"] + 2 * INSTALLED_BUDGET["cleanup"] + INSTALLED_BUDGET["collection"] + INSTALLED_BUDGET["overhead"] != INSTALLED_BUDGET["job"]:
              raise RuntimeError("installed-C phase budgets must fit the original job")

          def require(value, message):
              if not value: raise ValueError(message)

          def sha(path):
              digest = hashlib.sha256()
              with pathlib.Path(path).open("rb") as source:
                  for block in iter(lambda: source.read(1048576), b""): digest.update(block)
              return digest.hexdigest()

          def validate_source(env, head, root):
              require(env["EVENT"] == "pull_request" and env["REPOSITORY"] == "FS-GG/FS.GG.Templates" and env["HEAD_REPOSITORY"] == env["REPOSITORY"], "ordinary same-repository PR required")
              require(re.fullmatch(r"[0-9a-f]{40}", env["PR_HEAD"]) and head == env["PR_HEAD"], "exact reviewed checkout required")
              require(env["WORKFLOW_REF"].startswith("FS-GG/FS.GG.Templates/.github/workflows/fable-reference-public.yml@"), "workflow identity differs")
              require(re.fullmatch(r"[0-9a-f]{40}", env["WORKFLOW_SHA"]), "workflow evaluation source missing")
              require(pathlib.Path(root).is_absolute() and not pathlib.Path(root).is_symlink(), "private root must be an absolute nonlink")
              return {**{k:env[k] for k in ("EVENT","REPOSITORY","PR_HEAD","WORKFLOW_REF","WORKFLOW_SHA","RUN_ID","RUN_ATTEMPT")}, "imageOS":env.get("ImageOS"), "imageVersion":env.get("ImageVersion"), "runnerOS":env.get("RUNNER_OS"), "runnerArch":env.get("RUNNER_ARCH")}

          def phase_deadline(start, phase, now):
              require(phase in ("setup", "custody", "installed"), "closed phase required")
              reserved = BUDGET["cleanup"] + BUDGET["collection"] + BUDGET["overhead"]
              later = {"setup":BUDGET["custody"] + BUDGET["installed"] + 2*BUDGET["cleanup"], "custody":BUDGET["installed"] + BUDGET["cleanup"], "installed":0}[phase]
              deadline = min(now + BUDGET[phase], start + BUDGET["job"] - reserved - later)
              require(deadline > now, "original job budget cannot supply this phase")
              return deadline

          def public_url(url):
              require(isinstance(url,str) and len(url) <= 16384 and not any(ord(c)<32 or ord(c)==127 for c in url),"URL control or length refused")
              decoded=urllib.parse.unquote(url)
              require(not any(ord(c)<32 or ord(c)==127 for c in decoded) and "\\" not in url,"encoded URL control/backslash refused")
              parsed=urllib.parse.urlsplit(url)
              require(parsed.scheme=="https" and parsed.hostname in HTTPS_HOSTS and parsed.username is None and parsed.password is None and parsed.port in (None,443) and not parsed.fragment,"public HTTPS origin/port/userinfo differs")
              require(parsed.netloc.lower() in (parsed.hostname,parsed.hostname+":443"),"noncanonical authority refused")
              return url

          class ClosedRedirect(urllib.request.HTTPRedirectHandler):
              # A fresh handler per acquisition bounds the complete redirect chain.
              def __init__(self): self.hops=0
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  public_url(req.full_url)
                  public_url(newurl) # validate BEFORE constructing or opening the next request
                  require(not any(key.lower() in ("authorization","proxy-authorization","cookie") for key in list(req.headers)+list(req.unredirected_hdrs)),"auth-free acquisition required")
                  self.hops+=1;require(self.hops<=5,"redirect hop cap exceeded")
                  return super().redirect_request(req,fp,code,msg,headers,newurl)

          def open_public(url,timeout):
              public_url(url) # urllib must never open an unchecked initial origin
              # No credential-bearing environment proxy, cookie jar or auth handlers.
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),ClosedRedirect())
              return opener.open(urllib.request.Request(url,headers={"User-Agent":"fsgg-fixed-public-acquisition/1"}),timeout=timeout)

          @contextlib.contextmanager
          def original_io_deadline(deadline):
              # In-process Linux transport bound; qualified hosted behavior still requires an actual pilot.
              require(threading.current_thread() is threading.main_thread(), "deadline watchdog requires main thread")
              remaining=deadline-time.monotonic();require(remaining>0, "original acquisition deadline exhausted")
              require(signal.getitimer(signal.ITIMER_REAL)==(0.0,0.0), "foreign deadline timer occupied")
              previous=signal.getsignal(signal.SIGALRM)
              def expired(signum, frame):raise TimeoutError("original acquisition wall deadline exhausted")
              signal.signal(signal.SIGALRM,expired)
              try:
                  signal.setitimer(signal.ITIMER_REAL,remaining)
                  yield
                  require(time.monotonic()<deadline, "original acquisition deadline exhausted")
              finally:
                  signal.setitimer(signal.ITIMER_REAL,0)
                  signal.signal(signal.SIGALRM,previous)

          def download(url, destination, maximum, deadline, expected=None, algorithm="sha256", transport=open_public):
              public_url(url)
              require(not destination.exists() and not destination.is_symlink(), "download destination occupied")
              require(0 < maximum <= 536870912 and deadline > time.monotonic(), "download bound invalid or expired")
              digest=hashlib.new(algorithm); count=0
              # One timer covers open, all validated redirects, body reads and terminal close; no per-hop renewal.
              with original_io_deadline(deadline):
                  with transport(url, timeout=min(30, deadline-time.monotonic())) as response, destination.open("xb") as output:
                      final=urllib.parse.urlsplit(public_url(response.geturl()))
                      while True:
                          require(time.monotonic()<deadline, "original acquisition deadline exhausted")
                          block=response.read(min(1048576,maximum-count+1))
                          require(time.monotonic()<deadline, "original acquisition deadline exhausted")
                          if not block:break
                          count+=len(block);require(count<=maximum, "download byte cap exceeded")
                          output.write(block);digest.update(block)
              require(time.monotonic()<deadline, "original acquisition deadline exhausted")
              actual=digest.hexdigest();require(expected is None or actual==expected, "download digest differs")
              return {"url":url,"servedUrlHost":final.hostname,"bytes":count,"algorithm":algorithm,"digest":actual,"observedAt":time.time()}

          def bounded_zip(archive, maximum_members, deadline):
              # Reject unsupported ZIP64/multidisk and bound central-directory allocation before ZipFile construction.
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              size=archive.stat().st_size
              with archive.open("rb") as raw:
                  raw.seek(max(0,size-65557));tail=raw.read(65557)
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              pos=tail.rfind(b"PK\x05\x06")
              require(pos>=0 and len(tail)-pos>=22, "ZIP end record absent")
              _,disk,central_disk,on_disk,count,central_bytes,offset,comment=struct.unpack_from("<4s4H2IH",tail,pos)
              require(disk==central_disk==0 and on_disk==count and count!=65535 and 0<count<=maximum_members, "ZIP population/disk/ZIP64 refused")
              require(central_bytes<=16777216 and offset+central_bytes==size-len(tail)+pos and len(tail)-pos==22+comment, "ZIP central directory bound differs")
              source=zipfile.ZipFile(archive)
              try:require(len(source.infolist())==count, "ZIP actual population differs")
              except BaseException:source.close();raise
              return source

          def unpack_tar(archive, destination, maximum_bytes, deadline, maximum_members=120000):
              require(not destination.exists() and not destination.is_symlink(), "extraction root occupied")
              require(0<maximum_members<=120000 and 0<maximum_bytes<=2147483648, "tar bound invalid")
              def header_bound(value, message):
                  if not value:raise RuntimeError(message) # tarfile would replace ValueError with an opaque invalid-header error.
              physical=[0]
              def inspect_header(member):
                  physical[0]+=1;header_bound(physical[0]<=maximum_members, "tar header population cap exceeded")
                  header_bound(time.monotonic()<deadline, "original archive deadline exhausted")
                  header_bound(member.type in (tarfile.REGTYPE,tarfile.AREGTYPE,tarfile.DIRTYPE,tarfile.SYMTYPE,tarfile.LNKTYPE,tarfile.XHDTYPE,tarfile.XGLTYPE,tarfile.GNUTYPE_LONGNAME,tarfile.GNUTYPE_LONGLINK), "unsupported tar type")
                  header_bound(0<=member.size<=maximum_bytes, "tar member byte cap exceeded")
                  if member.type in (tarfile.XHDTYPE,tarfile.XGLTYPE,tarfile.GNUTYPE_LONGNAME,tarfile.GNUTYPE_LONGLINK):header_bound(member.size<=1048576, "tar extended metadata byte cap exceeded")
                  return member
              class BoundedTarInfo(tarfile.TarInfo):
                  @classmethod
                  def frombuf(cls, buf, encoding, errors):
                      if hasattr(tarfile.TarInfo,"_frombuf"):return cls._frombuf(buf,encoding,errors)
                      return inspect_header(super().frombuf(buf,encoding,errors))
                  @classmethod
                  def _frombuf(cls, buf, encoding, errors, *, dircheck=True):
                      # Python3.14's internal recursive PAX/longname route bypasses public frombuf.
                      return inspect_header(super()._frombuf(buf,encoding,errors,dircheck=dircheck))
              class BoundedInflated:
                  def __init__(self, raw):self.raw=raw;self.count=0
                  def read(self, size):
                      require(time.monotonic()<deadline and 0<=size<=1048576, "tar read bound invalid or expired")
                      value=self.raw.read(size);self.count+=len(value)
                      require(time.monotonic()<deadline and self.count<=maximum_bytes+268435456, "tar inflated byte/deadline cap exceeded")
                      return value
              count=0;expanded=0;seen=set()
              with original_io_deadline(deadline),gzip.open(archive,"rb") as raw,tarfile.open(fileobj=BoundedInflated(raw),mode="r|",tarinfo=BoundedTarInfo) as source:
                  destination.mkdir(mode=0o700)
                  for member in source:
                      count+=1;expanded+=member.size
                      require(count<=maximum_members and expanded<=maximum_bytes, "tar population/expanded byte cap exceeded")
                      require(member.name not in seen and not member.name.startswith("/") and ".." not in pathlib.PurePosixPath(member.name).parts and not any(ord(c)<32 or ord(c)==127 for c in member.name), "unsafe/duplicate tar member")
                      seen.add(member.name)
                      source.extract(member,destination,filter="data")
                      source.members.clear() # Streaming extraction never retains a full header population.
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              with original_io_deadline(deadline):archive_digest=sha(archive)
              return {"members":count,"expandedBytes":expanded,"archiveSha256":archive_digest}

          def seed_from_package(archive, destination, deadline):
              require(not destination.exists(), "npm seed root occupied")
              with original_io_deadline(deadline),bounded_zip(archive,2047,deadline) as source:
                  infos=source.infolist();require(sum(x.file_size for x in infos)<=67108864, "template expanded byte cap exceeded")
                  selected={}
                  for role in ("Client","Browser.Tests"):
                      for name in ("package.json","package-lock.json"):
                          member="content/templates/fs-gg-fable-game/"+role+"/"+name
                          found=[x for x in infos if x.filename==member]
                          require(len(found)==1 and 0<found[0].file_size<=1048576 and not found[0].flag_bits & 1, "npm lock byte/population cap exceeded")
                          selected[(role,name)]=found[0]
                  destination.mkdir(mode=0o700)
                  for role,package,version in (("Client","vite","7.3.6"),("Browser.Tests","@playwright/test",TOOLS["playwright"])):
                      tree=destination/role;tree.mkdir()
                      for name in ("package.json","package-lock.json"):
                          with source.open(selected[(role,name)]) as stream:raw=stream.read(1048577)
                          require(time.monotonic()<deadline and len(raw)==selected[(role,name)].file_size and len(raw)<=1048576, "npm lock byte/deadline cap exceeded")
                          (tree/name).write_bytes(raw)
                      lock=json.loads((tree/"package-lock.json").read_bytes())
                      require(lock["packages"][""]["devDependencies"][package]==version, "package-owned dependency version differs")
                      for name,row in lock["packages"].items():
                          if name:require(row.get("resolved","").startswith("https://registry.npmjs.org/") and row.get("integrity","").startswith("sha512-"), "npm lock requires authenticated registry bytes")
              return destination

          def load_owner(root, deadline, acquire=download):
              # Closed public acquisition, exact pin check, then import of the hashed private copy.
              directory=root/"owner"
              require(not directory.exists() and not directory.is_symlink(),"managed-group owner root occupied")
              directory.mkdir(mode=0o700)
              path=directory/pathlib.PurePosixPath(OWNER["path"]).name
              record=acquire(OWNER_URL,path,OWNER["bytes"],deadline,OWNER["sha256"])
              require(path.is_file() and not path.is_symlink() and path.stat().st_size==OWNER["bytes"] and sha(path)==OWNER["sha256"],"managed-group owner pin differs")
              require(record.get("digest")==OWNER["sha256"] and record.get("bytes")==OWNER["bytes"],"managed-group owner acquisition record differs")
              path.chmod(0o400)
              sys.dont_write_bytecode=True # no derived cache beside the pinned source
              spec=importlib.util.spec_from_file_location("fsgg_managed_group_owner",path)
              module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
              # The owner re-hashes its own file at import; that hash is repeated in every receipt.
              require(getattr(module,"CONTRACT_SCHEMA",None)==OWNER["contract"] and getattr(module,"OWNER_SHA256",None)==OWNER["sha256"] and getattr(module,"OWNER_PATH",None)==str(path),"imported managed-group owner identity differs")
              (root/"managed-owner.json").write_text(json.dumps({**OWNER,"url":OWNER_URL,"privatePath":str(path),"acquisition":record},indent=2)+"\n")
              return module

          def probe_containment(owner, root):
              # Before any provisioning acquisition: no delegated cgroup v2 root, no run.
              result=owner.probe()
              (root/"managed-owner-probe.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
              require(result.get("schema")==OWNER["contract"] and result.get("available") is True and result.get("refusal") is None,"managed-group containment unavailable: "+str(result.get("refusal")))
              return result

          def bind_identity(identities, path, basis, expected=None, images=None):
              # One reviewed or derived executable identity per real path; leader images default to itself.
              require(basis in IDENTITY_BASES,"unknown executable identity basis")
              path=pathlib.Path(path)
              require(path.is_absolute() and os.path.realpath(path)==str(path),"managed executable must be an absolute symlink-free path")
              require(path.is_file() and stat.S_ISREG(path.lstat().st_mode) and path.stat().st_mode & 0o111,"managed executable is not a regular executable file")
              actual=sha(path)
              require(expected is None or actual==expected,"managed executable bytes differ from bound identity: "+str(path))
              leaders=list(images) if images is not None else [actual]
              require(1<=len(leaders)<=8 and len(set(leaders))==len(leaders) and all(re.fullmatch(r"[0-9a-f]{64}",v) for v in leaders),"managed leader images invalid")
              row={"sha256":actual,"leaderImages":leaders,"basis":basis}
              require(identities.get(str(path),row)==row,"conflicting managed executable identity: "+str(path))
              identities[str(path)]=row
              return row

          def host_image(path):
              # Host-owned interpreter bytes; observed, never provenance-checked.
              real=pathlib.Path(os.path.realpath(path))
              require(real.is_file() and not real.is_symlink(),"host image missing")
              return str(real),sha(real)

          def cgroup_counters(directory):
              # Read-only cgroup v2 high-water and event counters; an absent or unreadable file records None.
              def read(name):
                  try:
                      with open(os.path.join(directory,name)) as source:return source.read(4096)
                  except (OSError,TypeError,ValueError):return None
              def number(text):
                  text=(text or "").strip();return int(text) if text.isdigit() else None
              def event(text,key):
                  for line in (text or "").splitlines():
                      parts=line.split()
                      if len(parts)==2 and parts[0]==key and parts[1].isdigit():return int(parts[1])
                  return None
              pids,memory=read("pids.events"),read("memory.events")
              return {"pidsPeak":number(read("pids.peak")),"pidsEventsMax":event(pids,"max"),"memoryPeakBytes":number(read("memory.peak")),
                  "memoryEventsMax":event(memory,"max"),"memoryEventsOomKill":event(memory,"oom_kill"),
                  "memoryCurrentBytes":number(read("memory.current")),"memoryAnonBytes":event(read("memory.stat"),"anon")}

          def high_water_observer():
              # The owner's public run(control=) hook, used for recording only: it never writes, reads only at
              # or below the delegated root, and never raises (the owner records a raising hook as a failure).
              state={"group":None,"unitBefore":None,"unitAfter":None,"unitMemoryCurrentMaxBytes":None,"polls":0,"errors":[]}
              def control(event, context):
                  try:
                      droot=context.get("delegatedRoot");leaf=context.get("leaf")
                      if not (isinstance(droot,str) and os.path.isabs(droot)):return
                      if event=="after-birth":state["unitBefore"]=cgroup_counters(droot)
                      elif event=="poll":
                          state["polls"]+=1
                          with open(os.path.join(droot,"memory.current")) as source:current=source.read(64).strip()
                          if current.isdigit():state["unitMemoryCurrentMaxBytes"]=max(int(current),state["unitMemoryCurrentMaxBytes"] or 0)
                      elif event=="before-remove":
                          if isinstance(leaf,str) and leaf.startswith(droot.rstrip("/")+"/"):state["group"]=cgroup_counters(leaf)
                          state["unitAfter"]=cgroup_counters(droot)
                  except Exception as error:
                      if len(state["errors"])<4:state["errors"].append(type(error).__name__+": "+str(error)[:200])
              return state,control

          def high_water_record(state, previous=None):
              # Group: the group's own leaf at retirement (the profile enables only the pids controller there,
              # so its memory fields are None). Unit: the delegated root; peaks are cumulative over the job,
              # event counters are this group's deltas, memory.current is sampled at each owner poll, and
              # memory.current / memory.stat anon are read at birth and removal: growth within this group and
              # change since the previous group's removal (``previous``: that group's recorded unit row).
              try:
                  before,after=state.get("unitBefore") or {},state.get("unitAfter") or {}
                  prior=previous or {}
                  diff=lambda a,b:a-b if isinstance(a,int) and isinstance(b,int) and not isinstance(a,bool) and not isinstance(b,bool) else None
                  delta=lambda k:diff(after.get(k),before.get(k))
                  return {"group":state.get("group"),"unit":{"pidsPeakCumulative":after.get("pidsPeak"),"memoryPeakBytesCumulative":after.get("memoryPeakBytes"),
                      "memoryCurrentMaxBytesSampled":state.get("unitMemoryCurrentMaxBytes"),"pidsEventsMaxDelta":delta("pidsEventsMax"),
                      "memoryEventsMaxDelta":delta("memoryEventsMax"),"memoryEventsOomKillDelta":delta("memoryEventsOomKill"),
                      "memoryCurrentBytesAtBirth":before.get("memoryCurrentBytes"),"memoryAnonBytesAtBirth":before.get("memoryAnonBytes"),
                      "memoryCurrentBytesAtRemove":after.get("memoryCurrentBytes"),"memoryAnonBytesAtRemove":after.get("memoryAnonBytes"),
                      "memoryCurrentGrowthBytes":delta("memoryCurrentBytes"),"memoryAnonGrowthBytes":delta("memoryAnonBytes"),
                      "memoryCurrentSincePreviousGroupBytes":diff(before.get("memoryCurrentBytes"),prior.get("memoryCurrentBytesAtRemove")),
                      "memoryAnonSincePreviousGroupBytes":diff(before.get("memoryAnonBytes"),prior.get("memoryAnonBytesAtRemove"))},
                      "polls":state.get("polls"),"errors":state.get("errors")}
              except Exception as error:
                  return {"error":type(error).__name__+": "+str(error)[:200]}

          def managed_executor(owner, root, deadline, identities, phase, receipts):
              # Replaces the injected execute(argv, cwd, env): one managed group per call, all bound
              # to the caller's original phase deadline (never renewed per call).
              require(phase in ("setup","custody","installed"),"closed phase required")
              sink=root/"managed"
              if not sink.exists():sink.mkdir(mode=0o700)
              require(sink.is_dir() and not sink.is_symlink(),"managed receipt root differs")
              def record():
                  try:(root/"managed-receipts.json").write_text(json.dumps(receipts,indent=2)+"\n")
                  except Exception as reporting:return "independent managed receipt reporting failure: "+type(reporting).__name__+": "+str(reporting)
              def execute(argv, cwd, env, inputs=()):
                  # inputs: files the group reads as code (scripts); their hashes are retained with the receipt.
                  require(isinstance(argv,list) and argv and all(isinstance(a,str) for a in argv),"exact argv required")
                  require(pathlib.Path(argv[0]).is_absolute(),"managed executable must be absolute: "+argv[0])
                  real=os.path.realpath(argv[0]);row=identities.get(real)
                  require(row is not None,"managed executable identity not bound: "+real)
                  index=len(receipts)+1
                  name=(phase+"-"+format(index,"03d")+"-"+re.sub(r"[^a-z0-9.-]","-",pathlib.Path(real).name.lower()))[:64]
                  out_dir=sink/(format(index,"03d")+"-"+phase)
                  # One retained receipt list per job root: a second list would reuse groups and overwrite the index.
                  require(not os.path.lexists(out_dir),"managed group sequence reused; share one receipt list per job root")
                  profile={"schema":"fsgg.managed-group-profile/1","name":name,"root":str(root),
                      "executable":{"path":real,"sha256":row["sha256"]},"leaderImages":list(row["leaderImages"]),
                      "argv":list(argv),"cwd":str(cwd),"environmentKeys":sorted(env),"containment":"cgroup2-delegated",
                      "limits":{"pidsMax":MANAGED["pidsMax"],"memoryMaxBytes":None,"stdoutBytes":MANAGED["stdoutBytes"],"stderrBytes":MANAGED["stderrBytes"]},
                      "retirement":{"onLeaderExit":"require-empty","leaderExitSettleSeconds":MANAGED["settleSeconds"],"termGraceSeconds":MANAGED["termGraceSeconds"],"cleanupSeconds":BUDGET["cleanup"]}}
                  bound={}
                  for path in inputs:
                      path=pathlib.Path(path);require(path.is_absolute() and path.is_file() and not path.is_symlink(),"managed input must be an absolute regular file: "+str(path))
                      bound[str(path)]=sha(path)
                  entry={"phase":phase,"index":index,"name":name,"outDir":str(out_dir),"executable":real,"identityBasis":row["basis"],"inputs":bound,"status":"started"}
                  receipts.append(entry);notes=[record()]
                  state,control=high_water_observer()
                  # The previous group's unit row (shared across this job root's executors) anchors the deltas.
                  previous=next(((r.get("highWater") or {}).get("unit") for r in reversed(receipts[:-1]) if ((r.get("highWater") or {}).get("unit") or {}).get("memoryCurrentBytesAtRemove") is not None),None)
                  try:
                      try:receipt=owner.run(profile,env=dict(env),deadline=deadline,out_dir=str(out_dir),control=control)
                      finally:entry["highWater"]=high_water_record(state,previous) # recorded for every outcome
                  except owner.Refused as error:
                      retained=error.receipt or {}
                      entry.update(status="refused",code=error.code,firstCause=retained.get("firstCause") or str(error))
                      failure=RuntimeError("managed group "+name+" refused: "+str(error));cause=error # closed code first
                  except owner.GroupFailed as error:
                      entry.update(status="failed",firstCause=error.receipt["firstCause"],cleanup=error.receipt["cleanup"],custody=error.receipt["custody"])
                      failure=RuntimeError("managed group "+name+" failed: "+entry["firstCause"]);cause=error
                  except BaseException as error:
                      # Not a contract outcome: keep a terminal index status, then re-raise unchanged.
                      entry.update(status="error",firstCause=type(error).__name__+": "+str(error))
                      for note in filter(None,notes+[record()]):error.add_note(note)
                      raise
                  else:
                      entry.update(status=receipt["outcome"],cleanup=receipt["cleanup"],custody=receipt["custody"],profileSha256=receipt["profileSha256"],ownerSha256=receipt["owner"]["sha256"])
                      failure=None;cause=None
                      if not (receipt["outcome"]=="succeeded" and receipt["cleanup"]=="observed-empty-removed" and receipt["owner"]["sha256"]==OWNER["sha256"]):
                          failure=RuntimeError("managed group "+name+" receipt differs from contained success")
                  notes.append(record())
                  if failure is not None:
                      for note in filter(None,notes):failure.add_note(note)
                      raise failure from cause
                  return (out_dir/"stdout.log").read_text()
              return execute

          def managed_playwright(execute, node, browser_tests, family, env, list_only=False):
              # One managed group per Playwright invocation (custody pilot / installed C): detached
              # browser and Vite groups are contained members and require-empty records leftovers.
              require(family in ("chromium","firefox","webkit"),"unselected browser family")
              cli=browser_tests/"node_modules/@playwright/test/cli.js"
              argv=[str(node),str(cli),"test","--config","wasm-public.generated.config.ts"]+(["--list","--reporter=json"] if list_only else ["--workers=1","--retries=0","--max-failures=1"])
              return execute(argv,browser_tests,{**env,"PLAYWRIGHT_BROWSER_FAMILY":family})

          def hosted_sequence(environ, start):
              # Bound order: exact source, fresh closed environment, pinned owner, containment probe,
              # provisioning, tool qualification, the custody gate, then installed C. Every process is a managed group.
              workspace=pathlib.Path(environ["GITHUB_WORKSPACE"]);root=pathlib.Path(environ["RUNNER_TEMP"])/"fable-wasm-installed-c"
              source=validate_source(environ,environ["CHECKOUT_HEAD"],root)
              env=fresh_environment(root,environ)
              (root/"source.json").write_text(json.dumps(source,indent=2)+"\n")
              setup=phase_deadline(start,"setup",time.monotonic())
              owner=load_owner(root,setup)
              probe_containment(owner,root)
              identities={};receipts=[]
              setup_run=managed_executor(owner,root,setup,identities,"setup",receipts)
              provisioned=prepare_inputs(root,workspace,env,setup_run,download,setup,identities)
              qualify_tools(root,env,setup_run) # actual tool versions, still inside the setup deadline
              custody_gate(provisioned)
              installed=phase_deadline(start,"installed",time.monotonic())
              return installed_c(root,workspace,env,managed_executor(owner,root,installed,identities,"installed",receipts),identities,provisioned["node"])

          def custody_gate(provisioned, admitted=False):
              # Held: the PR-triggered hosted_sequence never passes. Only admitted_installed_sequence passes
              # admitted=True, and only after its dispatch matched a non-None INSTALLED_ADMISSION.
              if admitted is not True or INSTALLED_ADMISSION is None:
                  raise RuntimeError("Chromium support/runtime join and three-family custody pilot remain unadmitted; installed C held")
              return provisioned

          def fixed_checker_argv(workspace, installed, bash):
              # Source stage only: the checker no longer runs Playwright; installed_c runs each invocation.
              return [bash,str(workspace/"tests/composition/fable-game/verify-fable-reference-public.sh"),"--mode","wasm","--template-version",TEMPLATE_VERSION,"--sha256",PACKAGE_SHA,"--descriptor-sha256",DESCRIPTOR_SHA,"--source-revision",PUBLISHED,"--tag-revision",PUBLISHED,"--evidence-dir",str(installed)]

          WASM_FAMILIES = ("chromium", "firefox", "webkit")

          def wasm_selected_tests(suites):
              return [t for suite in suites for spec in suite.get("specs",[]) for t in spec.get("tests",[])]+[t for suite in suites for t in wasm_selected_tests(suite.get("suites",[]))]

          def check_wasm_list(report, family):
              # The checker's former --list assertion: exactly the nine definitions of one selected project.
              require([p["name"] for p in report["config"]["projects"]]==[family],"exact selected family required")
              selected=wasm_selected_tests(report["suites"])
              require(len(selected)==9,"exact nine definitions required")
              require({t["projectName"] for t in selected}=={family} and {t["projectId"] for t in selected}=={family},"wrong selected project population")
              return len(selected)

          def check_wasm_result(report, family):
              # The checker's former result assertion: nine expected, nothing unexpected, flaky or skipped.
              require([p["name"] for p in report["config"]["projects"]]==[family],"runtime family differs")
              stats=report["stats"]
              require(stats["expected"]==9 and stats["unexpected"]==stats["flaky"]==stats["skipped"]==0,"family "+family+" stats differ: "+json.dumps(stats,sort_keys=True))
              return stats

          def installed_c(root, workspace, env, execute, identities, node, timing=None):
              # The checker's source stage is one group; every Playwright --list and test invocation is its
              # own require-empty group, so detached browser/Vite groups cannot outlive their invocation.
              installed=root/"installed"
              require(not installed.exists() and not installed.is_symlink(),"installed evidence root occupied")
              installed.mkdir(mode=0o700)
              (installed/"qualification.json").write_text(json.dumps({"schema":"fable-reference-public/1","disposition":"started"})+"\n")
              bash,_=host_image("/bin/bash");bind_identity(identities,bash,"host-observed")
              checker=workspace/"tests/composition/fable-game/verify-fable-reference-public.sh"
              timing=timing if timing is not None else {}
              began=time.monotonic()
              try:execute(fixed_checker_argv(workspace,installed,bash),root,env,inputs=[checker])
              finally:timing["checkerSeconds"]=round(time.monotonic()-began,3)
              tests=installed/"direct/Browser.Tests";results=installed/"browser"
              require(tests.is_dir() and not tests.is_symlink(),"generated Browser.Tests receiver missing")
              results.mkdir(mode=0o700)
              browser_env={**env,"FsGgWasmPolicyExample":"true","FSGG_WASM_POLICY_EXAMPLE":"true","FSGG_WASM_RESULTS":str(results)}
              summary={"schema":"fsgg.templates.wasm-installed-c/1","disposition":"incomplete","families":{},"timing":timing}
              def timed(family,key,action):
                  began=time.monotonic()
                  try:return action()
