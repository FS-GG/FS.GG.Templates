          def inspect_browser_layout(source, expected, deadline):
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              infos=source.infolist()
              require(len(infos)==expected["members"] and len(infos)<=64000, "archive cardinality differs")
              rows=[]; names={}; links={}; logical=0
              for item in infos:
                  require(time.monotonic()<deadline, "original archive deadline exhausted")
                  name=item.filename; mode=item.external_attr>>16; kind=stat.S_IFMT(mode)
                  require(name and not any(ord(c)<32 or ord(c)==127 for c in name) and "\\" not in name, "unsafe archive name")
                  path=pathlib.PurePosixPath(name)
                  require(not path.is_absolute() and all(x not in ("", ".", "..") for x in name.rstrip("/").split("/")) and str(path)==name.rstrip("/"), "archive traversal or noncanonical path")
                  key=str(path);require(key not in names, "duplicate archive member")
                  require(kind in (stat.S_IFREG,stat.S_IFDIR,stat.S_IFLNK) and not mode & 0o7000 and not item.flag_bits & 1, "unsupported archive type/mode/encryption")
                  require(item.is_dir()==(kind==stat.S_IFDIR), "directory mode/name differs")
                  require(0<=item.file_size<=536870912 and (kind!=stat.S_IFDIR or item.file_size==0), "archive member byte cap")
                  logical+=item.file_size;require(logical<=2147483648, "archive expanded byte cap")
                  target=None
                  if kind==stat.S_IFLNK:
                      require(0<item.file_size<=4096, "symlink byte cap")
                      target=source.read(item).decode("utf-8")
                      require(target and not any(ord(c)<32 or ord(c)==127 for c in target) and "/" not in target and "\\" not in target and target not in (".",".."), "unselected symlink target")
                      links[key]=str(path.parent/target)
                  names[key]=(item,kind);rows.append({"name":name,"mode":mode,"bytes":item.file_size,"link":target})
              require(logical==expected["logicalBytes"] and len(links)==expected["symlinks"], "archive bytes/symlink cardinality differs")
              digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()
              require(digest==expected["layoutSha256"], "authentic archive layout differs")
              for name,(item,kind) in names.items():
                  for ancestor in pathlib.PurePosixPath(name).parents:
                      if str(ancestor)==".":continue
                      require(str(ancestor) not in names or names[str(ancestor)][1]==stat.S_IFDIR, "non-directory archive ancestor")
              for target in links.values():
                  require(target in names and names[target][1]==stat.S_IFREG, "symlink target absent or not regular")
              return infos, rows

          def extract_browser_archive(name, archive, destination, deadline):
              # Caller-owned fresh private root; concurrent writers and runtime/profile admission are not proven here.
              selected=BROWSER_ARCHIVES[name];expected=BROWSER_LAYOUTS[name]
