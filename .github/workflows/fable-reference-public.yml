                      target.chmod(stat.S_IMODE(mode))
                  for row in rows:
                      require(time.monotonic()<deadline, "original archive deadline exhausted")
                      if row["link"] is not None:os.symlink(row["link"],destination/row["name"])
                  for item in sorted(infos,key=lambda i:len(pathlib.PurePosixPath(i.filename).parts),reverse=True):
                      require(time.monotonic()<deadline, "original archive deadline exhausted")
                      if stat.S_ISDIR(item.external_attr>>16):(destination/item.filename).chmod(stat.S_IMODE(item.external_attr>>16))
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              return {"asset":name,"root":str(destination),"archiveSha256":selected["sha256"],**expected,"state":"extracted-data-not-registered-not-qualified"}

