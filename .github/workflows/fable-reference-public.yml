                  require(path.is_file() and not path.is_symlink() and sha(path)==expected,"actual package-owned launcher source differs: "+name)
                  observations.append({"source":str(path),"sha256":expected})
              return observations

          def check_stock_launch_selection(family, argv, env):
              # Necessary selection checks only. Executable/birth/root/argv admission is the managed-group
              # profile of each Playwright invocation; browser-family custody remains unqualified.
              require(family in ("chromium","firefox","webkit"),"unselected browser family")
              require(argv and all(isinstance(arg,str) and not any(ord(c)<32 or ord(c)==127 for c in arg) for arg in argv),"malformed actual browser argv")
              require(env.get("FSGG_WASM_FIREFOX_PROFILE")=="content-sandbox-enabled" and not env.get("MOZ_DISABLE_CONTENT_SANDBOX"),"Firefox disabling is not selected")
              require(not any(env.get(key) for key in ("PLAYWRIGHT_EXECUTABLE_PATH","PLAYWRIGHT_BROWSER_CHANNEL","NODE_OPTIONS","NODE_PATH","PW_TEST_CONNECT_WS_ENDPOINT","PLAYWRIGHT_DASHBOARD")),"browser/executable/channel/Node/connection override refused")
              if family=="chromium":
                  require(argv.count("--no-sandbox")==1 and "--headless" in argv and "--remote-debugging-pipe" in argv and "--no-startup-window" in argv,"actual stock Chromium selection differs")
                  require(not any(arg.startswith(("--proxy-server","--remote-debugging-port")) for arg in argv),"unselected Chromium proxy/transport")
              elif family=="firefox":
                  require("-headless" in argv and "-juggler-pipe" in argv and "-no-remote" in argv and "-profile" in argv and "-silent" in argv,"actual stock Firefox selection differs")
              else:
                  require("--inspector-pipe" in argv and "--headless" in argv and "--no-startup-window" in argv,"actual stock WebKit selection differs")
              return {"family":family,"observedArgv":argv,"selectedBoundary":stock_boundary_metadata(),"fullCanonicalAdmission":"pending"}

          def main():
              # The contract is bound (OWNER, probe_containment, managed_executor). The inline refusal stays
              # literal with the step and upload conditions until C-J1 review and root admission lift all three.
              if not RUNTIME_ADMITTED:
                  raise RuntimeError("C-J1 runtime held: managed-group contract bound; no provisioning, custody pilot or installed C admitted")
              hosted_sequence(os.environ,time.monotonic())

          if __name__ == "__main__": main()
          HOSTED_WASM
      # No runtime evidence exists in the source-only window. Keep its upload
      # disabled with the caller; enabling either requires the C-J1 source review.
      - name: Retain independent partial installed C evidence
        if: ${{ false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fable-wasm-installed-c-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/fable-wasm-installed-c/evidence/**
            ${{ runner.temp }}/fable-wasm-installed-c/managed/**
            ${{ runner.temp }}/fable-wasm-installed-c/managed-owner.json
            ${{ runner.temp }}/fable-wasm-installed-c/managed-owner-probe.json
            ${{ runner.temp }}/fable-wasm-installed-c/managed-receipts.json
            ${{ runner.temp }}/fable-wasm-installed-c/source.json
            ${{ runner.temp }}/fable-wasm-installed-c/input-downloads.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-archive-inputs.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-registration.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-host-validation.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-extracted-layouts.json
            ${{ runner.temp }}/fable-wasm-installed-c/actual-tool-findings.json
            ${{ runner.temp }}/fable-wasm-installed-c/provisioned-paths.json
            ${{ runner.temp }}/fable-wasm-installed-c/phase*.json
            ${{ runner.temp }}/fable-wasm-installed-c/*.log
            ${{ runner.temp }}/fable-wasm-installed-c/*.log.result.json
