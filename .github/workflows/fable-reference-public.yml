          if((mode==="survive"||mode==="serve")&&!(ready&&path.isAbsolute(ready)))throw new Error("absolute ready file required");
          function descendants(root){const rows=[];for(const d of fs.readdirSync("/proc")){if(!/^[0-9]+$/.test(d))continue;try{const s=fs.readFileSync("/proc/"+d+"/stat","utf8");const r=s.slice(s.lastIndexOf(")")+2).split(" ");let exe=null;try{exe=path.basename(fs.readlinkSync("/proc/"+d+"/exe"))}catch(e){}rows.push({pid:+d,ppid:+r[1],pgid:+r[2],sid:+r[3],comm:s.slice(s.indexOf("(")+1,s.lastIndexOf(")")),exe})}catch(e){}}
          const out=[],seen=new Set([root]);let grew=true;while(grew){grew=false;for(const r of rows){if(!seen.has(r.pid)&&seen.has(r.ppid)){seen.add(r.pid);out.push(r);grew=true}}}return out}
          if(mode==="survive"){
          // The leader starts a detached holder that owns the browser, waits for it, then exits: the
          // browser and its holder outlive the leader, so require-empty must retire them.
          const holder=child.spawn(process.execPath,[__filename,family,"serve",ready],{detached:true,stdio:"ignore"});holder.unref();
          const until=Date.now()+30000;const poll=()=>{if(fs.existsSync(ready)){const v=JSON.parse(fs.readFileSync(ready,"utf8"));console.log(JSON.stringify({...v,leaderPid:process.pid,holderPid:holder.pid}));process.exit(0)}
          if(fs.existsSync(ready+".error")){console.error("holder failed: "+fs.readFileSync(ready+".error","utf8"));process.exit(1)}
          if(Date.now()>until){console.error("holder not ready");process.exit(1)}setTimeout(poll,100)};poll();
          }else{
          (async()=>{const browser=await pw[family].launch({headless:true});const page=await browser.newPage();await page.goto("about:blank");
          const value={launched:true,family,mode,version:browser.version(),pid:process.pid,descendants:descendants(process.pid)};
          if(mode==="serve"){fs.writeFileSync(ready+".tmp",JSON.stringify(value));fs.renameSync(ready+".tmp",ready);setInterval(()=>{},1<<30);return}
          console.log(JSON.stringify(value));
          if(mode==="exit")process.exit(0);
          setInterval(()=>{},1<<30)})().catch(e=>{if(mode==="serve")try{fs.writeFileSync(ready+".error",String(e&&e.stack||e))}catch(w){}console.error(e);process.exit(1)});
          }
          """

          PILOT_SPEC = """const {test,expect}=require("@playwright/test");
          test("custody pilot page",async({page})=>{await page.goto(process.env.PILOT_URL);await expect(page).toHaveTitle("fsgg-custody-pilot");});
          """

          def pilot_files(seed, node):
              # Written inside the stock seed so @playwright/test and playwright-core resolve from its node_modules.
              directory=seed/"Browser.Tests/custody-pilot";directory.mkdir(mode=0o700)
              client=seed/"Client";dist=client/"custody-pilot-dist";dist.mkdir(mode=0o700)
              (dist/"index.html").write_text("<!doctype html><title>fsgg-custody-pilot</title><p>custody pilot</p>\n")
              vite=client/"node_modules/vite/bin/vite.js"
              spec=content_file(directory,"custody",".spec.cjs",PILOT_SPEC)
              web=json.dumps(node)+" "+json.dumps(str(vite))+" preview --outDir custody-pilot-dist --host 127.0.0.1 --port "+str(PILOT_PORT)+" --strictPort"
              config_text=("const family=process.env.PILOT_FAMILY,results=process.env.PILOT_RESULTS,url=process.env.PILOT_URL;\n"
                  "if(![\"chromium\",\"firefox\",\"webkit\"].includes(family)||!results||!results.startsWith(\"/\")||!url)throw new Error(\"explicit family/results/url required\");\n"
                  "if(process.env.PLAYWRIGHT_EXECUTABLE_PATH)throw new Error(\"own registry required\");\n"
                  "module.exports={testDir:__dirname,testMatch:"+json.dumps(spec.name)+",workers:1,retries:0,timeout:60000,\n"
                  "  outputDir:results+\"/\"+family+\"/normal-results\",\n"
                  "  reporter:[[\"line\"],[\"json\",{outputFile:results+\"/\"+family+\"/normal-report.json\"}]],\n"
                  "  use:{headless:true,trace:\"off\",screenshot:\"off\",video:\"off\"},\n"
                  "  projects:[{name:family,use:{browserName:family}}],\n"
                  "  webServer:{command:"+json.dumps(web)+",cwd:"+json.dumps(str(client))+",url:url,timeout:60000,reuseExistingServer:false}};\n")
              config=content_file(directory,"custody-pilot",".config.cjs",config_text)
              hold=content_file(directory,"custody-hold",".cjs",PILOT_HOLD_SCRIPT)
              return {"directory":directory,"spec":spec,"config":config,"hold":hold,"vite":vite,"dist":dist}

          def parse_ldd(text, targets):
              missing={str(t):[] for t in targets};current=str(targets[0]) if len(targets)==1 else None
              for line in text.splitlines():
                  if line.endswith(":") and line[:-1] in missing:current=line[:-1];continue
                  if "=> not found" in line and current is not None:missing[current].append(line.split("=>")[0].strip())
              return missing

          def pilot_receipt(entry):
              # Compact receipt summary; the full receipt stays in the retained evidence.
              if entry is None or not (pathlib.Path(entry["outDir"])/"receipt.json").is_file():return None
              r=json.loads((pathlib.Path(entry["outDir"])/"receipt.json").read_text())
              leader=r.get("leader") or {}
              return {"name":entry["name"],"status":entry["status"],"outcome":r.get("outcome"),"refusal":r.get("refusal"),"firstCause":r.get("firstCause"),
                  "cleanup":r.get("cleanup"),"custody":r.get("custody"),"exit":r.get("exit"),"leaderImage":leader.get("image"),"noNewPrivileges":leader.get("noNewPrivileges"),
                  "membersObserved":(r.get("members") or {}).get("observed"),"residualAfterLeaderExit":len(r.get("residualAfterLeaderExit") or []),
                  "residualInRoot":r.get("residualInRoot"),"escaped":len(r.get("escaped") or []),"retirement":r.get("retirement"),
                  "memberPids":[m.get("pid") for m in (r.get("members") or {}).get("sample") or []],"residualPids":[m.get("pid") for m in r.get("residualAfterLeaderExit") or []],
                  "stopSeconds":(r.get("timing") or {}).get("stopSeconds"),"profileSha256":r.get("profileSha256"),"ownerSha256":(r.get("owner") or {}).get("sha256")}

          def pilot_group(execute, argv, cwd, env, receipts, inputs=()):
              before=len(receipts);error=None
              try:execute(argv,cwd,env,inputs=inputs)
              except Exception as caught:error=type(caught).__name__+": "+str(caught) # evidence, never an abort of later cases
              entry=receipts[-1] if len(receipts)>before else None
              stdout=(pathlib.Path(entry["outDir"])/"stdout.log") if entry else None
              text=stdout.read_text(errors="replace") if stdout and stdout.is_file() else ""
              stderr=(pathlib.Path(entry["outDir"])/"stderr.log") if entry else None
              excerpt=stderr.read_text(errors="replace")[:4096] if stderr and stderr.is_file() else ""
              try:receipt=pilot_receipt(entry)
              except Exception as caught:receipt=None;error=error or "receipt unreadable: "+type(caught).__name__+": "+str(caught)
              return {"error":error,"receipt":receipt,"stdout":text,"stderr":excerpt}

          def launched(text):
              for line in text.splitlines():
                  try:value=json.loads(line)
                  except ValueError:continue
                  if isinstance(value,dict) and value.get("launched") is True:return value
              return None

          def surviving_browser_members(result):
              pids=set((result["receipt"] or {}).get("residualPids") or [])
              return [d for d in (launched(result["stdout"]) or {}).get("descendants",[]) if d.get("pid") in pids]

          def classify_pilot_case(case, result, report=None):
              r=result["receipt"];cause=(r or {}).get("firstCause") or result["error"] or ""
              retired=bool(r) and r["cleanup"]=="observed-empty-removed" and r["custody"]=="contained" and not r["escaped"]
              if case=="normal":
                  passed=bool(report) and report.get("stats",{}).get("expected")==1 and report["stats"].get("unexpected")==0
                  if retired and r["outcome"]=="succeeded" and passed:return "clean-stock-shutdown"
                  if retired and passed and "leader exited with live contained members" in cause:return "stock-leftover-retired"
                  return "run-failed"
              if case=="forced":
                  return "deadline-retired" if retired and "original deadline exhausted" in cause and launched(result["stdout"]) else "unexpected"
              if case=="exit":
                  if retired and launched(result["stdout"]) and r["outcome"]=="succeeded":return "browser-exited-with-leader"
                  if retired and launched(result["stdout"]) and "leader exited with live contained members" in cause:return "leftover-retired"
                  return "unexpected"
              if case=="survivor":
                  # A browser process (a launch descendant, not just the holder) must outlive the leader,
                  # be recorded as residual, then be retired.
                  if retired and surviving_browser_members(result) and "leader exited with live contained members" in cause:return "leftover-retired"
                  return "unexpected"
              raise ValueError("closed pilot case required")

          PILOT_EXPECTED = {"normal":("clean-stock-shutdown","stock-leftover-retired"),"forced":("deadline-retired",),"exit":("browser-exited-with-leader","leftover-retired"),"survivor":("leftover-retired",),
              "scan":("support-complete","support-missing")}

          def pilot_disposition(summary):
              reasons=[]
              for name in ("chromium-headless1243","chromium-full1243"):
                  row=summary["libraryScan"].get(name)
                  if row is None:reasons.append("scan "+name+": not run")
                  elif row["disposition"] not in PILOT_EXPECTED["scan"]:reasons.append("scan "+name+": "+row["disposition"])
              for family in PILOT_FAMILIES:
                  for case in PILOT_CASES:
                      row=summary["cases"].get(family,{}).get(case)
                      if row is None:reasons.append(family+"/"+case+": not run")
                      elif row["disposition"] not in PILOT_EXPECTED[case]:reasons.append(family+"/"+case+": "+row["disposition"])
              summary["reasons"]=reasons
              return "completed" if not reasons else "incomplete"

          def chromium_library_scan(root, env, owner, identities, receipts, registered, deadline):
              ldd,_=host_image("/usr/bin/ldd")
              interpreter=pathlib.Path(ldd).read_text(errors="replace").splitlines()[0]
              require(interpreter.startswith("#!"),"host ldd interpreter unknown")
              interp,interp_sha=host_image(interpreter[2:].strip().split()[0])
              bind_identity(identities,ldd,"host-observed",images=[interp_sha])
              rows={}
              for asset in ("chromium-headless1243","chromium-full1243"):
                  executable=pathlib.Path(next(r["executable"] for r in registered if r["asset"]==asset))
                  targets=[executable]+sorted(p for p in executable.parent.iterdir() if p.is_file() and not p.is_symlink() and ".so" in p.name)
                  execute=managed_executor(owner,root,min(deadline,time.monotonic()+PILOT_CASE_SECONDS["scan"]),identities,"custody",receipts)
                  result=pilot_group(execute,[ldd]+[str(t) for t in targets],root,env,receipts)
                  missing=parse_ldd(result["stdout"],targets)
                  ok=bool(result["receipt"]) and result["receipt"]["outcome"]=="succeeded"
                  rows[asset]={"directory":str(executable.parent),"targets":len(targets),"missing":{k:v for k,v in missing.items() if v},
                      "disposition":("support-missing" if any(missing.values()) else "support-complete") if ok else "scan-failed","receipt":result["receipt"],"error":result["error"]}
              return rows

          def run_custody_pilot(root, env, owner, identities, receipts, provisioned, deadline, summary, write):
              files=pilot_files(provisioned["seed"],provisioned["node"])
              summary["pilotFiles"]={k:str(v) for k,v in files.items()}
              try:summary["libraryScan"]=chromium_library_scan(root,env,owner,identities,receipts,provisioned["registered"],deadline)
              except Exception as error:summary["libraryScanError"]=type(error).__name__+": "+str(error)
              write()
              results=root/"pilot-results";results.mkdir(mode=0o700)
              ready_dir=root/"pilot-ready";ready_dir.mkdir(mode=0o700)
              tests=provisioned["seed"]/"Browser.Tests";node=provisioned["node"]
              cli=str(tests/"node_modules/@playwright/test/cli.js")
              for family in PILOT_FAMILIES:
                  (results/family).mkdir(mode=0o700);rows=summary["cases"].setdefault(family,{})
                  case_env={**env,"PILOT_FAMILY":family,"PILOT_RESULTS":str(results),"PILOT_URL":"http://127.0.0.1:"+str(PILOT_PORT)+"/"}
                  def group(case, argv, inputs):
                      execute=managed_executor(owner,root,min(deadline,time.monotonic()+PILOT_CASE_SECONDS[case]),identities,"custody",receipts)
                      return pilot_group(execute,argv,tests,case_env,receipts,inputs)
                  # Normal: the stock runner, its webServer (vite preview) and browser must leave nothing behind.
                  try:
                      result=group("normal",[node,cli,"test","--config",str(files["config"])],[files["config"],files["spec"]])
                      report_path=results/family/"normal-report.json"
                      try:report=json.loads(report_path.read_bytes()) if report_path.is_file() else None
                      except ValueError:report=None
                      rows["normal"]={"disposition":classify_pilot_case("normal",result,report),"stats":(report or {}).get("stats"),"receipt":result["receipt"],"error":result["error"],"stderr":result["stderr"]}
                  except Exception as error:rows["normal"]={"disposition":"run-failed","error":type(error).__name__+": "+str(error)}
                  write()
                  # Forced: a live browser held past its group deadline must be retired by the owner.
                  try:
                      result=group("forced",[node,str(files["hold"]),family,"hold"],[files["hold"]])
                      launch=launched(result["stdout"]);pids=set((result["receipt"] or {}).get("memberPids") or [])
                      held=[d for d in (launch or {}).get("descendants",[]) if d.get("pid") in pids]
                      rows["forced"]={"disposition":classify_pilot_case("forced",result),"launch":launch,"observedBrowserMembers":held,"receipt":result["receipt"],"error":result["error"],"stderr":result["stderr"]}
                  except Exception as error:rows["forced"]={"disposition":"unexpected","error":type(error).__name__+": "+str(error)}
                  write()
                  # Leader exit: the leader exits without closing; any surviving browser member is retired.
                  try:
                      result=group("exit",[node,str(files["hold"]),family,"exit"],[files["hold"]])
                      rows["exit"]={"disposition":classify_pilot_case("exit",result),"launch":launched(result["stdout"]),"receipt":result["receipt"],"error":result["error"],"stderr":result["stderr"]}
                  except Exception as error:rows["exit"]={"disposition":"unexpected","error":type(error).__name__+": "+str(error)}
                  write()
                  # Survivor: a detached holder keeps the browser alive after the leader exits; require-empty retires it.
                  try:
                      ready=ready_dir/(family+".json")
                      result=group("survivor",[node,str(files["hold"]),family,"survive",str(ready)],[files["hold"]])
                      launch=launched(result["stdout"]);survivors=surviving_browser_members(result)
                      rows["survivor"]={"disposition":classify_pilot_case("survivor",result),"launch":launch,"survivingBrowserMembers":survivors,"receipt":result["receipt"],"error":result["error"],"stderr":result["stderr"]}
                  except Exception as error:rows["survivor"]={"disposition":"unexpected","error":type(error).__name__+": "+str(error)}
                  write()

          def collect_pilot_evidence(root):
              # One bounded evidence tree for the single artifact: summaries, receipts, small logs, reports, scripts.
              evidence=root/"pilot-evidence";require(not evidence.exists(),"pilot evidence root occupied");evidence.mkdir(mode=0o700)
              candidates=[root/name for name in ("custody-pilot.json","managed-receipts.json","managed-owner.json","managed-owner-probe.json","source.json","input-downloads.json",
                  "browser-archive-inputs.json","browser-registration.json","browser-extracted-layouts.json","browser-host-validation.json")]
              managed=root/"managed"
              if managed.is_dir():
                  for group in sorted(managed.iterdir()):candidates+=[group/n for n in ("receipt.json","stdout.log","stderr.log")]
              for pattern_root,pattern in ((root/"pilot-results","*.json"),(root/"npm-seed/Browser.Tests/custody-pilot","*.cjs"),(root/"host-packages","*"),(root/"pilot-ready","*")):
                  if pattern_root.is_dir():candidates+=sorted(pattern_root.rglob(pattern))
              manifest={"schema":"fsgg.templates.wasm-custody-pilot-evidence/1","capBytes":PILOT_EVIDENCE_BYTES,"files":[],"skipped":[],"truncated":[],"unreadable":[]};total=0
              for path in candidates:
                  if not path.is_file() or path.is_symlink():continue
                  try:data=path.read_bytes()
                  except OSError as error:manifest["unreadable"].append({"path":str(path),"error":type(error).__name__});continue # one file never loses the rest
                  if path.suffix==".log" and len(data)>1048576:manifest["truncated"].append({"path":str(path),"bytes":len(data)});data=data[:1048576]
                  if total+len(data)>PILOT_EVIDENCE_BYTES:manifest["skipped"].append({"path":str(path),"bytes":len(data)});continue
                  relative=path.relative_to(root);target=evidence/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  total+=len(data);manifest["files"].append({"path":str(relative),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              manifest["totalBytes"]=total
              (evidence/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
              return manifest

          def pinned_webkit_packages(core):
              # deps["ubuntu24.04-x64"].webkit read from the pinned coreBundle bytes (no execution).
              text=pathlib.Path(core).read_text(errors="replace")
              block=text[text.index('"ubuntu24.04-x64": {'):]
              start=block.index("webkit: [");end=block.index("]",start)
              return list(dict.fromkeys(re.findall(r'"([^"]+)"',block[start:end])))

          def dpkg_table(path):
              rows={}
              for line in pathlib.Path(path).read_text(errors="replace").splitlines():
                  parts=line.split("\t")
                  if len(parts)>=2 and parts[0]:rows[parts[0]]={"version":parts[1],"status":parts[2] if len(parts)>2 else None}
              return rows

          HOST_EVIDENCE_FILES = ("packages.txt","dpkg-before.tsv","dpkg-after.tsv","dpkg-after.err","dpkg-diff.txt","apt-sources.txt",
              "apt-mirrors-before.txt","apt-mirrors-after.txt","fallback.txt","update-attempted.txt","update.log","update-exit.txt",
              "install-attempted.txt","install.log","install-exit.txt","step-complete.txt","dpkg-settle.txt","post-step-processes.txt","post-step-check.txt")
          TIMEOUT_EXITS = ("124","137") # timeout(1): limit reached; killed after the -k grace

          def pilot_host_packages(environ, root):
              # Reads the evidence of the pre-unit apt step (it cannot run inside the NoNewPrivileges unit).
              # attempted / timed-out come from the step's own markers, never from a missing file.
              host=pathlib.Path(environ["HOST_EVIDENCE"])
              summary={"evidence":str(host),"attempted":False,"timedOut":False,"label":"ubuntu-24.04"}
              if not (host.is_dir() and not host.is_symlink()):summary["state"]="host-evidence-missing";return summary
              target=root/"host-packages";target.mkdir(mode=0o700)
              for name in HOST_EVIDENCE_FILES:
                  source=host/name
                  if source.is_file() and not source.is_symlink():(target/name).write_bytes(source.read_bytes()[:4194304])
              read=lambda name:(target/name).read_text(errors="replace").strip() if (target/name).is_file() else None
              listed=[l.strip() for l in (read("packages.txt") or "").splitlines() if l.strip()]
              summary["listedEqualsAdmittedList"]=listed==list(PILOT_WEBKIT_PACKAGES)
              summary["updateAttempted"]=read("update-attempted.txt")=="attempted"
              summary["attempted"]=read("install-attempted.txt")=="attempted"
              summary["updateExit"]=read("update-exit.txt");summary["installExit"]=read("install-exit.txt")
              summary["stepComplete"]=read("step-complete.txt");summary["fallback"]=read("fallback.txt")
              summary["installTimedOut"]=summary["installExit"] in TIMEOUT_EXITS;summary["updateTimedOut"]=summary["updateExit"] in TIMEOUT_EXITS
              summary["timedOut"]=summary["installTimedOut"] or summary["updateTimedOut"]
              summary["dpkgSettle"]=read("dpkg-settle.txt")
              if summary["attempted"] or summary["updateAttempted"]:summary["label"]="ubuntu-24.04 + recorded packages"
              hosts={}
              for line in (read("install.log") or "").splitlines():
                  match=re.match(r"Get:\d+ [a-z+]+://([^/ ]+)/",line) # only fetches that were served
                  if match:hosts[match.group(1)]=hosts.get(match.group(1),0)+1
              summary["fetchHosts"]=hosts
              check=read("post-step-check.txt")
              summary["postStepAptProcesses"]=int(check.split()[-1]) if check and check.split()[-1].isdigit() else None
              if (target/"dpkg-before.tsv").is_file() and (target/"dpkg-after.tsv").is_file():
                  before,after=dpkg_table(target/"dpkg-before.tsv"),dpkg_table(target/"dpkg-after.tsv")
                  summary["added"]={k:v["version"] for k,v in sorted(after.items()) if k not in before}
                  summary["changed"]={k:[before[k]["version"],v["version"]] for k,v in sorted(after.items()) if k in before and before[k]["version"]!=v["version"]}
                  summary["removed"]=sorted(k for k in before if k not in after)
                  summary["listedVersions"]={k:(after.get(k) or {}).get("version") for k in PILOT_WEBKIT_PACKAGES}
                  summary["listedMissingAfter"]=[k for k in PILOT_WEBKIT_PACKAGES if k not in after]
              if summary["attempted"] and summary["installExit"]=="0" and summary.get("listedMissingAfter")==[]:summary["state"]="installed"
              elif summary["installTimedOut"]:summary["state"]="install-timed-out"
              elif summary["attempted"] and summary["installExit"] in (None,"not-run"):summary["state"]="install-interrupted"
              elif summary["attempted"]:summary["state"]="install-failed"
              elif summary["updateAttempted"]:summary["state"]="install-not-reached"
              else:summary["state"]="not-attempted"
              return summary

          def pilot_unit_properties(environ, root, env, execute, identities, receipts, expected=None):
              # The admitted unit limits, read back from systemd as one managed group (no unmanaged process).
              systemctl,_=host_image("/usr/bin/systemctl");bind_identity(identities,systemctl,"host-observed")
              names=("TasksMax","MemoryMax","RuntimeMaxUSec","Delegate","NoNewPrivileges","KillMode","TimeoutStopUSec","User","ControlGroup")
              argv=[systemctl,"show","--no-pager",environ["UNIT_NAME"]]+[x for name in names for x in ("-p",name)]
              result=pilot_group(execute,argv,root,env,receipts)
              props=dict(line.split("=",1) for line in result["stdout"].splitlines() if "=" in line)
              expected=expected or {"TasksMax":"4096","MemoryMax":str(8*1073741824),"RuntimeMaxUSec":"30min","Delegate":"yes","NoNewPrivileges":"yes","KillMode":"control-group"}
              return {"properties":props,"matchesAdmission":{k:props.get(k)==v for k,v in expected.items()},"error":result["error"],"receipt":result["receipt"]}

          def pilot_sequence(environ, start):
              if PILOT_ADMISSION is None:
                  raise RuntimeError("custody pilot closed: PILOT_ADMISSION is unset in source; nothing acquired or run")
              root=pathlib.Path(environ["RUNNER_TEMP"])/"wasm-custody-pilot"
              source=validate_dispatch_source(environ,environ["CHECKOUT_HEAD"],root)
              env=fresh_environment(root,environ)
              summary={"schema":"fsgg.templates.wasm-custody-pilot/1","disposition":"started","admission":PILOT_ADMISSION,"source":source,"owner":OWNER,
                  "families":list(PILOT_FAMILIES),"libraryScan":{},"cases":{}}
              def write():(root/"custody-pilot.json").write_text(json.dumps(summary,indent=2)+"\n")
              try:
                  write();(root/"source.json").write_text(json.dumps(source,indent=2)+"\n")
                  setup=pilot_deadline(start,"setup",time.monotonic())
                  owner=load_owner(root,setup)
                  summary["probe"]=probe_containment(owner,root)
                  identities={};receipts=[]
                  setup_run=managed_executor(owner,root,setup,identities,"setup",receipts)
                  unit_run=managed_executor(owner,root,min(setup,time.monotonic()+PILOT_CASE_SECONDS["unit"]),identities,"setup",receipts)
                  summary["unit"]=pilot_unit_properties(environ,root,env,unit_run,identities,receipts)
                  summary["hostPackages"]=pilot_host_packages(environ,root);summary["platformLabel"]=summary["hostPackages"]["label"];write()
                  provisioned=prepare_browser_inputs(root,env,setup_run,download,setup,identities,receipts)
                  summary["hostValidation"]=provisioned["hostValidation"]
                  core=provisioned["seed"]/"Browser.Tests/node_modules/playwright-core/lib/coreBundle.js"
                  try:summary["hostPackages"]["admittedListMatchesPinnedPlaywright"]=pinned_webkit_packages(core)==list(PILOT_WEBKIT_PACKAGES)
                  except Exception as error:summary["hostPackages"]["admittedListMatchesPinnedPlaywright"]="unreadable: "+type(error).__name__
                  write()

                  run_custody_pilot(root,env,owner,identities,receipts,provisioned,pilot_deadline(start,"custody",time.monotonic()),summary,write)
                  summary["disposition"]=pilot_disposition(summary)
              except BaseException as error:
                  summary["disposition"]="failed";summary["firstCause"]=type(error).__name__+": "+str(error)
                  raise
              finally:
                  notes=[]
                  try:write()
                  except Exception as reporting:notes.append("pilot summary reporting failure: "+type(reporting).__name__+": "+str(reporting))
                  try:summary["evidence"]=collect_pilot_evidence(root)
                  except Exception as reporting:notes.append("pilot evidence collection failure: "+type(reporting).__name__+": "+str(reporting))
                  for note in notes:print(note,file=sys.stderr)
              return summary

          # ---- Admitted installed C (downloaded-only 27-case journey; wasm-installed-c.yml, dispatch only) ----
          def installed_deadline(start, phase, now):
              require(phase in ("setup","installed"),"closed installed-C phase required")
              reserved=INSTALLED_BUDGET["cleanup"]+INSTALLED_BUDGET["collection"]+INSTALLED_BUDGET["overhead"]
              later={"setup":INSTALLED_BUDGET["installed"]+INSTALLED_BUDGET["cleanup"],"installed":0}[phase]
              deadline=min(now+INSTALLED_BUDGET[phase],start+INSTALLED_BUDGET["job"]-reserved-later)
              require(deadline>now,"original installed-C budget cannot supply this phase")
              return deadline

          def admission_precheck(environ, admission):
              # Pre-host-write gate for a dispatch workflow: nothing (not even the recorded apt step) runs
              # unless source carries the exact admission and the dispatch binds it on its first attempt.
              require(admission is not None,"not admitted in source")
              require(environ.get("ADMISSION")==admission,"admission input differs from source")
              require(re.fullmatch(r"[0-9a-f]{40}",environ.get("ADMITTED_REF","")) and environ["ADMITTED_REF"]==environ.get("SHA"),"admitted_ref differs from the dispatched commit")
              require(environ.get("RUN_ATTEMPT")=="1","re-run refused: a new admission is required")
              return True

          def validate_installed_dispatch(env, head, root):
              require(INSTALLED_ADMISSION is not None,"installed C not admitted")
              require(env["EVENT"]=="workflow_dispatch" and env["REPOSITORY"]=="FS-GG/FS.GG.Templates","admitted same-repository dispatch required")
              require(env["REF"]=="refs/heads/main","main ref required")
              require(re.fullmatch(r"[0-9a-f]{40}",env["ADMITTED_REF"]) and env["ADMITTED_REF"]==env["SHA"]==head,"admitted_ref must equal the dispatched and checked-out commit")
              require(env["ADMISSION"]==INSTALLED_ADMISSION,"admission differs from the recorded installed-C admission")
              require(env["WORKFLOW_REF"]==INSTALLED_WORKFLOW and env["WORKFLOW_SHA"]==env["SHA"],"installed-C workflow identity differs")
              require(env["RUN_ATTEMPT"]=="1","re-run refused: a new admission is required")
              require(env.get("UNIT_NAME")=="fsgg-mg-templates-installed-"+env["RUN_ID"]+"-"+env["RUN_ATTEMPT"],"delegated unit identity differs")
              # The recorded WebKit host-package step is shared byte-for-byte with the accepted pilot.
              require(env.get("HOST_EVIDENCE")==str(pathlib.Path(env["RUNNER_TEMP"])/"wasm-custody-pilot-host"),"host package evidence path differs")
              require(pathlib.Path(env.get("GITHUB_WORKSPACE","")).is_absolute(),"checked-out workspace required")
              require(pathlib.Path(root).is_absolute() and not pathlib.Path(root).is_symlink(),"private root must be an absolute nonlink")
              return {**{k:env[k] for k in ("EVENT","REPOSITORY","REF","SHA","ADMITTED_REF","ADMISSION","WORKFLOW_REF","WORKFLOW_SHA","RUN_ID","RUN_ATTEMPT","UNIT_NAME")},
                  "templateVersion":TEMPLATE_VERSION,"packageSha256":PACKAGE_SHA,"imageOS":env.get("ImageOS"),"imageVersion":env.get("ImageVersion")}

          def collect_installed_evidence(root):
              # One bounded artifact: summaries, receipts, small logs, checker evidence, per-family reports and traces.
              evidence=root/"installed-evidence";require(not evidence.exists(),"installed evidence root occupied");evidence.mkdir(mode=0o700)
              names=("installed-run.json","installed-c.json","managed-receipts.json","managed-owner.json","managed-owner-probe.json","source.json","input-downloads.json",
                  "browser-archive-inputs.json","browser-registration.json","browser-extracted-layouts.json","browser-host-validation.json","provisioned-paths.json","actual-tool-findings.json")
              candidates=[root/n for n in names]
              if (root/"managed").is_dir():
                  for group in sorted((root/"managed").iterdir()):candidates+=[group/n for n in ("receipt.json","stdout.log","stderr.log")]
              if (root/"host-packages").is_dir():candidates+=sorted((root/"host-packages").iterdir())
              installed=root/"installed"
              if installed.is_dir():
                  candidates+=sorted(p for p in installed.iterdir() if p.suffix in (".json",".log",".sha256"))
                  if (installed/"browser").is_dir():candidates+=sorted(p for p in (installed/"browser").rglob("*") if p.suffix in (".json",".md",".zip"))
              manifest={"schema":"fsgg.templates.wasm-installed-c-evidence/1","capBytes":INSTALLED_EVIDENCE_BYTES,"files":[],"skipped":[],"truncated":[],"unreadable":[]};total=0
              for path in candidates:
                  if not path.is_file() or path.is_symlink():continue
                  try:data=path.read_bytes()
                  except OSError as error:manifest["unreadable"].append({"path":str(path),"error":type(error).__name__});continue
                  if path.suffix==".log" and len(data)>1048576:manifest["truncated"].append({"path":str(path),"bytes":len(data)});data=data[:1048576]
                  if total+len(data)>INSTALLED_EVIDENCE_BYTES:manifest["skipped"].append({"path":str(path),"bytes":len(data)});continue
                  relative=path.relative_to(root);target=evidence/relative;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  total+=len(data);manifest["files"].append({"path":str(relative),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
              manifest["totalBytes"]=total
              (evidence/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
              return manifest

          def admitted_installed_sequence(environ, start):
              # Held while INSTALLED_ADMISSION is None: refuses before any acquisition, root or process.
              if INSTALLED_ADMISSION is None:
                  raise RuntimeError("installed C not admitted: INSTALLED_ADMISSION is unset in source; nothing acquired or run")
              workspace=pathlib.Path(environ["GITHUB_WORKSPACE"]);root=pathlib.Path(environ["RUNNER_TEMP"])/"wasm-installed-c"
              source=validate_installed_dispatch(environ,environ["CHECKOUT_HEAD"],root)
              env=fresh_environment(root,environ)
              summary={"schema":"fsgg.templates.wasm-installed-c-run/1","disposition":"started","admission":INSTALLED_ADMISSION,"source":source,"owner":OWNER,
                  "timing":{"budgetSeconds":dict(INSTALLED_BUDGET)}}
              # Monotonic seconds since this sequence's ``start`` (taken by wasm-installed-c.py inside the unit,
              # the same origin installed_deadline uses), not since the GitHub job started.
              timing=summary["timing"];since=lambda:round(time.monotonic()-start,3)
              def write():(root/"installed-run.json").write_text(json.dumps(summary,indent=2)+"\n")
              try:
                  write();(root/"source.json").write_text(json.dumps(source,indent=2)+"\n")
                  setup=installed_deadline(start,"setup",time.monotonic());timing["setupStartedAt"]=since()
                  owner=load_owner(root,setup)
                  summary["probe"]=probe_containment(owner,root)
                  identities={};receipts=[]
                  unit_run=managed_executor(owner,root,min(setup,time.monotonic()+20),identities,"setup",receipts)
                  summary["unit"]=pilot_unit_properties(environ,root,env,unit_run,identities,receipts,INSTALLED_UNIT)
                  require(summary["unit"]["error"] is None and all(summary["unit"]["matchesAdmission"].values()),"delegated unit properties differ from the admission")
                  summary["hostPackages"]=pilot_host_packages(environ,root);summary["platformLabel"]=summary["hostPackages"]["label"];write()
                  # The 27-case journey needs all three families: without the recorded WebKit packages, refuse
                  # before any provisioning acquisition.
                  require(summary["hostPackages"]["state"]=="installed","WebKit host packages not installed: "+str(summary["hostPackages"]["state"]))
                  require(summary["hostPackages"].get("postStepAptProcesses")==0,"apt or dpkg process still running after the host-package step")
                  setup_run=managed_executor(owner,root,setup,identities,"setup",receipts)
                  provisioned=prepare_inputs(root,workspace,env,setup_run,download,setup,identities)
                  qualify_tools(root,env,setup_run)
                  timing["setupSeconds"]=round(since()-timing["setupStartedAt"],3)
                  summary["hostValidation"]=provisioned["hostValidation"];write()
                  custody_gate(provisioned,admitted=True)
                  installed=installed_deadline(start,"installed",time.monotonic());timing["installedStartedAt"]=since()
                  try:summary["installedC"]=installed_c(root,workspace,env,managed_executor(owner,root,installed,identities,"installed",receipts),identities,provisioned["node"],timing)
                  finally:timing["installedSeconds"]=round(since()-timing["installedStartedAt"],3)
                  summary["disposition"]=summary["installedC"]["disposition"]
              except BaseException as error:
                  summary["disposition"]="failed";summary["firstCause"]=type(error).__name__+": "+str(error)
                  raise
              finally:
                  timing["sequenceSeconds"]=since()
                  if "setupStartedAt" in timing and "setupSeconds" not in timing:timing["setupSecondsUntilStop"]=round(since()-timing["setupStartedAt"],3)
                  notes=[]
                  try:write()
                  except Exception as reporting:notes.append("installed summary reporting failure: "+type(reporting).__name__+": "+str(reporting))
                  try:summary["evidence"]=collect_installed_evidence(root)
                  except Exception as reporting:notes.append("installed evidence collection failure: "+type(reporting).__name__+": "+str(reporting))
                  for note in notes:print(note,file=sys.stderr)
              return summary

          def main():
              # The contract is bound (OWNER, probe_containment, managed_executor). The inline refusal stays
              # literal with the step and upload conditions until C-J1 review and root admission lift all three.
              if not RUNTIME_ADMITTED:
                  raise RuntimeError("C-J1 runtime held: managed-group contract bound; no provisioning, custody pilot or installed C admitted")
              hosted_sequence(os.environ,time.monotonic())

          if __name__ == "__main__": main()
          HOSTED_WASM
      # No runtime evidence exists in the source-only window. Keep its upload
      # disabled with the caller; enabling either requires the C-J1 source review.
      - name: Retain independent partial installed C evidence
        if: ${{ false }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fable-wasm-installed-c-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/fable-wasm-installed-c/evidence/**
            ${{ runner.temp }}/fable-wasm-installed-c/managed/**
            ${{ runner.temp }}/fable-wasm-installed-c/managed-owner.json
            ${{ runner.temp }}/fable-wasm-installed-c/managed-owner-probe.json
            ${{ runner.temp }}/fable-wasm-installed-c/managed-receipts.json
            ${{ runner.temp }}/fable-wasm-installed-c/source.json
            ${{ runner.temp }}/fable-wasm-installed-c/installed-c.json
            ${{ runner.temp }}/fable-wasm-installed-c/installed/qualification.json
            ${{ runner.temp }}/fable-wasm-installed-c/installed/*.log
            ${{ runner.temp }}/fable-wasm-installed-c/installed/browser/**
            ${{ runner.temp }}/fable-wasm-installed-c/browser-host-validation.*.cjs
            ${{ runner.temp }}/fable-wasm-installed-c/input-downloads.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-archive-inputs.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-registration.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-host-validation.json
            ${{ runner.temp }}/fable-wasm-installed-c/browser-extracted-layouts.json
            ${{ runner.temp }}/fable-wasm-installed-c/actual-tool-findings.json
            ${{ runner.temp }}/fable-wasm-installed-c/provisioned-paths.json
            ${{ runner.temp }}/fable-wasm-installed-c/phase*.json
            ${{ runner.temp }}/fable-wasm-installed-c/*.log
            ${{ runner.temp }}/fable-wasm-installed-c/*.log.result.json
