              require(logical==expected["logicalBytes"] and len(links)==expected["symlinks"], "archive bytes/symlink cardinality differs")
              digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()
              require(digest==expected["layoutSha256"], "authentic archive layout differs")
