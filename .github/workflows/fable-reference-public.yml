                  profile={"schema":"fsgg.managed-group-profile/1","name":name,"root":str(root),
                      "executable":{"path":real,"sha256":row["sha256"]},"leaderImages":list(row["leaderImages"]),
                      "argv":list(argv),"cwd":str(cwd),"environmentKeys":sorted(env),"containment":"cgroup2-delegated",
