              require(archive.is_file() and not archive.is_symlink() and archive.stat().st_size==selected["bytes"], "browser raw archive size/path differs before extraction")
              digest=hashlib.sha256()
              with archive.open("rb") as raw:
                  while True:
                      require(time.monotonic()<deadline, "original archive deadline exhausted")
                      block=raw.read(1048576)
                      require(time.monotonic()<deadline, "original archive deadline exhausted")
                      if not block:break
                      digest.update(block)
              require(digest.hexdigest()==selected["sha256"], "browser raw archive differs before extraction")
              require(destination.is_absolute() and not destination.exists() and not destination.is_symlink(), "extraction destination occupied or relative")
              for parent in (destination.parent,*destination.parent.parents):
                  require(parent.is_dir() and not parent.is_symlink(), "extraction ancestor is not a real directory")
              with original_io_deadline(deadline),bounded_zip(archive,expected["members"],deadline) as source:
                  infos,rows=inspect_browser_layout(source,expected,deadline)
                  require(time.monotonic()<deadline, "original archive deadline exhausted")
                  destination.mkdir(mode=0o700)
                  # Links are last, so no archive-controlled link is ever traversed by file writes.
                  for item in infos:
                      require(time.monotonic()<deadline, "original archive deadline exhausted")
                      target=destination/item.filename;mode=item.external_attr>>16
                      if stat.S_ISLNK(mode):continue
                      target.parent.mkdir(mode=0o700,parents=True,exist_ok=True)
                      if stat.S_ISDIR(mode):target.mkdir(mode=0o700,exist_ok=True);continue
                      count=0
                      with source.open(item) as stream, os.fdopen(os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600),"wb") as output:
                          while True:
                              require(time.monotonic()<deadline, "original archive deadline exhausted")
                              block=stream.read(min(1048576,item.file_size-count+1))
                              require(time.monotonic()<deadline, "original archive deadline exhausted")
                              if not block:break
                              count+=len(block);require(count<=item.file_size, "archive member exceeds declared bytes")
                              output.write(block)
