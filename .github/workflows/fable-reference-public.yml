name: Fable reference public qualification

on:
  pull_request:
    paths:
      - .github/workflows/fable-reference-public.yml
      - tests/composition/fable-game/verify-fable-reference-public.sh
      - tests/composition/fable-game/test-fable-reference-public-preflight.py
      - tests/composition/fable-game/managed-group-binding-probe.py
      - tests/composition/fable-game/current-public-descriptor-0.19.0.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Templates-only public proof or full proof including separately qualified Wizard 0.16.0
        required: true
        type: choice
        default: templates
        options: [templates, full]
      template_version: { description: Selected FS.GG.Workspace.Template successor 0.18.1, required: true, type: string }
      archive_sha256: { description: Exact nuget.org FS.GG.Workspace.Template 0.18.1 archive SHA-256, required: true, type: string }
      descriptor_sha256: { description: Exact protected fable-game provider descriptor SHA-256, required: true, type: string }
      source_revision: { description: Exact protected Templates commit carried by the package, required: true, type: string }
      tag_revision: { description: Peeled immutable fs-gg-templates/v0.18.1 revision, required: true, type: string }
      sdd_version: { description: Exact published FS.GG.SDD.Cli version, required: true, type: string }
      sdd_archive_sha256: { description: Exact public FS.GG.SDD.Cli archive SHA-256, required: true, type: string }
      sdd_source_revision: { description: Exact FS.GG.SDD.Cli nuspec source revision, required: true, type: string }
      wizard_version: { description: Exact published FS.GG.NewSddWorkspace version, required: false, type: string }
      wizard_archive_sha256: { description: Exact public wizard archive SHA-256, required: false, type: string }
      wizard_source_revision: { description: Exact wizard nuspec source revision, required: false, type: string }

permissions:
  contents: read

jobs:
  public-reference:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RECEIVER_MODE: ${{ inputs.mode }}
      TEMPLATE_VERSION: ${{ inputs.template_version }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
      DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
      SOURCE_REVISION: ${{ inputs.source_revision }}
      TAG_REVISION: ${{ inputs.tag_revision }}
      SDD_VERSION: ${{ inputs.sdd_version }}
      SDD_ARCHIVE_SHA256: ${{ inputs.sdd_archive_sha256 }}
      SDD_SOURCE_REVISION: ${{ inputs.sdd_source_revision }}
      WIZARD_VERSION: ${{ inputs.wizard_version }}
      WIZARD_ARCHIVE_SHA256: ${{ inputs.wizard_archive_sha256 }}
      WIZARD_SOURCE_REVISION: ${{ inputs.wizard_source_revision }}
    steps:
      - name: Resolve runner qualification paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'EVIDENCE_DIR=%s/fable-reference-public\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'QUINT_BIN=%s/fable-reference-tools/quint\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v6
        with:
          node-version: '26.10.0'
      - name: Preflight closed public inputs
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/composition/fable-game/verify-fable-reference-public.sh
          python3 tests/composition/fable-game/test-fable-reference-public-preflight.py
          args=(--mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" --sdd-version "$SDD_VERSION" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" --evidence-dir "$RUNNER_TEMP/fable-reference-preflight")
          tests/composition/fable-game/verify-fable-reference-public.sh "${args[@]}" --preflight-only
          marker="$RUNNER_TEMP/fable-reference-input-executed"
          malicious="1.0.0'\$(touch $marker)'"
          if tests/composition/fable-game/verify-fable-reference-public.sh \
            --mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" \
            --sdd-version "$malicious" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" \
            --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" \
            --evidence-dir "$RUNNER_TEMP/fable-reference-malicious" --preflight-only 2>/dev/null; then exit 1; fi
          test ! -e "$marker"
      - name: Initialize retained qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$EVIDENCE_DIR"
          printf '{"schema":"fable-reference-public/1","disposition":"started"}\n' >"$EVIDENCE_DIR/qualification.json"
      - name: Pin npm and Quint
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12.1.0
          test "$(npm --version)" = 12.1.0
          mkdir -m 700 "$RUNNER_TEMP/fable-reference-tools"
          curl --fail --location --retry 3 https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 --output "$QUINT_BIN"
          echo "939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  $QUINT_BIN" | sha256sum --check --strict
          chmod 700 "$QUINT_BIN"
          test "$($QUINT_BIN --version)" = 0.32.0
      - name: Qualify exact public archive through direct, provider, and wizard receivers
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_HOST_PATH="$DOTNET_ROOT/dotnet"
          "$DOTNET_HOST_PATH" restore src/FS.GG.Templates.ProviderTool/FS.GG.Templates.ProviderTool.fsproj --locked-mode
          tests/composition/fable-game/verify-fable-reference-public.sh \
            --mode "$RECEIVER_MODE" --template-version "$TEMPLATE_VERSION" --sha256 "$ARCHIVE_SHA256" --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --source-revision "$SOURCE_REVISION" --tag-revision "$TAG_REVISION" \
            --sdd-version "$SDD_VERSION" --sdd-sha256 "$SDD_ARCHIVE_SHA256" --sdd-source-revision "$SDD_SOURCE_REVISION" \
            --wizard-version "$WIZARD_VERSION" --wizard-sha256 "$WIZARD_ARCHIVE_SHA256" --wizard-source-revision "$WIZARD_SOURCE_REVISION" \
            --evidence-dir "$EVIDENCE_DIR"
      - name: Retain bounded public qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fable-reference-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fable-reference-public/qualification.json
            ${{ runner.temp }}/fable-reference-public/readback.sha256
            ${{ runner.temp }}/fable-reference-public/*-build.log
            ${{ runner.temp }}/fable-reference-public/*-browser.log
            ${{ runner.temp }}/fable-reference-public/*-none.json
            ${{ runner.temp }}/fable-reference-public/provider.json
          if-no-files-found: warn
          retention-days: 90


  # Non-required binding probe. It runs the caller's own pin, owner loading, probe and managed
  # executor against the real pinned owner on tiny host commands. It provisions nothing and runs
  # no browser, WASM journey or installed C; those stay held by the literal gates below.
  managed-group-binding:
    name: Managed-group contract binding probe (non-required)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out exact reviewed Templates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Refuse outside a delegated unit with the real pinned owner
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/composition/fable-game/managed-group-binding-probe.py --expect unavailable --root "$RUNNER_TEMP/mg-unavailable"
          FSGG_MANAGED_GROUP_OWNER="$RUNNER_TEMP/mg-unavailable/owner/managed_group_owner.py" \
            python3 tests/composition/fable-game/test-fable-reference-public-preflight.py ManagedGroupBindingTests RealOwnerBindingTests
      - name: Contain bound groups inside a fresh delegated unit
        shell: bash
        run: |
          set -euo pipefail
          sudo -n systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="fsgg-mg-templates-probe-${RUN_ID}-${RUN_ATTEMPT}" \
            -p Delegate=yes -p User="$(id -un)" -p Group="$(id -gn)" -p NoNewPrivileges=yes \
            -p KillMode=control-group -p TimeoutStopSec=5 -p TasksAccounting=yes -p MemoryAccounting=yes \
            -p TasksMax=256 -p MemoryMax=1073741824 -p RuntimeMaxSec=300 -p WorkingDirectory="$PWD" \
            --setenv=PATH=/usr/bin:/bin \
            -- /usr/bin/python3 -I tests/composition/fable-game/managed-group-binding-probe.py \
               --expect contained --root "$RUNNER_TEMP/mg-contained" --tasks-max 256 --memory-max 1073741824

  wasm-installed-c:
    name: WASM caller source preparation (runtime held)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      REPOSITORY: ${{ github.repository }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out exact reviewed Templates source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Qualify actual inline hosted input and budget controls
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/composition/fable-game/verify-fable-reference-public.sh
          python3 tests/composition/fable-game/test-fable-reference-public-preflight.py
      # C-J1 binds fsgg.managed-group-contract/1 in source. Caller execution stays literal
      # false until C-J1 source/profile review and Programme/root admission enable it.
      - name: Prepare closed hosted WASM caller
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          # fsgg.managed-group-contract/1 hosted bootstrap: the job's Python is the only process of a
          # fresh delegated unit. The unit owns hard limits and owner-death cleanup; each tool and
          # Playwright invocation is a managed group under it. A host without systemd/sudo refuses.
          checkout_head="$(git rev-parse HEAD)"
          sudo -n systemd-run --quiet --wait --pipe --collect --service-type=exec \
            --unit="fsgg-mg-templates-${RUN_ID}-${RUN_ATTEMPT}" \
            -p Delegate=yes -p User="$(id -un)" -p Group="$(id -gn)" -p NoNewPrivileges=yes \
            -p KillMode=control-group -p TimeoutStopSec=5 -p TasksAccounting=yes -p MemoryAccounting=yes \
            -p TasksMax=6144 -p MemoryMax=12G -p RuntimeMaxSec=2400 -p WorkingDirectory="$PWD" \
            --setenv=PATH=/usr/bin:/bin --setenv=EVENT="$EVENT" --setenv=REPOSITORY="$REPOSITORY" \
            --setenv=HEAD_REPOSITORY="$HEAD_REPOSITORY" --setenv=PR_HEAD="$PR_HEAD" \
            --setenv=WORKFLOW_REF="$WORKFLOW_REF" --setenv=WORKFLOW_SHA="$WORKFLOW_SHA" \
            --setenv=RUN_ID="$RUN_ID" --setenv=RUN_ATTEMPT="$RUN_ATTEMPT" --setenv=CHECKOUT_HEAD="$checkout_head" \
            --setenv=GITHUB_WORKSPACE="$GITHUB_WORKSPACE" --setenv=RUNNER_TEMP="$RUNNER_TEMP" \
            --setenv=ImageOS="${ImageOS:-}" --setenv=ImageVersion="${ImageVersion:-}" \
            --setenv=RUNNER_OS="$RUNNER_OS" --setenv=RUNNER_ARCH="$RUNNER_ARCH" \
            -- /usr/bin/python3 -I - <<'HOSTED_WASM'
          import contextlib, gzip, signal, struct, threading, base64, hashlib, importlib.util, json, os, pathlib, platform, re, shutil, stat, subprocess, sys, tarfile, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET, zipfile
          if sys.flags.optimize != 0:
              raise RuntimeError("hosted admission requires optimization=0")
          # Published Workspace.Template 0.19.1 (peeled fs-gg-templates/v0.19.1, signed nuget.org archive):
          # 0.19.0 Complete scaffolds truncate the WASM guest policy.c, so it cannot close the receiver.
          TEMPLATE_VERSION = "0.19.1"
          PUBLISHED = "1e95dddb6326d276773154df1336599907d8dbfe"
          PACKAGE_SHA = "5d1886c37b6e6a0d64c3998ee23e76b4c5ba8b8a0c2136200c377d7bbab7d0c6"
          DESCRIPTOR_SHA = "10b532dacb0fba79c1c9dc666487f78903e1fd1a09fc757932f605a3f055f5f7"
          FABLE_SHA = "b586190f1592c3352d7319008a99e1747267dacbc44d6e5bd3753c84390f47a4"
          TOOLS = {"sdk":"10.0.401", "runtime":"10.0.12", "node":"24.20.0", "npm":"11.19.0", "fable":"5.18.0", "rust":"1.90.0", "wasi":"34.0", "playwright":"1.63.0"}
          BUDGET = {"job":2400, "setup":840, "custody":300, "installed":900, "cleanup":30, "collection":180, "overhead":90}
          if BUDGET["setup"] + BUDGET["custody"] + BUDGET["installed"] + 3 * BUDGET["cleanup"] + BUDGET["collection"] + BUDGET["overhead"] != BUDGET["job"]:
              raise RuntimeError("phase budgets must fit the original job")
          ENDPOINTS = {
              "template":(f"https://api.nuget.org/v3-flatcontainer/fs.gg.workspace.template/{TEMPLATE_VERSION}/fs.gg.workspace.template.{TEMPLATE_VERSION}.nupkg", PACKAGE_SHA, 8388608),
              "descriptor":(f"https://raw.githubusercontent.com/FS-GG/FS.GG.Templates/{PUBLISHED}/providers/fable-game.providers.yml", DESCRIPTOR_SHA, 1048576),
              "guest":("https://github.com/FS-GG/FS.GG.Game/releases/download/wasm/v0.3.0/fsgg-wasm-sdk-0.3.0.tar.gz", "8091df6824981c0c37131524ffbcbae9bb8b36f672a20edc2efaddd35664f8c8", 2097152),
              "wasi":("https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz", "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4", 268435456)}
          # Observed public TLS/raw archive identity only; no publisher signature or build correspondence.
          BROWSER_ARCHIVES = {'chromium-full1243': {'url': 'https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-linux64.zip',
                                 'sha256': '8aac35011c18f6e2d10696154af89a5728ac2ddd6dc6fad24ffdf243c3fcfd5a',
                                 'bytes': 195836009,
                                 'selector': 'chromium-1243'},
           'chromium-headless1243': {'url': 'https://storage.googleapis.com/chrome-for-testing-public/153.0.8010.12/linux64/chrome-headless-shell-linux64.zip',
                                     'sha256': 'a9da028861a0cf789ff25c2fed45f5f1aaf969ed9247835b6a7821a4f7af9d1d',
                                     'bytes': 119809080,
                                     'selector': 'chromium_headless_shell-1243'},
           'firefox1543': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/firefox/1543/firefox-ubuntu-24.04.zip',
                           'sha256': 'b0905e84427cc162b9a6e4392be14e5e54e0ade911c83639962c8078b273565e',
                           'bytes': 114822786,
                           'selector': 'firefox-1543'},
           'webkit2359': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/webkit/2359/webkit-ubuntu-24.04.zip',
                          'sha256': '8c129d989a1c48d826ca11b45acbba919039de811623dc3819ccbd95b69eeb62',
                          'bytes': 107218719,
                          'selector': 'webkit-2359'},
           'ffmpeg1011': {'url': 'https://playwright.download.prss.microsoft.com/dbazure/download/playwright/builds/ffmpeg/1011/ffmpeg-linux.zip',
                          'sha256': 'ebc74fc5b94830176a3c2914ae96bd8bc7f6a91f4f33890230f84a172ee61ccc',
                          'bytes': 2376500,
                          'selector': 'ffmpeg-1011'}}
          HTTPS_HOSTS = {"api.nuget.org", "raw.githubusercontent.com", "github.com", "release-assets.githubusercontent.com", "builds.dotnet.microsoft.com", "dotnetcli.blob.core.windows.net", "ci.dot.net", "nodejs.org", "registry.npmjs.org", "static.rust-lang.org", "storage.googleapis.com", "playwright.download.prss.microsoft.com"}
          # C-J1 supplier: fsgg.managed-group-contract/1, merged by FS.GG.Coordination#1047 for #1046.
          # The single stdlib file is the complete closure; the (commit, path, sha256) pin is its identity.
          OWNER = {"repository":"FS-GG/FS.GG.Coordination", "commit":"ac22206560f3eddfea524ce8f752ff1d0dfeec4e",
              "path":"eng/managed_group_owner.py", "sha256":"d846dbe158befb5b824bd94a5bc0bb89b1145f825d5d6fa3a3225fa0451a36c0",
              "bytes":45315, "contract":"fsgg.managed-group-contract/1"}
          OWNER_URL = "https://raw.githubusercontent.com/"+OWNER["repository"]+"/"+OWNER["commit"]+"/"+OWNER["path"]
          # Leaf limits are cooperative (members share the owner's uid); hard limits are the unit's.
          MANAGED = {"pidsMax":4096, "stdoutBytes":16777216, "stderrBytes":16777216, "settleSeconds":2, "termGraceSeconds":5}
          # How each executable identity was obtained. Only the first three carry acquisition provenance.
          IDENTITY_BASES = ("verified-download", "verified-archive-member", "installer-copy-of-verified-download",
              "caller-authored", "installer-output-observed", "host-observed")
          # C-J1 literal runtime hold. The supplier contract is bound below, but provisioning, the
          # three-family custody pilot and installed C stay refused until C-J1 source/profile
          # review and Programme/root admission lift this, the step condition and the upload gate.
          RUNTIME_ADMITTED = False

          def require(value, message):
              if not value: raise ValueError(message)

          def sha(path):
              digest = hashlib.sha256()
              with pathlib.Path(path).open("rb") as source:
                  for block in iter(lambda: source.read(1048576), b""): digest.update(block)
              return digest.hexdigest()

          def validate_source(env, head, root):
              require(env["EVENT"] == "pull_request" and env["REPOSITORY"] == "FS-GG/FS.GG.Templates" and env["HEAD_REPOSITORY"] == env["REPOSITORY"], "ordinary same-repository PR required")
              require(re.fullmatch(r"[0-9a-f]{40}", env["PR_HEAD"]) and head == env["PR_HEAD"], "exact reviewed checkout required")
              require(env["WORKFLOW_REF"].startswith("FS-GG/FS.GG.Templates/.github/workflows/fable-reference-public.yml@"), "workflow identity differs")
              require(re.fullmatch(r"[0-9a-f]{40}", env["WORKFLOW_SHA"]), "workflow evaluation source missing")
              require(pathlib.Path(root).is_absolute() and not pathlib.Path(root).is_symlink(), "private root must be an absolute nonlink")
              return {**{k:env[k] for k in ("EVENT","REPOSITORY","PR_HEAD","WORKFLOW_REF","WORKFLOW_SHA","RUN_ID","RUN_ATTEMPT")}, "imageOS":env.get("ImageOS"), "imageVersion":env.get("ImageVersion"), "runnerOS":env.get("RUNNER_OS"), "runnerArch":env.get("RUNNER_ARCH")}

          def phase_deadline(start, phase, now):
              require(phase in ("setup", "custody", "installed"), "closed phase required")
              reserved = BUDGET["cleanup"] + BUDGET["collection"] + BUDGET["overhead"]
              later = {"setup":BUDGET["custody"] + BUDGET["installed"] + 2*BUDGET["cleanup"], "custody":BUDGET["installed"] + BUDGET["cleanup"], "installed":0}[phase]
              deadline = min(now + BUDGET[phase], start + BUDGET["job"] - reserved - later)
              require(deadline > now, "original job budget cannot supply this phase")
              return deadline

          def public_url(url):
              require(isinstance(url,str) and len(url) <= 16384 and not any(ord(c)<32 or ord(c)==127 for c in url),"URL control or length refused")
              decoded=urllib.parse.unquote(url)
              require(not any(ord(c)<32 or ord(c)==127 for c in decoded) and "\\" not in url,"encoded URL control/backslash refused")
              parsed=urllib.parse.urlsplit(url)
              require(parsed.scheme=="https" and parsed.hostname in HTTPS_HOSTS and parsed.username is None and parsed.password is None and parsed.port in (None,443) and not parsed.fragment,"public HTTPS origin/port/userinfo differs")
              require(parsed.netloc.lower() in (parsed.hostname,parsed.hostname+":443"),"noncanonical authority refused")
              return url

          class ClosedRedirect(urllib.request.HTTPRedirectHandler):
              # A fresh handler per acquisition bounds the complete redirect chain.
              def __init__(self): self.hops=0
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  public_url(req.full_url)
                  public_url(newurl) # validate BEFORE constructing or opening the next request
                  require(not any(key.lower() in ("authorization","proxy-authorization","cookie") for key in list(req.headers)+list(req.unredirected_hdrs)),"auth-free acquisition required")
                  self.hops+=1;require(self.hops<=5,"redirect hop cap exceeded")
                  return super().redirect_request(req,fp,code,msg,headers,newurl)

          def open_public(url,timeout):
              public_url(url) # urllib must never open an unchecked initial origin
              # No credential-bearing environment proxy, cookie jar or auth handlers.
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),ClosedRedirect())
              return opener.open(urllib.request.Request(url,headers={"User-Agent":"fsgg-fixed-public-acquisition/1"}),timeout=timeout)

          @contextlib.contextmanager
          def original_io_deadline(deadline):
              # In-process Linux transport bound; qualified hosted behavior still requires an actual pilot.
              require(threading.current_thread() is threading.main_thread(), "deadline watchdog requires main thread")
              remaining=deadline-time.monotonic();require(remaining>0, "original acquisition deadline exhausted")
              require(signal.getitimer(signal.ITIMER_REAL)==(0.0,0.0), "foreign deadline timer occupied")
              previous=signal.getsignal(signal.SIGALRM)
              def expired(signum, frame):raise TimeoutError("original acquisition wall deadline exhausted")
              signal.signal(signal.SIGALRM,expired)
              try:
                  signal.setitimer(signal.ITIMER_REAL,remaining)
                  yield
                  require(time.monotonic()<deadline, "original acquisition deadline exhausted")
              finally:
                  signal.setitimer(signal.ITIMER_REAL,0)
                  signal.signal(signal.SIGALRM,previous)

          def download(url, destination, maximum, deadline, expected=None, algorithm="sha256", transport=open_public):
              public_url(url)
              require(not destination.exists() and not destination.is_symlink(), "download destination occupied")
              require(0 < maximum <= 536870912 and deadline > time.monotonic(), "download bound invalid or expired")
              digest=hashlib.new(algorithm); count=0
              # One timer covers open, all validated redirects, body reads and terminal close; no per-hop renewal.
              with original_io_deadline(deadline):
                  with transport(url, timeout=min(30, deadline-time.monotonic())) as response, destination.open("xb") as output:
                      final=urllib.parse.urlsplit(public_url(response.geturl()))
                      while True:
                          require(time.monotonic()<deadline, "original acquisition deadline exhausted")
                          block=response.read(min(1048576,maximum-count+1))
                          require(time.monotonic()<deadline, "original acquisition deadline exhausted")
                          if not block:break
                          count+=len(block);require(count<=maximum, "download byte cap exceeded")
                          output.write(block);digest.update(block)
