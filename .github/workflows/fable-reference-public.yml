          def inspect_browser_layout(source, expected, deadline):
              require(time.monotonic()<deadline, "original archive deadline exhausted")
              infos=source.infolist()
              require(len(infos)==expected["members"] and len(infos)<=64000, "archive cardinality differs")
              rows=[]; names={}; links={}; logical=0
              for item in infos:
                  require(time.monotonic()<deadline, "original archive deadline exhausted")
                  name=item.filename; mode=item.external_attr>>16; kind=stat.S_IFMT(mode)
                  require(name and not any(ord(c)<32 or ord(c)==127 for c in name) and "\\" not in name, "unsafe archive name")
                  path=pathlib.PurePosixPath(name)
                  require(not path.is_absolute() and all(x not in ("", ".", "..") for x in name.rstrip("/").split("/")) and str(path)==name.rstrip("/"), "archive traversal or noncanonical path")
                  key=str(path);require(key not in names, "duplicate archive member")
                  require(kind in (stat.S_IFREG,stat.S_IFDIR,stat.S_IFLNK) and not mode & 0o7000 and not item.flag_bits & 1, "unsupported archive type/mode/encryption")
                  require(item.is_dir()==(kind==stat.S_IFDIR), "directory mode/name differs")
