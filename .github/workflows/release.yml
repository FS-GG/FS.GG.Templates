name: release

# Tag-driven publish for the FS.GG.Templates NuGet template package. This is the producer
# side of the org "publish-before-flip" release dance (FS-GG/.github coordination protocol,
# FR-007): the package goes LIVE on the org feed here, and only then does a downstream
# registry/pin flip say so. Mirrors Rendering's fs-gg-ui-template/v<ver> flow — Templates
# publishes behind fs-gg-templates/v<ver>.
#
# Cut a release by pushing an annotated tag whose version matches <Version> in
# FS.GG.Templates.csproj, e.g.:
#   git tag fs-gg-templates/v0.2.0 && git push origin fs-gg-templates/v0.2.0
#
# The release pipeline restores locked inputs, packs exactly once, checksums that archive, and
# uploads it as an immutable workflow artifact. The `gate` job runs the full composition suite
# against those exact downloaded bytes; `publish` independently downloads and verifies the same
# artifact before sending it to both feeds and the GitHub Release.

on:
  push:
    tags:
      - 'fs-gg-templates/v*'
  # A failed tag run must be replayable from the CURRENT workflow without moving the
  # immutable tag. The dispatcher supplies that existing tag; pack and gate still check
  # out the tag's source, while this workflow definition comes from main.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing fs-gg-templates/v* tag to replay
        required: true
        type: string
      source_run_id:
        description: Failed release run whose checksum-bound artifact must be resumed
        required: true
        type: string
  # release.yml is otherwise tag-only, so a broken prerequisite could not be exercised
  # before the tag became immutable. This path-scoped run packs the PR artifact and executes
  # the exact gate bootstrap, while publication remains disabled below.
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source-ref: ${{ steps.route.outputs.source-ref }}
      release-tag: ${{ steps.route.outputs.release-tag }}
      publish: ${{ steps.route.outputs.publish }}
      source-head: ${{ steps.route.outputs.source-head }}
      artifact-name: ${{ steps.route.outputs.artifact-name }}
    steps:
      - name: Resolve and assert release route
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            push)
              release_tag="${PUSH_REF#refs/tags/}"
              source_ref="$PUSH_REF"
              publish=true
              ;;
            workflow_dispatch)
              if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::release replay requires the numeric failed source run id; got '${SOURCE_RUN_ID:-<nothing>}'"
                exit 1
              fi
              release_tag="$REQUESTED_TAG"
              source_ref="refs/tags/$REQUESTED_TAG"
              publish=true
              ;;
            pull_request)
              release_tag=''
              source_ref="$PR_HEAD_SHA"
              publish=false
              ;;
            *)
              echo "::error::unsupported release route event '$EVENT_NAME'"
              exit 1
              ;;
          esac

          if [ "$publish" = true ]; then
            if [[ ! "$release_tag" =~ ^fs-gg-templates/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release route requires an existing fs-gg-templates/v<semver> tag; got '${release_tag:-<nothing>}'"
              exit 1
            fi
          elif [ -z "$source_ref" ]; then
            echo "::error::pull-request release-route validation has no head SHA"
            exit 1
          fi

          source_head=''
          artifact_name=''
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
            source_head="$(jq -r '.head_sha // empty' <<<"$run_json")"
            run_event="$(jq -r '.event // empty' <<<"$run_json")"
            run_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
            run_status="$(jq -r '.status // empty' <<<"$run_json")"
            run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
            run_path="$(jq -r '.path // empty' <<<"$run_json")"
            run_repository_id="$(jq -r '.repository.id // empty' <<<"$run_json")"
            if [ "$run_event" != push ] || [ "$run_branch" != "$release_tag" ] || \
               [ "$run_status" != completed ] || [ "$run_conclusion" != failure ] || \
               [ "$run_path" != '.github/workflows/release.yml' ] || \
               [ "$run_repository_id" != "$REPOSITORY_ID" ] || \
               [[ ! "$source_head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::source run $SOURCE_RUN_ID is not a completed failed tag run of this repository's release workflow (repo=$run_repository_id expected-repo=$REPOSITORY_ID event=$run_event branch=$run_branch status=$run_status conclusion=$run_conclusion path=$run_path head=${source_head:-<nothing>})."
              exit 1
            fi

            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
            pack_success="$(jq '[.jobs[] | select(.name == "pack" and .status == "completed" and .conclusion == "success")] | length' <<<"$jobs_json")"
            gate_failure="$(jq '[.jobs[] | select(.name == "gate" and .status == "completed" and .conclusion == "failure")] | length' <<<"$jobs_json")"
            publish_skipped="$(jq '[.jobs[] | select(.name == "publish" and .status == "completed" and .conclusion == "skipped")] | length' <<<"$jobs_json")"
            if [ "$pack_success" != 1 ] || [ "$gate_failure" != 1 ] || [ "$publish_skipped" != 1 ]; then
              echo "::error::source run $SOURCE_RUN_ID is not the resumable release state: expected exactly one successful pack, failed gate, and skipped publish; got pack=$pack_success gate=$gate_failure publish=$publish_skipped."
              exit 1
            fi

            artifact_name="fs-gg-templates-$source_head"
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
            artifact_count="$(jq --arg name "$artifact_name" --arg run "$SOURCE_RUN_ID" --arg head "$source_head" --arg branch "$release_tag" --arg repo "$REPOSITORY_ID" \
              '[.artifacts[] | select(.name == $name and .expired == false and ((.digest // "") | test("^sha256:[0-9a-f]{64}$")) and (.workflow_run.id | tostring) == $run and (.workflow_run.repository_id | tostring) == $repo and .workflow_run.head_sha == $head and .workflow_run.head_branch == $branch)] | length' <<<"$artifacts_json")"
            total_artifacts="$(jq -r '.total_count' <<<"$artifacts_json")"
            if [ "$artifact_count" != 1 ] || [ "$total_artifacts" != 1 ]; then
              echo "::error::source run $SOURCE_RUN_ID must expose exactly one unexpired server-digested artifact named '$artifact_name' bound to run/head/tag; matched=$artifact_count total=$total_artifacts."
              exit 1
            fi
          fi

          {
            echo "source-ref=$source_ref"
            echo "release-tag=$release_tag"
            echo "publish=$publish"
            echo "source-head=$source_head"
            echo "artifact-name=$artifact_name"
          } >> "$GITHUB_OUTPUT"
          echo "release route: event=$EVENT_NAME source=$source_ref publish=$publish"

  pack:
    needs: route
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      package-id: ${{ steps.version.outputs.package-id }}
      package-file: ${{ steps.version.outputs.package-file }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.source-ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The cheapest, most load-bearing gate: the tag's version must equal <Version> in the
      # csproj we are about to pack. Without this the feed could advertise a version the
      # package does not carry (or a hand-edited <Version> could drift from the tag). Fail
      # here before doing any of the expensive work below.
      #
      # <PackageId> IS READ HERE FOR THE SAME REASON THE VERSION IS, AND IT IS NOT COSMETIC
      # (FS.GG.Templates#349). `dotnet pack` names its archive `<PackageId>.<Version>.nupkg`,
      # and this workflow used to hard-code the *project file's* stem — `FS.GG.Templates.*` —
      # as if it were the package id. Those two were equal until 44c558c renamed
      # <PackageId> to FS.GG.Workspace.Template for the four-identity set, and nothing
      # observed the split: the very next `sha256sum FS.GG.Templates.*.nupkg` matched no file
      # and exited 1, so no `fs-gg-templates/v*` tag could produce a release at all. Deriving
      # the archive name from the id the pack actually uses retires the whole class rather
      # than the one instance, and the post-pack assertion below proves the derivation held.
      - name: Assert tag ⇔ csproj version coherence
        id: version
        env:
          RELEASE_TAG: ${{ needs.route.outputs.release-tag }}
          PUBLISH: ${{ needs.route.outputs.publish }}
        run: |
          set -euo pipefail
          CSPROJ_VERSION="$(grep -oE '<Version>[0-9][^<]*</Version>' FS.GG.Templates.csproj | head -1 | sed -E 's#</?Version>##g')"
          CSPROJ_ID="$(grep -oE '<PackageId>[^<]+</PackageId>' FS.GG.Templates.csproj | head -1 | sed -E 's#</?PackageId>##g')"
          echo "csproj version: $CSPROJ_VERSION"
          echo "csproj id:      $CSPROJ_ID"
          if [ -z "$CSPROJ_VERSION" ]; then
            echo "::error::could not read <Version> from FS.GG.Templates.csproj"; exit 1
          fi
          if [ -z "$CSPROJ_ID" ]; then
            echo "::error::could not read <PackageId> from FS.GG.Templates.csproj. The published package id is not the project-file stem and must never be assumed to be — see FS.GG.Templates#349."
            exit 1
          fi
          if [ "$PUBLISH" = true ]; then
            TAG_VERSION="${RELEASE_TAG#fs-gg-templates/v}"
            echo "tag version:    $TAG_VERSION"
            if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
              echo "::error::release tag ($TAG_VERSION) != <Version> in FS.GG.Templates.csproj ($CSPROJ_VERSION). Bump the csproj to match the tag before tagging (publish-before-flip)."
              exit 1
            fi
          fi
          {
            echo "package-version=$CSPROJ_VERSION"
            echo "package-id=$CSPROJ_ID"
            echo "package-file=$CSPROJ_ID.$CSPROJ_VERSION.nupkg"
          } >> "$GITHUB_OUTPUT"

      - name: Restore (locked)
        if: github.event_name != 'workflow_dispatch'
        run: dotnet restore FS.GG.Templates.csproj --locked-mode

      - name: Pack once and checksum
        if: github.event_name != 'workflow_dispatch'
        env:
          PACKAGE_FILE: ${{ steps.version.outputs.package-file }}
        run: |
          dotnet pack FS.GG.Templates.csproj \
            -c Release \
            --no-restore \
            -p:ContinuousIntegrationBuild=true \
            -o artifacts
          (
            cd artifacts
            sha256sum "$PACKAGE_FILE" > SHA256SUMS
          )

      # Resume the bytes produced by the failed run; do not re-pack and silently replace the
      # artifact whose successful pack/checksum is the evidence being recovered.
      - name: Download failed run's immutable release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.route.outputs.artifact-name }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Assert the one checksum-bound release archive
        env:
          PACKAGE_FILE: ${{ steps.version.outputs.package-file }}
          SOURCE_HEAD: ${{ needs.route.outputs.source-head }}
        run: |
          cd artifacts
          # The derivation above is an ASSERTION, not a guess: `dotnet pack` is the authority on
          # what it produced, so compare its output set against the single file this release is
          # about to checksum, gate, publish and tag. A pack that emitted a differently-named or
          # additional archive reds HERE, naming both sides, instead of surfacing as a feed that
          # advertises something no one verified.
          produced="$(find . -maxdepth 1 -name '*.nupkg' -printf '%f\n' | sort)"
          if [ "$produced" != "$PACKAGE_FILE" ]; then
            echo "::error::release route contains [$(echo "$produced" | tr '\n' ' ')] but expects exactly '$PACKAGE_FILE' (<PackageId>.<Version> from FS.GG.Templates.csproj). Reconcile the source run or csproj before publishing."
            exit 1
          fi
          sha256sum --check SHA256SUMS
          source_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          package_commit="$(unzip -p "$PACKAGE_FILE" '*.nuspec' |
            grep -oE 'repository [^>]*commit="[0-9a-f]{40}"' |
            sed -E 's/.*commit="([0-9a-f]{40})"/\1/' | head -1)"
          if [ -z "$package_commit" ] || [ "$package_commit" != "$source_commit" ]; then
            echo "::error::release archive repository commit '${package_commit:-<nothing>}' != checked-out release source '$source_commit'. The replay run and immutable tag must identify the same source."
            exit 1
          fi
          if [ -n "$SOURCE_HEAD" ] && [ "$source_commit" != "$SOURCE_HEAD" ]; then
            echo "::error::checked-out immutable tag commit '$source_commit' != GitHub-authenticated source run head '$SOURCE_HEAD'."
            exit 1
          fi
          echo "release artifact: $(cat SHA256SUMS)"

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v7
        with:
          name: fs-gg-templates-${{ github.run_id }}
          path: |
            artifacts/${{ steps.version.outputs.package-file }}
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  gate:
    name: release-route
    needs: [route, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # pull the published FS-GG CLIs from the org feed (as composition.yml)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.source-ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download immutable release artifact
        uses: actions/download-artifact@v8
        with:
          name: fs-gg-templates-${{ github.run_id }}
          path: artifacts

      - name: Verify release artifact checksum
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS

      # The release gate must grade the same provider-owned floor as composition.yml. In
      # particular, "latest stable" is not sufficient when a provider deliberately declares a
      # prerelease floor: the latest stable may be older and unable to render that provider.
      - name: Grade provider minimumFsggSdd floors against the org registry
        id: floors
        run: |
          set -euo pipefail
          scripts/check-provider-floors.py \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      # Same authenticated CLI setup as composition.yml so the gated stages ASSERT instead of
      # skipping (never green-by-omission). See composition.yml for why a classic PAT is the
      # only credential that reads the private FS.GG.UI.* closure the scaffold restores.
      - name: Install FS-GG CLIs (governance enforcement + sdd producer/scaffold)
        env:
          FEED_TOKEN: ${{ secrets.FSGG_PACKAGES_PAT }}
          MIN_SDD: ${{ steps.floors.outputs.floor }}
        run: |
          case "$MIN_SDD" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error title=the agreed minimumFsggSdd floor did not arrive::steps.floors.outputs.floor is '${MIN_SDD:-<nothing>}'. The release gate cannot select a compatible fsgg-sdd without the provider/registry floor."
              exit 1
              ;;
          esac

          dotnet nuget add source \
            --username fs-gg --password "$FEED_TOKEN" --store-password-in-clear-text \
            --name fs-gg-github "https://nuget.pkg.github.com/FS-GG/index.json" || true

          export PATH="$HOME/.dotnet/tools:$PATH"
          install_global_tool() {
            package="$1"
            command_name="$2"
            requested_version="${3:-latest stable}"
            installed_version="$(dotnet tool list --global |
              awk -v package="$package" 'tolower($1) == tolower(package) { print $2; exit }')"
            install_args=(--global "$package")
            if [ "$requested_version" != 'latest stable' ]; then
              install_args+=(--version "$requested_version")
            fi

            if [ -n "$installed_version" ]; then
              echo "$package $installed_version is already installed; requested $requested_version."
            elif dotnet tool install "${install_args[@]}"; then
              installed_version="$(dotnet tool list --global |
                awk -v package="$package" 'tolower($1) == tolower(package) { print $2; exit }')"
              echo "Installed $package ${installed_version:-unknown}; requested $requested_version."
            else
              install_status="$?"
              echo "::error title=$package installation failed::Requested version: $requested_version; dotnet tool install exited $install_status. Full diagnostics are above; the global tool inventory follows."
              dotnet tool list --global || true
              exit "$install_status"
            fi

            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "::error title=$package unavailable::$package is listed as ${installed_version:-unknown}, but '$command_name' is not available on PATH."
              exit 1
            fi
            if [ "$requested_version" != 'latest stable' ] && [ "$installed_version" != "$requested_version" ]; then
              echo "::error title=$package version mismatch::$package resolved to ${installed_version:-unknown}, expected pinned release-gate version $requested_version."
              exit 1
            fi
          }

          install_global_tool FS.GG.Governance.Cli fsgg-governance
          install_global_tool FS.GG.Governance.FSharpSurfaceCommand fsgg-fsharp-surface 1.12.1
          # Pin the release gate to the declared floor. Unlike the early-regression composition
          # gate, a release must be reproducible and must not select an older stable CLI when the
          # provider's compatible floor is a prerelease.
          install_global_tool FS.GG.SDD.Cli fsgg-sdd "$MIN_SDD"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # The generated-product gate: install the downloaded archive → instantiate →
      # scaffold/build → verify pins/links + governance enforcement.
      #
      # COMPOSITION_LANES NAMES ALL FOUR WORKSPACE IDENTITIES, and the release gate is the
      # place that owes that (FS.GG.Templates#349 acceptance: "All four identities install and
      # instantiate through the packed artifact outside the producer checkout"). `run.sh`
      # defaults to the two lanes the required `composition` check can afford inside its
      # `timeout-minutes: 30`; whether that default should grow is measured work owned by
      # FS.GG.Templates#379 and is deliberately NOT decided here. This job has no such budget
      # (no timeout-minutes → the 360-minute default), so it names the complete set. A lane
      # named here that cannot run FAILS — `run.sh` has no skip arm for a named lane.
      #
      # Every lane installs FSGG_TEMPLATES_NUPKG — the downloaded, checksum-verified archive —
      # rather than packing a second one from the checkout. Before #349 the per-template lanes
      # each ran their own `dotnet pack`, so this job's header claim of running "against those
      # exact downloaded bytes" was true only of stages 01–06 and false of every identity lane.
      - name: Composition test the release artifact
        if: needs.route.outputs.publish == 'true'
        env:
          FSGG_TEMPLATES_NUPKG: ${{ github.workspace }}/artifacts/${{ needs.pack.outputs.package-file }}
          COMPOSITION_LANES: console web fable-bindings fable-game
        run: tests/composition/run.sh

  publish:
    needs: [route, gate]
    if: needs.route.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      packages: write   # push the package to the org feed
      id-token: write   # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download verified release artifact
        uses: actions/download-artifact@v8
        with:
          name: fs-gg-templates-${{ github.run_id }}
          path: artifacts

      - name: Verify release artifact checksum
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS

      # Publish to the org GitHub Packages NuGet feed. Publishing THIS repo's own package
      # works with the run-scoped GITHUB_TOKEN (packages: write above) — unlike READING the
      # private FS.GG.UI.* closure, which needs the classic PAT (see composition.yml).
      # --skip-duplicate makes a re-run idempotent (a re-pushed tag never fails on 409).
      - name: Push to GitHub Packages (org feed)
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/FS-GG/index.json" \
            --skip-duplicate

      # ADR-0012 dual-publish to public nuget.org (ADR-0013 auth = Trusted Publishing OIDC, no
      # stored key). Pushes the BYTE-IDENTICAL org-feed .nupkg from artifacts/ (no re-pack), so
      # nuget.org and the org feed serve the same bytes for a given version. Gated on the repo
      # variable NUGET_ORG_PUBLISH so it stays DORMANT — org-feed releases keep working — until
      # an org-owner creates the nuget.org Trusted Publishing policy (Owner FS-GG, Repository
      # FS.GG.Templates, Workflow release.yml, under the reserved FS.GG. prefix) and sets
      # vars.NUGET_ORG_PUBLISH=true (see FS-GG/FS.GG.Templates#83, mirrors FS-GG/.github#157).
      # Without the policy, NuGet/login fail-closes (401), so the gate avoids breaking every
      # release in the interim. Login+push live inline here (a cross-repo reusable workflow
      # trips the OIDC policy match — NuGet/login#6).
      - name: NuGet login (OIDC → short-lived key)
        if: vars.NUGET_ORG_PUBLISH == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push byte-identical package to nuget.org
        if: vars.NUGET_ORG_PUBLISH == 'true'
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      # Confirm the push landed before cutting the Release, so a GitHub Release never
      # advertises a version the feed cannot serve (publish-before-flip, at this repo's seam).
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This publish job intentionally has no checkout, so gh cannot infer the repository
          # from a local .git directory.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.route.outputs.release-tag }}
        run: |
          # Idempotent like the --skip-duplicate push above: a re-pushed tag (or a re-run
          # after a transient failure between push and release) must not red-fail because the
          # Release already exists. Create it the first time; on a re-run re-attach the
          # artifact with --clobber instead. First publish is unchanged.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/*.nupkg \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
