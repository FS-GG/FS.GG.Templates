name: svg-scale-candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'templates/fs-gg-fable-game/**'
      - 'tests/composition/fable-game/svg-scale-observe.mjs'
      - 'tests/composition/fable-game/verify-svg-scale-candidate.sh'
      - '.github/workflows/svg-scale-candidate.yml'

permissions:
  contents: read

concurrency:
  group: svg-scale-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Generated SVG accessibility and scale matrix
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Rendering
          ref: 1f4d822034284312dd6230a7af0e3afc089afdce
          path: rendering
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Qualify exact generated Player and Studio candidates
        working-directory: templates
        run: bash tests/composition/fable-game/verify-svg-scale-candidate.sh "$GITHUB_WORKSPACE/rendering" "$RUNNER_TEMP/svg-scale-candidate"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-scale-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/svg-scale-candidate/*.json
            ${{ runner.temp }}/svg-scale-candidate/*.log
          if-no-files-found: warn
          retention-days: 30
