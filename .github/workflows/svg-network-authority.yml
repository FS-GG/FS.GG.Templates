name: svg-network-authority

on:
  pull_request:
    branches: [main]
    paths: ['templates/fs-gg-fable-game/**', 'scripts/stage-svg-network-candidate.sh', 'tests/composition/fable-game/verify-svg-network-authority.sh', '.github/workflows/svg-network-authority.yml']

permissions:
  contents: read

jobs:
  qualify:
    name: Exact generated authoritative game
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Game
          ref: f024993774cd046edf5f3cb0ba047f2c79a882e2
          path: game
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Net
          ref: 49a90425d705cc11ec0a31549fabeb4a36ec0c85
          path: net
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - name: Qualify exact generated server
        working-directory: templates
        run: bash tests/composition/fable-game/verify-svg-network-authority.sh "$GITHUB_WORKSPACE/game" "$GITHUB_WORKSPACE/net" "$RUNNER_TEMP/svg-network-authority"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-network-authority-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/svg-network-authority/candidate-packet.json
            ${{ runner.temp }}/svg-network-authority/qualification.json
            ${{ runner.temp }}/svg-network-authority/results/**
          if-no-files-found: warn
          retention-days: 30
