name: composition

on:
  push:
    branches: [main]
    # README.md is a genuine coherence surface (the test greps it) and lives at the repo root, so
    # it stays in scope; only docs/** (incl. docs/TestSpecs/**, docs/reports/**) is exempt — a
    # docs-only edit must not pay for a full pack→scaffold→build→govern run. Everything else that
    # can affect the composed product still triggers the gate.
    #
    # THE SAME docs/** RULE IS ALSO ENCODED IN THE `scope` STEP BELOW, which is what applies it to
    # pull requests. Two syntaxes, one rule: widen the exemption here and you MUST widen it there,
    # or a PR and its own post-merge push will disagree about whether to run the gate.
    paths-ignore: ['docs/**']
  # NO paths-ignore on pull_request, deliberately. `composition` is a REQUIRED check on main, and a
  # workflow skipped by a path filter never reports at all — its check sits "Expected" forever and
  # the PR can never merge (not even for an admin: enforce_admins is on). The docs-only exemption is
  # therefore applied INSIDE the job (see the `scope` step) rather than at the trigger: the job always
  # runs and always reports, but a docs-only PR skips the expensive stages and passes for free.
  pull_request:

# One in-flight run per ref: a force-pushed PR (or rapid re-push) cancels its own stale run rather
# than stacking redundant full-composition runs that each pack, scaffold, and build the live app.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composition:
    runs-on: ubuntu-latest
    # A hung feed/scaffold/build must not hold a runner for the 6-hour default; a healthy full run
    # is well under this.
    #
    # ── THE LANE-SET BUDGET, MEASURED RATHER THAN ASSUMED (FS.GG.Templates#379) ──────────────
    #
    # This job runs every lane `tests/composition/` contains. It does NOT pin a COMPOSITION_LANES
    # list: run.sh's default is lane DISCOVERY minus the explicit deferral registry in
    # tests/composition/lib/lane-coverage.sh, so a lane added tomorrow lands on this required check
    # by construction rather than by somebody remembering to edit a list here. Two lanes were added
    # without that edit and ran on nothing for days, which is the whole of #379.
    #
    # #379 EXPECTED THIS TO BE UNAFFORDABLE, AND IT IS NOT. Its premise was that "the fable-game
    # lane adds a full game build plus Playwright", so "wiring both in unconditionally may not fit
    # that budget", and it asked for a split job or a matrix if it did not. Measured, no split is
    # needed and none is implemented — the numbers, all quoted from real runs:
    #
    #   BEFORE — 2 lanes (`web fable-bindings`), main @78a12e0f, run 30905562596 / job 91979709770
    #     job wall-clock          3m23s   (11:37:22Z → 11:40:45Z)
    #     `composition test` step 3m03s   (11:37:38Z → 11:40:41Z)
    #     web 68.6s · fable-bindings 60.7s · stages+alarms ~50s
    #
    #   ALL FOUR — PR #390 @19d04b1, run 30909455795 / job 91992266101
    #     job wall-clock          4m42s   (12:31:14Z → 12:35:56Z)
    #     `composition test` step 4m19s   (12:31:32Z → 12:35:51Z)
    #     console 34.5s · fable-bindings 76.6s · web 48.8s · fable-game 33.1s (truncated, see below)
    #     the #379 coverage gate and its 22-outcome self-demonstration: 0.5s
    #
    #   SHIPPED — 3 lanes (fable-game deferred, see below), @13f1008 run 30910578399 / job 91996034186
    #     job wall-clock          3m50s   (12:46:20Z → 12:50:10Z)   86 passed, 0 failed
    #     console 33.9s · fable-bindings 69.7s · web 49.6s · coverage gate 0.8s
    #
    # So the two lanes #379 was worried about cost +1m19s of job wall-clock against a 30-MINUTE
    # budget, and what actually ships costs +27s over the old hand-written pair while adding a
    # complete console lifecycle and the coverage gate. Even taking the worst figure here the job
    # uses under a fifth of its budget.
    #
    # THE fable-game FIGURE IS TRUNCATED, AND IT IS NAMED AS SUCH rather than banked. That lane
    # died 33s in on FS.GG.Templates#392 (its `build.sh` invokes the local `fable` tool bare and
    # never restores it) before reaching npm, the Fable compile, the Vite bundle, `dotnet publish`
    # or Playwright, so 33.1s is NOT that lane's cost. Measured properly — the complete lane, with
    # its blockers patched out locally, on 2026-08-04 — it runs GREEN END TO END IN 63s, Playwright
    # two-client scenario included. Scaling the 25s local prefix against the 33s CI paid for the
    # same work puts the full lane near 83s on a runner, i.e. this job at roughly 5m30s once #392
    # lands. Still a fifth of the budget.
    #
    # WHY THE LANE IS DEFERRED ANYWAY, AND WHY THAT IS NOT A BUDGET DECISION: it cannot pass on any
    # host until FS.GG.Templates#392 lands, and this is a REQUIRED context under `enforce_admins`,
    # so putting it here would wedge every PR in the repository — the #260 incident, deliberately.
    # (#385 was the other blocker and landed in PR #389 on 2026-08-04; #392 alone still reds it.)
    # The registry entry names the item and the release gate still runs the lane in full. Delete
    # that one line when it lands — #393 owns doing so — and the measurement above already covers
    # the result, so no re-measurement is owed.
    #
    # RAISING THIS TIMEOUT IS NOT THE REMEDY IF A LANE EVER OUTGROWS IT. #379 asks for the split to
    # be implemented instead. Note that a split cannot simply become a matrix: `composition` is the
    # protected context name, and a matrix would report `composition (web)` etc. while `composition`
    # itself never reported at all — leaving every PR "Expected" forever, unmergeable even by an
    # admin. Any split must keep one check named exactly `composition` (an aggregating job that
    # `needs:` the lane jobs).
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read         # pull the published Governance CLI from the org feed (below)
      pull-requests: read    # `scope` reads the PR's file list to apply the docs-only exemption
    steps:
      # The docs-only exemption that used to be a `paths-ignore` on the trigger (see the comment on
      # `push` above — same rule, and README.md stays in scope because the test greps it). Expressed
      # as a step, the job still REPORTS `composition` on a docs-only PR instead of never running:
      # a job whose later steps all skip still concludes `success`, which is what a required check
      # needs, whereas a workflow that never starts reports nothing and wedges the PR forever.
      #
      # Runs BEFORE checkout, and needs no working tree — so a docs-only PR skips the clone too, not
      # just the expensive stages.
      - name: Scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"     # push: the trigger's paths-ignore already filtered
            exit 0
          fi
          # NEVER SKIP ON AMBIGUITY, and never fail on it either. `composition` is a required check,
          # so aborting here (set -e on a 5xx or a secondary rate limit) would redden the gate and
          # block an unrelated PR on an API blip — with enforce_admins on, unmergeable by anyone
          # until someone re-runs it. If we cannot read the file list, run the full gate: slower, but
          # it can only ever be correct.
          if ! files="$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename')"; then
            echo '::warning::Could not read the PR file list — running the full gate rather than guessing.'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same reasoning for an empty list: "we could not tell", so run the gate.
          if [ -z "$files" ]; then
            echo '::warning::Empty PR file list — running the full gate rather than guessing.'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Prefix test in pure shell rather than `grep -qv`: the exit status of `-q` combined with
          # `-v` is not consistent across grep implementations, and the direction this would fail in
          # is "silently skip the build on a code change".
          run=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              docs/*) ;;                  # exempt
              *)      run=true; break ;;  # anything else earns the full gate
            esac
          done <<< "$files"
          if [ "$run" = 'true' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Docs-only change — skipping the full composition run (reporting success).'
            printf '%s\n' "$files" | sed 's/^/  /'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.run == 'true'
        with:
          dotnet-version: '10.0.x'
      # ── EVERY provider floor, graded against the live org registry (FS.GG.Templates#383) ──────
      #
      # This step used to live INSIDE the CLI install below, and it read exactly one descriptor:
      # `PROVIDER_DESCRIPTOR='providers/rendering.providers.yml'`. `providers/` holds five
      # descriptors and all five declare a `minimumFsggSdd` floor, so four of them were read by
      # NOTHING — they could be wrong, stale, or entirely absent while every required check stayed
      # green. That is not a hypothetical: `providers/web.providers.yml` shipped with no floor block
      # at all until FS.GG.Templates#381's round-1 repair, and nothing detected it for the whole life
      # of the descriptor. The old reader even carried a note asking whoever added a second
      # floor-declaring provider to "widen it here in the same change"; four were added by three
      # items and the widening never happened. That note is gone, because the checker enumerates
      # `providers/*.providers.yml` and a sixth descriptor is graded with no edit and nobody to
      # remember — the same lesson the lane-set budget above records for lane discovery (#379).
      #
      # IT RUNS BEFORE THE CLI INSTALL, deliberately: an incoherent mirror is a repository fact that
      # needs no feed, no PAT and no toolchain, so it should red in seconds rather than after a
      # multi-minute install. It also EXPORTS the agreed floor, which is what the install step then
      # asserts the resolved `fsgg-sdd` against — one value, read once, graded against the org
      # registry, instead of a hand-named file.
      #
      # ONE INVOCATION, AND THE ORDER INSIDE IT IS THE POINT (round-1 independent review of PR #397).
      # This was two commands — `--self-test` and then the grading — joined by `set -euo pipefail`.
      # That ordering meant a genuinely drifted descriptor aborted the step INSIDE the demonstration:
      # the live grading never ran, so CI showed no `FAIL providers/<file>:<line>` line, no `::error`,
      # no step summary and no remedy, and the developer was told "the verdict this gate publishes is
      # not evidence of anything. Fix the checker" — while the checker was fine and their mirror was
      # wrong. #383's own verification line ("reds it, naming both values") therefore held through the
      # bare CLI and NOT through CI, which is the only place anybody reads it. That is
      # FS.GG.Templates#349's shape: a gate that gained eloquence faster than correctness.
      #
      # The checker now grades the real subject FIRST and unconditionally, emits its diagnostics, and
      # only then runs the demonstration, combining both verdicts into one exit code. Do not split
      # this back into two commands, and do not put `--self-test` in front of it.
      #
      # THE DEMONSTRATION IS NOT DECORATION. It drives the checker's red arms offline against
      # normalized copies of the real descriptors — deleted block, floor below the pin, floor ahead of
      # the pin, unparseable floor, a second provider in one file, an unknown sixth descriptor,
      # unreadable local registry, and the anti-regression case asserting the fixture is independent
      # of whatever the org pin says today. A gate nobody has seen fail is a claim; this one
      # demonstrates it can fail on every run that reports green, the same shape as the #315
      # SKILL_ASSERT_REF alarm and the #379 coverage gate. It costs well under a second.
      #
      # THE AUTHORITY IS READ LIVE, AND AN OUTAGE REDS THIS. Read
      # scripts/check-provider-floors.py's header for why `main` rather than a pinned SHA, why
      # equality rather than `>=`, and why a registry advance is MEANT to wedge this repository
      # until the mirrors are re-cohered.
      - name: Grade provider minimumFsggSdd floors against the org registry
        id: floors
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          scripts/check-provider-floors.py \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"
      # Install the published FS-GG CLIs from the org feed so the gated stages ASSERT instead of
      # skipping (never green-by-omission). The feed is authenticated with a classic PAT
      # (secret FSGG_PACKAGES_PAT, scope `read:packages`): the GitHub Packages NuGet registry does
      # NOT accept GitHub App installation tokens (App tokens work only for the Container registry),
      # and the run-scoped GITHUB_TOKEN reads only PUBLIC org packages — but the full rendering
      # scaffold restores the PRIVATE FS.GG.UI.* closure. A classic PAT is the only credential that
      # reads private GitHub Packages NuGet here.
      #   - Governance CLI (>= 1.1.0, spec-081 consumer; FS.GG.Governance#28): drives the `govern`
      #     consumer/enforcement matrix. Required: an install failure reports the requested version
      #     and the tool inventory at the point of failure instead of becoming a later SKIP.
      #   - SDD CLI: puts `fsgg-sdd` on PATH, which flips BOTH the full scaffold+build stage and the
      #     producer seam (`fsgg-sdd ship` emits readiness/<id>/governance-handoff.json) from SKIP to
      #     a hard gate. Required (no `|| true`): if it cannot install we want CI to surface it, not
      #     silently drop the producer-seam coverage we are explicitly enabling here.
      #
      # ── PIN-VS-FLOAT FOR THE CLIs — DECIDED AT #317: FLOAT, BUT ASSERT AND PRINT THE RESULT ──
      #
      # This gate has three inputs and, until #317, recorded a pin decision for only two of them:
      # the FS.GG.UI.Template pin (providers/rendering.providers.yml) and the skill-union assertion
      # ref (SKILL_ASSERT_REF, tests/composition/lib/skill-union.sh, re-decided at #309). The third
      # is the `dotnet tool install` below — and it is not an incidental input, because
      # `fsgg-sdd scaffold` is what WRITES the tree Stage 5 and Stage 5b then assert (05-build.sh
      # calls it the sole mirror authority, Feature 056). Two inputs carrying an argued decision and the third
      # carrying neither a pin nor a decision was the actual defect. This block is the third
      # decision, in the same form as the other two: the reasoning, not just the outcome.
      #
      # THE INCIDENT THIS ANSWERS IS REAL AND WAS PAID FOR. #260: composition went red on `main`
      # when latest `fsgg-sdd` published 0.17.0 and scaffolded the 0.11.0-pinned template — a pair
      # that was never coherent. `composition` is a REQUIRED check under `enforce_admins`, so that
      # red wedged EVERY PR in the repo, unmergeable by anyone, including a comment-only providers
      # edit (#258). #260 cites closed #34 as the same shape, so it is a repeat, not a one-off.
      # PR #261 ("pin composition fsgg-sdd to 0.15.0 to unwedge the required check") was the interim
      # pin, and it was CLOSED UNMERGED; #260 then closed on the symptom — the template pin was
      # re-cohered (#258/#298/#307) and the durable question was never decided. That gap is #317.
      #
      # 1. NOT PINNED. Two reasons, both measured rather than asserted. (a) The float is deliberate
      #    dogfooding: this gate exists partly to catch producer regressions EARLY, and a pinned
      #    scaffolder stops seeing them until someone bumps. (b) There is nothing coherent to pin
      #    TO. The registry (FS-GG/.github registry/dependencies.yml, contract `fs-gg-ui-template`)
      #    declares `minimum-fsgg-sdd` and NO maximum — no coherent-set ceiling for the CLI axis
      #    exists anywhere in the org, so a pin here would be a hand-frozen number with no
      #    authority behind it. Renovate could move such a pin (the SKILL_ASSERT_REF git-refs
      #    manager in .github/renovate.json is the local precedent), but #310 measures that this
      #    repo's bump PRs pile up unmerged, and .github#843 / #309 are the incidents where a
      #    stale pin ran a known-wrong artifact under a green tick.
      # 2. NOT LEFT UNCHANGED EITHER. What made #260 expensive was not the drift, it was that the
      #    drift was ANONYMOUS: the gate printed no resolved CLI version, so a green yesterday and
      #    a red today were indistinguishable from a flake and had to be bisected against a PUBLISH
      #    DATE rather than against anything in this history. And `minimumFsggSdd` — the one
      #    coherence constraint that does exist for this axis — was decorative: declared in
      #    providers/rendering.providers.yml, referenced only in comments, asserted nowhere.
      # 3. SO: FLOAT, ASSERTED. The `floors` step above reads the declared floor out of EVERY
      #    provider descriptor, and the step below fails the gate when the resolved CLI is BELOW the
      #    agreed value and prints every resolved version into the job log, an annotation, and the
      #    step summary. The floor stops being decorative and a red names a VERSION.
      #    WHICH descriptors is not a detail this block gets to leave vague any more: when #317
      #    wrote "declared in providers/rendering.providers.yml" it was describing the only
      #    descriptor that existed, and the assertion stayed scoped to that one file while four more
      #    descriptors grew their own floors. #383 replaced the hand-named file with enumeration —
      #    see the `floors` step's block above.
      #
      # WHAT THIS DOES NOT DO — stated plainly, because an over-claiming decision block is the same
      # defect in a different place. A FLOOR CANNOT CATCH #260. #260's CLI was 0.17.0 against a
      # 0.11.0 template: far ABOVE the floor, and this assertion would have passed it green. Only a
      # coherent-set CEILING catches that class, and per (1)(b) no such ceiling is declared. What
      # changes is that #260's successor arrives with the offending version already NAMED in the
      # gate's own output instead of having to be reconstructed from publish dates.
      #
      # WHAT WOULD CHANGE THIS ANSWER: the registry gaining a maximum/coherent-set ceiling for the
      # fsgg-sdd orchestrator axis (coherence id `fsgg-sdd-orchestrator-axis`). Assert against it
      # here the same way the floor is asserted, and this becomes float-within-a-declared-range.
      # Do NOT hand-freeze a ceiling here in the meantime — that is (1)(b) with extra steps.
      - name: Install FS-GG CLIs (governance enforcement + sdd producer/scaffold)
        if: steps.scope.outputs.run == 'true'
        env:
          FEED_TOKEN: ${{ secrets.FSGG_PACKAGES_PAT }}
          # The ONE agreed floor, produced by the `floors` step above after it graded EVERY
          # descriptor under providers/ equal to registry `fs-gg-ui-template.minimum-fsgg-sdd`. It
          # arrives through `env:` rather than being interpolated into the script body: a `${{ }}`
          # expansion inside `run:` is textual substitution into shell source, and this value comes
          # from a repository file. The checker already refuses anything that is not a semver, so
          # this is defence in depth rather than the only guard — which is the point of having it.
          MIN_SDD: ${{ steps.floors.outputs.floor }}
        run: |
          dotnet nuget add source \
            --username fs-gg --password "$FEED_TOKEN" --store-password-in-clear-text \
            --name fs-gg-github "https://nuget.pkg.github.com/FS-GG/index.json" || true

          export PATH="$HOME/.dotnet/tools:$PATH"

          version_core() { printf '%s\n' "${1%%[-+]*}"; }

          # SemVer floor comparison. `sort -V` alone is wrong at exactly the point that matters
          # here: it orders `0.6.0-preview.1` AFTER `0.6.0`, where SemVer says a prerelease
          # PRECEDES its release. So compare release cores with `sort -V`, then break an
          # equal-core tie in SemVer's direction — a prerelease of the floor's own core is below
          # the floor. Returns 0 when $1 is below $2.
          version_below_floor() {
            installed_core="$(version_core "$1")"
            floor_core="$(version_core "$2")"
            if [ "$installed_core" != "$floor_core" ]; then
              [ "$(printf '%s\n%s\n' "$installed_core" "$floor_core" | sort -V | head -n1)" = "$installed_core" ]
              return
            fi
            case "$1:$2" in
              *-*:*-*) return 1 ;;   # both prerelease off one core — not adjudicated, not below
              *-*:*)   return 0 ;;   # a prerelease of the floor's own core is below the floor
              *)       return 1 ;;
            esac
          }

          # The `floors` step is a hard gate, so reaching here with an unusable MIN_SDD should be
          # impossible. Assert it anyway: an empty step output is exactly what a step that was
          # SKIPPED (a mis-edited `if:`) produces, and `install_global_tool` would then compare the
          # resolved CLI against the empty string and pass everything. Failing closed keeps the
          # #317 property — a green whose floor is unknown is not a green.
          case "$MIN_SDD" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error title=the agreed minimumFsggSdd floor did not arrive::steps.floors.outputs.floor is '${MIN_SDD:-<nothing>}'. That value is produced by the 'Grade provider minimumFsggSdd floors' step, which reads EVERY providers/*.providers.yml and grades each declared floor against registry fs-gg-ui-template.minimum-fsgg-sdd (#383). Without it this gate has no declared coherence constraint for the floating fsgg-sdd, so it FAILS rather than silently dropping the assertion and reporting a green that covers nothing (#317)."
              exit 1
              ;;
          esac

          {
            echo '### composition — resolved FS-GG CLI versions'
            echo
            echo 'These CLIs float to latest stable by design (see the decision block in this workflow, #317).'
            echo 'The versions below are what this run actually used, so a red here names a version, not a date.'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # $3 = declared floor; $4 = where that floor comes from (named in every diagnostic, so a
          # failure tells the reader which document to go argue with).
          install_global_tool() {
            package="$1"
            command_name="$2"
            floor="$3"
            floor_source="$4"
            requested_version='latest stable'
            installed_version="$(dotnet tool list --global |
              awk -v package="$package" 'tolower($1) == tolower(package) { print $2; exit }')"

            if [ -n "$installed_version" ]; then
              echo "$package $installed_version is already installed; requested $requested_version."
            elif dotnet tool install --global "$package"; then
              installed_version="$(dotnet tool list --global |
                awk -v package="$package" 'tolower($1) == tolower(package) { print $2; exit }')"
              echo "Installed $package ${installed_version:-unknown}; requested $requested_version."
            else
              install_status="$?"
              echo "::error title=$package installation failed::Requested version: $requested_version; dotnet tool install exited $install_status. Full diagnostics are above; the global tool inventory follows."
              dotnet tool list --global || true
              exit "$install_status"
            fi

            if ! command -v "$command_name" >/dev/null 2>&1; then
              echo "::error title=$package unavailable::$package is listed as ${installed_version:-unknown}, but '$command_name' is not available on PATH."
              exit 1
            fi

            # A float is only honest if what it resolved to is both ASSERTED and PRINTED (#317).
            if [ -z "$installed_version" ]; then
              echo "::error title=$package version unresolved::'$command_name' is on PATH, but 'dotnet tool list --global' reported no version for $package — so the declared floor $floor ($floor_source) cannot be asserted against it. Failing closed: a green whose CLI version is unknown is the green #260 had to bisect against a publish date (#317)."
              dotnet tool list --global || true
              exit 1
            fi
            if version_below_floor "$installed_version" "$floor"; then
              echo "::error title=$package $installed_version is below its declared floor::$package resolved to $installed_version, which is BELOW the declared minimum coherent version $floor ($floor_source). A CLI under the floor does not seed the artifacts a product on this template pin is expected to contain, so the tree the composition stages assert would be missing them for a reason unrelated to this repo's changes."
              exit 1
            fi
            echo "$package resolved to $installed_version (requested $requested_version; floor $floor from $floor_source)."
            echo "::notice title=$package $installed_version::requested $requested_version; at or above the declared floor $floor ($floor_source)"
            printf -- '- `%s` **%s** — requested %s; declared floor %s (%s)\n' \
              "$package" "$installed_version" "$requested_version" "$floor" "$floor_source" >> "$GITHUB_STEP_SUMMARY"
          }

          # The governance floor is the one this file already declares in prose above (spec-081
          # consumer, FS.GG.Governance#28). Asserting it adds no new dated claim — it makes the
          # claim that was already here checked instead of decorative.
          install_global_tool FS.GG.Governance.Cli fsgg-governance 1.1.0 \
            'declared in this workflow: spec-081 consumer, FS.GG.Governance#28'
          install_global_tool FS.GG.SDD.Cli fsgg-sdd "$MIN_SDD" \
            "minimumFsggSdd in EVERY providers/*.providers.yml, each graded EQUAL to registry fs-gg-ui-template.minimum-fsgg-sdd by scripts/check-provider-floors.py (#383)"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      # FS-GG/.github#7 (Feature 211 parity): locked restore against the committed
      # packages.lock.json. The packaging project has no NuGet dependencies today, so this is a
      # forward guardrail — if a PackageReference is ever added, drift fails CI instead of
      # resolving silently. Regenerate with: dotnet restore FS.GG.Templates.csproj --force-evaluate
      - name: Restore (locked)
        if: steps.scope.outputs.run == 'true'
        run: dotnet restore FS.GG.Templates.csproj --locked-mode
      # Owned stages (pack → install → instantiate → verify pins/links) run fully. With both
      # CLIs installed above, the gated stages also run as hard gates: the full fsgg-sdd
      # scaffold+build of the live rendering app (Stage 5), the producer seam (`fsgg-sdd ship`,
      # Stage 6a), and the governance enforcement matrix (Stage 6b). See tests/composition/run.sh.
      # KEEP_WORKDIR=1 stops run.sh's EXIT trap from rm -rf'ing the temp workdir, so the
      # pack/install/scaffold/build/govern logs survive for the failure-artifact upload below.
      # TMPDIR pins the mktemp base to a known path the upload step can glob (run.sh creates
      # $TMPDIR/fsgg-composition.XXXXXX). On green runs the workdir is just discarded with the runner.
      - name: composition test
        if: steps.scope.outputs.run == 'true'
        env:
          KEEP_WORKDIR: '1'
          TMPDIR: ${{ runner.temp }}/composition
        run: |
          mkdir -p "$TMPDIR"
          tests/composition/run.sh
      # Red runs otherwise leave only inline log tails; ship the full log set wholesale so a failure
      # is diagnosable without a re-run. Scoped to *.log to skip the built app tree.
      - name: Upload composition diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: composition-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/composition/fsgg-composition.*/**/*.log
          if-no-files-found: warn
          retention-days: 7

  # ── Why there is NO `skill-union-assert.yml` caller in this file (decision, Templates#313) ──
  #
  # DECIDED: the generated-product `uses:` caller of
  # FS-GG/.github/.github/workflows/skill-union-assert.yml is deliberately NOT wired here.
  # Templates#313 offered "wire it, or record an explicit decision that it is not being wired and
  # why" — this is that decision. Read it before adding a `uses:` block: the assertion it would add
  # is ALREADY RUNNING, and adding one would audit a different subject under the same name.
  #
  # 1. THE ASSERTION IS WIRED, FOR BOTH LANES, AND HAS BEEN SINCE 2026-07-02. #49 (roadmap T3.2)
  #    was delivered by PR #51 and closed correctly. It lives in the `composition` job above, not
  #    in a sibling job: tests/composition/lib/skill-union.sh defines assert_skill_union, and
  #    stages/05-build.sh calls it for the orchestrated lane (co-tenants fs-gg-sdd-*) and
  #    stages/05b-standalone.sh for the standalone spec-kit lane (speckit-*). Same authority
  #    script, not a reimplementation: it runs dist/skill-union-assert.sh — the self-contained
  #    bundle generated FROM FS-GG/.github scripts/skill-union-assert.sh — fetched
  #    content-addressed at the pinned SKILL_ASSERT_REF, and upstream's `skill-union-bundle` job
  #    reds on any drift between the bundle and its source.
  #
  # 2. WHY A `uses:` CANNOT AUDIT THIS SUBJECT. skill-union-assert.yml is CHECKOUT-SCOPED: it runs
  #    actions/checkout of the caller into `caller/` and asserts `caller/${product-path}`. This
  #    repo's subject is not in the checkout — it is packed → installed → scaffolded → built into a
  #    temp workdir INSIDE the composition job. A separate `uses:` job gets a clean runner with no
  #    such tree, and the reusable workflow has no artifact input to receive one. So a `uses:` here
  #    could only ever name a path COMMITTED TO THIS REPO — which, since templates/fs-gg-governance
  #    carries no skill roots, means this repo's own .claude/.codex/.agents skills/. That is item 5's
  #    subject, not #49's. (The nearest live example of the committed-tree shape is FS.GG.Rendering's
  #    template-base-skill-union.yml over its own template/base/ — in ITS checkout, so unreachable
  #    from a caller here.) The reusable workflow's own
  #    banner still predicts this repo as its first caller; that prediction was written before the
  #    subject was built, and it is a plan, not a fact. Correcting it — and the matching paragraph
  #    in FS-GG/.github docs/coordination/skill-union-assertion.md, which currently states the
  #    opposite of item 1 above as measured fact — is FS-GG/.github#1643.
  #
  # 3. NO SKIP PATH REMAINS IN CI, AND THE CHECK REPORTS UNDER A NAMED CONTEXT. The "grep for the
  #    failure string and skip" shape (ADR-0014 F2, consumer half) that #49 replaced is GONE: PR #51
  #    retired the `scaffold.providerWroteSddTree` grep-and-SKIP lockstep (#47), and any scaffold
  #    failure is now a hard composition failure. An unreachable assertion FAILS its lane rather than
  #    skipping it (assert_skill_union's FETCH arm calls `bad`, never `skip`).
  #    Say "in CI" and mean it, because `grep -n 'skip ' tests/composition/` finds three on this
  #    path and a reader must be able to reconcile them: 05-build.sh (fsgg-sdd absent),
  #    05b-standalone.sh (template not installable), skill-union.sh (jq absent). All three are
  #    HOST-CAPABILITY skips, and this workflow removes every one of those capabilities as a
  #    variable — the CLI install step above is a hard gate (it `exit`s on failure rather than
  #    `|| true`), which makes RUN_FULL=1, which routes 05b to `bad` instead of `skip`; and hosted
  #    runners ship jq. They are live only for a local dev run, which is where they belong. What is
  #    gone in EVERY environment is a skip keyed on the ASSERTION'S OWN result.
  #    The verdict reports under `composition`, which is a required status check on main.
  #
  # 4. THE TRIGGER IS ARMED OVER THE SCAFFOLD'S IN-REPO INPUTS — no `.github#332`/`#334`/`#880`
  #    fail-open. Every in-repo input to the scaffolded tree is outside the docs-only exemption above
  #    and so fires this workflow: providers/** (every descriptor — the FS.GG.UI.Template pin in
  #    rendering.providers.yml and the `minimumFsggSdd` floor in all five, #383), templates/**, and
  #    tests/composition/** (which carries SKILL_ASSERT_REF). Both of those pins are frozen to a
  #    version/SHA, so neither can move without a commit here.
  #
  #    IN-REPO IS THE HONEST SCOPE, AND THE REMAINDER IS NAMED RATHER THAN ROUNDED OFF. TWO inputs
  #    to this gate's verdict are NOT in any repo path and cannot be:
  #      (a) the `dotnet tool install` step above takes FS.GG.SDD.Cli at latest-stable, and
  #          `fsgg-sdd scaffold` is what WRITES the tree this gate then asserts (05-build.sh calls
  #          it the sole mirror authority, Feature 056);
  #      (b) since #383, the `floors` step reads registry `fs-gg-ui-template.minimum-fsgg-sdd` from
  #          FS-GG/.github@main. A registry advance there therefore reds this repository with no
  #          commit here — which is the WHOLE POINT of that step (it replaces waiting for a
  #          hand-filed re-mirror request), and is named here rather than left as a surprise.
  #    Both mean the subject can change with no commit here. That is a real limit on what a green
  #    here means — it is not a `#332` fail-open (the trigger is armed over everything a commit can
  #    touch, and neither a floating tool nor another repository's file can be covered by ANY
  #    `paths:` filter), but it is also not the "complete trigger set" an earlier draft claimed.
  #
  #    THAT LIMIT IS NOW DECIDED, AND IT IS STILL A LIMIT (#317). The pin-vs-float question this
  #    paragraph used to leave open is answered in the decision block on the CLI install step
  #    above: the CLIs KEEP FLOATING to latest stable, and the install step now asserts the
  #    resolved fsgg-sdd against the `minimumFsggSdd` floor mirrored in EVERY providers/ descriptor
  #    — graded equal to the org registry pin by the `floors` step (#383; it was rendering's file
  #    alone until then) — and prints every resolved CLI version into the job log, an annotation,
  #    and the step summary. Read that block for the reasoning; the two facts that
  #    matter HERE are what it did and did not change. It did NOT change this item's scope claim:
  #    a floating tool still cannot be covered by any `paths:` filter, the scaffolder can still
  #    change with no commit here, and a green here still does not mean the CLI axis is frozen.
  #    A FLOOR IS NOT A CEILING — #260's drift (CLI 0.17.0 over a 0.11.0 template pin) was far
  #    ABOVE the floor and would still pass. What it did change is that `minimumFsggSdd` is no
  #    longer decorative, and that the version this gate ran is in this gate's own output.
  #
  # 5. THIS IS NOT THIS REPO'S `receives: skill-union` ROW, and nothing here changes the gap count.
  #    That row is about this repository's OWN committed skill roots and needs a committed-root
  #    caller (default product-path, ADR-0065's two roots, trigger over those roots, all in ONE
  #    workflow file). FS.GG.Templates remains one of the open receiver gaps. Two subjects; per
  #    .github#1504/#628 one green never stands in for the other. Do not bank this as that.
  #
  # 6. HOW #313 CONCLUDED OTHERWISE, so the next audit does not repeat it: its evidence was
  #    `GET /search/code?q=skill-union+repo:FS-GG/FS.GG.Templates` returning 0 hits. That endpoint
  #    returns 0 for EVERY term in this repository — this repo is not code-search-indexed — so the
  #    probe cannot distinguish "absent" from "not indexed". A negative existence proof about this
  #    repo must come from the contents/git API or a clone, never from /search/code.
  #    (#313's other two probes — the workflow inventory and the reusable-call list — were correct,
  #    and they are what its one surviving observation rests on: no `uses:` exists here. Item 2 is
  #    why that is the intended state.)

  # ── Cross-repo contract-coherence gate ──────────────────────────────────────────────────
  # Adopted per FS-GG/.github#519 (decision: yes, the framework repos call it). The gate lives
  # in FS-GG/.github and is CALLED, never copied — it asserts that the org registry is
  # schema-valid and that its declared `fsgg-contracts` pin equals the ACTUAL FS.GG.Contracts
  # package version.
  #
  # `check-build-config: false` because registry/repos.yml does NOT list `build-config` under
  # this repo's `receives:` — it is not an adopter of the org-shared .NET build config, so the
  # drift leg has no subject here and would fail on a file this repo is not supposed to have.
  # This is read off the registry, not a workaround: if that `receives:` row ever gains
  # `build-config`, flip this to true in the same change.
  #
  # `packages: read` is MANDATORY for callers: the gate restores the typed fsgg-sdd registry
  # validator from the org GitHub Packages feed using the run-scoped GITHUB_TOKEN.
  contract-coherence:
    uses: FS-GG/.github/.github/workflows/contract-coherence.yml@main
    permissions:
      contents: read
      packages: read
    with:
      check-build-config: false
