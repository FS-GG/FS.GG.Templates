name: Rust and Go hosted BIND qualification

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact protected main commit to qualify
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: rust-go-hosted-bind-qualification
  cancel-in-progress: false

jobs:
  exact-main-p2-qualification:
    if: github.ref == 'refs/heads/main' && inputs.expected_head == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      QUALIFICATION_STATE: ${{ runner.temp }}/rust-go-bind-${{ github.run_id }}-${{ github.run_attempt }}
      COORDINATION_ROOT: ${{ runner.temp }}/coordination-c069
      ARTIFACT_ID: '11112465308'
      ARTIFACT_SHA256: d3ede2552d45357e505de41f34603adb458a815a20fc43dedae13f1650a56027
      EXECUTOR_REVISION: c069263c3e9e8780b1596eee82d2f6c017daa8df
    steps:
      - name: Check out the exact protected main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run finite source policy and rootless VFS preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_HEAD"
          test -z "$(find . -type f -name '*.pyc' -print -quit)"
          install -d -m 0700 "$QUALIFICATION_STATE"
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/language-route-bindings -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 eng/language-route-bindings/hosted-qualification.py preflight \
            --source-root "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" \
            --store-root "$QUALIFICATION_STATE/preflight-store" \
            --runroot "$QUALIFICATION_STATE/preflight-runroot" \
            > "$QUALIFICATION_STATE/preflight.json"

      - name: Verify public artifact metadata before download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/FS-GG/FS.GG.Templates/actions/artifacts/$ARTIFACT_ID" \
            > "$QUALIFICATION_STATE/artifact-api.json"
          python3 eng/language-route-bindings/hosted-qualification.py metadata \
            --input "$QUALIFICATION_STATE/artifact-api.json" \
            > "$QUALIFICATION_STATE/artifact-metadata.json"

      - name: Preserve exact hosted artifact download bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 600 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/FS-GG/FS.GG.Templates/actions/artifacts/$ARTIFACT_ID/zip" \
            --output "$QUALIFICATION_STATE/qualified-artifact.zip"
          test "$(sha256sum "$QUALIFICATION_STATE/qualified-artifact.zip" | cut -d' ' -f1)" = "$ARTIFACT_SHA256"

      - name: Install the executor's exact SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400

      - name: Build and verify the exact P2 executor and Akka dependency
        shell: bash
        run: |
          set -euo pipefail
          git init "$COORDINATION_ROOT"
          git -C "$COORDINATION_ROOT" remote add origin https://github.com/FS-GG/FS.GG.Coordination.git
          timeout 300 git -C "$COORDINATION_ROOT" fetch --depth=1 origin "$EXECUTOR_REVISION"
          git -C "$COORDINATION_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$COORDINATION_ROOT" rev-parse HEAD)" = "$EXECUTOR_REVISION"
          timeout 600 dotnet build "$COORDINATION_ROOT/src/FS.GG.Coordination.Orchestration.Execution/FS.GG.Coordination.Orchestration.Execution.fsproj" -c Release --nologo
          EXECUTOR="$COORDINATION_ROOT/src/FS.GG.Coordination.Orchestration.Execution/bin/Release/net10.0/FS.GG.Coordination.Orchestration.Execution.dll"
          AKKA="$HOME/.nuget/packages/akka/1.5.71/lib/net6.0/Akka.dll"
          test "$(sha256sum "$EXECUTOR" | cut -d' ' -f1)" = 6395cdf3feb6ee114685920d9ba8b48b624df01bb1d38b922b12da0bffa89daf
          test "$(sha256sum "$AKKA" | cut -d' ' -f1)" = 1ef266d80a923b25db758987a15e4db99acaa05863a236871bac4dbd6315c5b7
          printf 'EXECUTOR=%s\nAKKA=%s\n' "$EXECUTOR" "$AKKA" >> "$GITHUB_ENV"

      - name: Prepare original and derived policy-bound archives
        shell: bash
        run: |
          set -euo pipefail
          timeout 600 python3 eng/language-route-bindings/prepare.py \
            --artifact-zip "$QUALIFICATION_STATE/qualified-artifact.zip" \
            --executor-assembly "$EXECUTOR" --executor-compile-dependency "$AKKA" \
            --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" \
            --output "$QUALIFICATION_STATE/binding"
          timeout 600 python3 eng/language-route-bindings/derive-import.py \
            --rust-archive "$QUALIFICATION_STATE/binding/rust-candidate.oci.tar" \
            --go-archive "$QUALIFICATION_STATE/binding/go-candidate.oci.tar" \
            --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" \
            --output "$QUALIFICATION_STATE/derived"

      - name: Fresh-load and inspect both retained OCI identities
        shell: bash
        run: |
          set -euo pipefail
          for kind in rust go; do
            python3 eng/language-route-bindings/load-derived.py --kind "$kind" \
              --archive "$QUALIFICATION_STATE/derived/$kind-derived.oci.tar" \
              --receipt "$QUALIFICATION_STATE/derived/derived-import.json" \
              --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" \
              --store-root "$QUALIFICATION_STATE/$kind-store" --runroot "$QUALIFICATION_STATE/$kind-runroot" \
              --output "$QUALIFICATION_STATE/$kind-load.json" --podman /usr/bin/podman
          done

      - name: Freeze exact commands once
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$QUALIFICATION_STATE/commands" "$QUALIFICATION_STATE/executions" "$QUALIFICATION_STATE/refusals"
          deadline="$(date -u -d '+18 minutes' '+%Y-%m-%dT%H:%M:%S.%6NZ')"
          for kind in rust go; do
            dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/prepare-command.fsx -- \
              --kind "$kind" --source-revision "$EXPECTED_HEAD" \
              --command-id "$(< /proc/sys/kernel/random/uuid)" --idempotency-id "$kind-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --deadline "$deadline" --output "$QUALIFICATION_STATE/commands/$kind.json"
          done
          dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/prepare-command.fsx -- \
            --kind rust --source-revision "$EXPECTED_HEAD" \
            --command-id "$(< /proc/sys/kernel/random/uuid)" --idempotency-id "cancel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --deadline "$deadline" --output "$QUALIFICATION_STATE/commands/cancellation.json"

      - name: Execute each real journey and prove settled reconstruction
        shell: bash
        run: |
          set -euo pipefail
          execute() {
            local kind="$1" command="$2" output="$3" mode="${4:-execute}"
            local recovery=()
            if [[ "$mode" = recover ]]; then recovery=(--recover true); fi
            dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/execute.fsx -- \
              --binding "$QUALIFICATION_STATE/binding/binding.json" --kind "$kind" --command "$command" \
              --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" \
              --state-root "$QUALIFICATION_STATE/$kind-state" --store-root "$QUALIFICATION_STATE/$kind-store" \
              --runroot "$QUALIFICATION_STATE/$kind-runroot" --podman /usr/bin/podman --git /usr/bin/git --tar /usr/bin/tar \
              --output "$output" "${recovery[@]}"
          }
          for kind in rust go; do
            command="$QUALIFICATION_STATE/commands/$kind.json"
            execute "$kind" "$command" "$QUALIFICATION_STATE/executions/$kind-first.json"
            execute "$kind" "$command" "$QUALIFICATION_STATE/executions/$kind-duplicate.json"
            execute "$kind" "$command" "$QUALIFICATION_STATE/executions/$kind-recovered.json" recover
          done

      - name: Exercise actual cancellation and bounded recovery
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          common=(--binding "$QUALIFICATION_STATE/binding/binding.json" --kind rust --command "$QUALIFICATION_STATE/commands/cancellation.json" --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" --state-root "$QUALIFICATION_STATE/rust-state" --store-root "$QUALIFICATION_STATE/rust-store" --runroot "$QUALIFICATION_STATE/rust-runroot" --podman /usr/bin/podman --git /usr/bin/git --tar /usr/bin/tar)
          dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/execute.fsx -- "${common[@]}" --cancel-after-ms 2000 --output "$QUALIFICATION_STATE/executions/cancellation-first.json"
          dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/execute.fsx -- "${common[@]}" --recover true --output "$QUALIFICATION_STATE/executions/cancellation-recovered.json"

      - name: Prove wrong toolchain reference and source refusal
        shell: bash
        run: |
          set -euo pipefail
          common=(--binding "$QUALIFICATION_STATE/binding/binding.json" --kind rust --command "$QUALIFICATION_STATE/commands/rust.json" --source-root "$GITHUB_WORKSPACE" --source-revision "$EXPECTED_HEAD" --state-root "$QUALIFICATION_STATE/rust-state" --store-root "$QUALIFICATION_STATE/rust-store" --runroot "$QUALIFICATION_STATE/rust-runroot" --podman /usr/bin/podman --git /usr/bin/git --tar /usr/bin/tar)
          for probe in wrong-toolchain wrong-reference changed-source; do
            if dotnet fsi --reference:"$AKKA" --reference:"$EXECUTOR" eng/language-route-bindings/execute.fsx -- "${common[@]}" --refusal-probe "$probe" --output "$QUALIFICATION_STATE/refusals/$probe.json"; then
              echo "refusal probe unexpectedly passed: $probe" >&2; exit 1
            fi
            test "$(jq -r .disposition "$QUALIFICATION_STATE/refusals/$probe.json")" = refused
          done

      - name: Remove owned containers and VFS namespaces
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/language-route-bindings/hosted-qualification.py cleanup \
            --state "$QUALIFICATION_STATE" --allowed-root "$RUNNER_TEMP" \
            > "$QUALIFICATION_STATE/cleanup.json"
          find eng/language-route-bindings tests/language-route-bindings \
            -type d -name __pycache__ -prune -exec rm -rf -- {} +
          test -z "$(find eng/language-route-bindings tests/language-route-bindings -type f -name '*.pyc' -print -quit)"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate exact native evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/language-route-bindings/hosted-qualification.py validate \
            --state "$QUALIFICATION_STATE" --source-root "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" \
            --executor "$EXECUTOR" --akka "$AKKA" --output "$QUALIFICATION_STATE/qualification.json"

      - name: Retain exact download bytes and bounded native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rust-go-hosted-bind-${{ inputs.expected_head }}-${{ github.run_attempt }}
          path: |
            ${{ env.QUALIFICATION_STATE }}/qualified-artifact.zip
            ${{ env.QUALIFICATION_STATE }}/*.json
            ${{ env.QUALIFICATION_STATE }}/commands/*.json
            ${{ env.QUALIFICATION_STATE }}/executions/*.json
            ${{ env.QUALIFICATION_STATE }}/refusals/*.json
            ${{ env.QUALIFICATION_STATE }}/binding/binding.json
            ${{ env.QUALIFICATION_STATE }}/derived/derived-import.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
