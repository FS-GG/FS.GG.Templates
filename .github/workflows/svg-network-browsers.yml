name: svg-network-browsers

on:
  pull_request:
    branches: [main]
    paths: ['templates/fs-gg-fable-game/**', 'scripts/stage-svg-network-candidate.sh', 'tests/composition/fable-game/svg-network-observe.mjs', 'tests/composition/fable-game/verify-svg-network-browsers.sh', '.github/workflows/svg-network-browsers.yml']

permissions:
  contents: read

jobs:
  qualify:
    name: Two-client reconnect, resync and review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: templates
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Game
          ref: f024993774cd046edf5f3cb0ba047f2c79a882e2
          path: game
      - uses: actions/checkout@v7
        with:
          repository: FS-GG/FS.GG.Net
          ref: 49a90425d705cc11ec0a31549fabeb4a36ec0c85
          path: net
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.400'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser hosts
        working-directory: templates/templates/fs-gg-fable-game/Browser.Tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Enable qualified network namespace isolation
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/unshare --user --map-root-user --net -- /usr/bin/true
      - name: Qualify installed two-client candidate
        working-directory: templates
        run: bash tests/composition/fable-game/verify-svg-network-browsers.sh "$GITHUB_WORKSPACE/game" "$GITHUB_WORKSPACE/net" "$RUNNER_TEMP/svg-network-browsers"
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: svg-network-browsers-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/svg-network-browsers/*.json
            ${{ runner.temp }}/svg-network-browsers/*.log
          if-no-files-found: warn
          retention-days: 30
