# Opt-in Python Hello provider. Candidate composition rewrites `source` to the exact local archive;
# no registry/default/adoption setting selects this descriptor automatically.
schemaVersion: 1
providers:
  - name: python
    contractVersion: "1.1.0"
    templateId: fs-gg-python
    source: FS.GG.Workspace.Template::0.16.0
    nameParameter: productName
    minimumFsggSdd:
      version: "1.4.0-preview.1"
      requires: "Generic provider scaffold, lifecycle selection, provenance, refresh, and diagnostics"
      adr: "FS-GG/.github docs/adr/0084-semantic-reuse-never-cancels-coherent-validation.md"
    parameters:
      - key: productName
        required: true
      - key: lifecycle
        required: false
        default: sdd
