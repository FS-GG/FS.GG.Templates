name: Product qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Acquire exact Quint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/quint-co/quint/releases/download/v0.32.0/quint-linux-amd64 \
            --output "$RUNNER_TEMP/quint"
          echo '939b64095b706017f2f202c6f99c860c40be7c31bddc2b98557316e50f42cd7f  '"$RUNNER_TEMP/quint" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/quint"
      - name: Build and test installed product
        env:
          QUINT_BIN: ${{ runner.temp }}/quint
        run: bash ./build.sh
      - name: Qualify Firefox and WebKit journeys
        working-directory: Browser.Tests
        run: |
          set -euo pipefail
          npx playwright install --with-deps firefox webkit
          for family in firefox webkit; do
            PLAYWRIGHT_BROWSER_FAMILY="$family" npm test
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: product-test-reports
          path: artifacts/test-results
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        with:
          name: deployable-product
          path: |
            artifacts/releases/workspace-v1
            artifacts/svg-artifact-measurements.tsv
          if-no-files-found: error
